<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>拿破仑战争 · 卡牌对战</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Hiragino Sans", "Microsoft YaHei", Georgia, serif;
  background: #0e0a06;
  color: #e8d8b8;
  min-height: 100vh;
  overflow: hidden;
}

/* ── Animation keyframes ── */
@keyframes smoke-rise {
  0%   { opacity: 0.7; transform: translate(-50%,-50%) scale(0.6); }
  100% { opacity: 0; transform: translate(-50%, calc(-50% - 50px)) scale(1.6); }
}
@keyframes spark-fly {
  0%   { opacity: 1; transform: translate(-50%,-50%) translate(0,0); }
  100% { opacity: 0; transform: translate(-50%,-50%) translate(var(--dx), var(--dy)); }
}
@keyframes flash-burst {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.3); }
  30%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1.8); }
}
@keyframes damage-pop {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
  20%  { opacity: 1; transform: translate(-50%,-50%) scale(1.3); }
  60%  { opacity: 1; transform: translate(-50%, calc(-50% - 30px)) scale(1); }
  100% { opacity: 0; transform: translate(-50%, calc(-50% - 60px)) scale(0.8); }
}
@keyframes flash-fade {
  0%   { opacity: 1; }
  100% { opacity: 0; }
}
@keyframes card-deploy {
  0%   { transform: scale(1.5) rotateY(80deg); opacity: 0; filter: brightness(2); }
  60%  { transform: scale(1.1) rotateY(0); opacity: 1; filter: brightness(1.5); }
  100% { transform: scale(1) rotateY(0); opacity: 1; filter: brightness(1); }
}
@keyframes banner-sweep {
  0%   { opacity: 0; transform: translateX(-100%) skewX(-15deg); }
  20%  { opacity: 1; transform: translateX(0) skewX(0); }
  80%  { opacity: 1; transform: translateX(0) skewX(0); }
  100% { opacity: 0; transform: translateX(100%) skewX(15deg); }
}
@keyframes end-fade {
  0%   { opacity: 0; backdrop-filter: blur(0); }
  100% { opacity: 1; backdrop-filter: blur(8px); }
}
@keyframes drawn-arrive {
  0%   { transform: translateY(200px) rotate(0); opacity: 0; }
  100% { transform: translateY(0) rotate(0); opacity: 1; }
}

.battlefield-stage.shake { animation: none; }

/* canvas root */
#root { width: 100vw; height: 100vh; }
</style>
</head>
<body>

<div id="root"></div>

<script>
// Tweaks defaults — persisted via host
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "bgKind": "painting",
  "cardStyle": "oil",
  "mood": "cold",
  "speed": 1
}/*EDITMODE-END*/;
window.TWEAK_DEFAULTS = TWEAK_DEFAULTS;
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">

// DesignCanvas.jsx — Figma-ish design canvas wrapper
// Warm gray grid bg + Sections + Artboards + PostIt notes.
// Artboards are reorderable (grip-drag), labels/titles are inline-editable,
// and any artboard can be opened in a fullscreen focus overlay (←/→/Esc).
// State persists to a .design-canvas.state.json sidecar via the host
// bridge. No assets, no deps.
//
// Usage:
//   <DesignCanvas>
//     <DCSection id="onboarding" title="Onboarding" subtitle="First-run variants">
//       <DCArtboard id="a" label="A · Dusk" width={260} height={480}>…</DCArtboard>
//       <DCArtboard id="b" label="B · Minimal" width={260} height={480}>…</DCArtboard>
//     </DCSection>
//   </DesignCanvas>

const DC = {
  bg: '#f0eee9',
  grid: 'rgba(0,0,0,0.06)',
  label: 'rgba(60,50,40,0.7)',
  title: 'rgba(40,30,20,0.85)',
  subtitle: 'rgba(60,50,40,0.6)',
  postitBg: '#fef4a8',
  postitText: '#5a4a2a',
  font: '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif',
};

// One-time CSS injection (classes are dc-prefixed so they don't collide with
// the hosted design's own styles).
if (typeof document !== 'undefined' && !document.getElementById('dc-styles')) {
  const s = document.createElement('style');
  s.id = 'dc-styles';
  s.textContent = [
    '.dc-editable{cursor:text;outline:none;white-space:nowrap;border-radius:3px;padding:0 2px;margin:0 -2px}',
    '.dc-editable:focus{background:#fff;box-shadow:0 0 0 1.5px #c96442}',
    '[data-dc-slot]{transition:transform .18s cubic-bezier(.2,.7,.3,1)}',
    '[data-dc-slot].dc-dragging{transition:none;z-index:10;pointer-events:none}',
    '[data-dc-slot].dc-dragging .dc-card{box-shadow:0 12px 40px rgba(0,0,0,.25),0 0 0 2px #c96442;transform:scale(1.02)}',
    '.dc-card{transition:box-shadow .15s,transform .15s}',
    '.dc-card *{scrollbar-width:none}',
    '.dc-card *::-webkit-scrollbar{display:none}',
    '.dc-labelrow{display:flex;align-items:center;gap:4px;height:24px}',
    '.dc-grip{cursor:grab;display:flex;align-items:center;padding:5px 4px;border-radius:4px;transition:background .12s}',
    '.dc-grip:hover{background:rgba(0,0,0,.08)}',
    '.dc-grip:active{cursor:grabbing}',
    '.dc-labeltext{cursor:pointer;border-radius:4px;padding:3px 6px;display:flex;align-items:center;transition:background .12s}',
    '.dc-labeltext:hover{background:rgba(0,0,0,.05)}',
    '.dc-expand{position:absolute;bottom:100%;right:0;margin-bottom:5px;z-index:2;opacity:0;transition:opacity .12s,background .12s;',
    '  width:22px;height:22px;border-radius:5px;border:none;cursor:pointer;padding:0;',
    '  background:transparent;color:rgba(60,50,40,.7);display:flex;align-items:center;justify-content:center}',
    '.dc-expand:hover{background:rgba(0,0,0,.06);color:#2a251f}',
    '[data-dc-slot]:hover .dc-expand{opacity:1}',
  ].join('\n');
  document.head.appendChild(s);
}

const DCCtx = React.createContext(null);

// ─────────────────────────────────────────────────────────────
// DesignCanvas — stateful wrapper around the pan/zoom viewport.
// Owns runtime state (per-section order, renamed titles/labels, focused
// artboard). Order/titles/labels persist to a .design-canvas.state.json
// sidecar next to the HTML. Reads go via plain fetch() so the saved
// arrangement is visible anywhere the HTML + sidecar are served together
// (omelette preview, direct link, downloaded zip). Writes go through the
// host's window.omelette bridge — editing requires the omelette runtime.
// Focus is ephemeral.
// ─────────────────────────────────────────────────────────────
const DC_STATE_FILE = '.design-canvas.state.json';

function DesignCanvas({ children, minScale, maxScale, style }) {
  const [state, setState] = React.useState({ sections: {}, focus: null });
  // Hold rendering until the sidecar read settles so the saved order/titles
  // appear on first paint (no source-order flash). didRead gates writes until
  // the read settles so the empty initial state can't clobber a slow read;
  // skipNextWrite suppresses the one echo-write that would otherwise follow
  // hydration.
  const [ready, setReady] = React.useState(false);
  const didRead = React.useRef(false);
  const skipNextWrite = React.useRef(false);

  React.useEffect(() => {
    let off = false;
    fetch('./' + DC_STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((saved) => {
        if (off || !saved || !saved.sections) return;
        skipNextWrite.current = true;
        setState((s) => ({ ...s, sections: saved.sections }));
      })
      .catch(() => {})
      .finally(() => { didRead.current = true; if (!off) setReady(true); });
    const t = setTimeout(() => { if (!off) setReady(true); }, 150);
    return () => { off = true; clearTimeout(t); };
  }, []);

  React.useEffect(() => {
    if (!didRead.current) return;
    if (skipNextWrite.current) { skipNextWrite.current = false; return; }
    const t = setTimeout(() => {
      window.omelette?.writeFile(DC_STATE_FILE, JSON.stringify({ sections: state.sections })).catch(() => {});
    }, 250);
    return () => clearTimeout(t);
  }, [state.sections]);

  // Build registries synchronously from children so FocusOverlay can read
  // them in the same render. Only direct DCSection > DCArtboard children are
  // walked — wrapping them in other elements opts out of focus/reorder.
  const registry = {};     // slotId -> { sectionId, artboard }
  const sectionMeta = {};  // sectionId -> { title, subtitle, slotIds[] }
  const sectionOrder = [];
  React.Children.forEach(children, (sec) => {
    if (!sec || sec.type !== DCSection) return;
    const sid = sec.props.id ?? sec.props.title;
    if (!sid) return;
    sectionOrder.push(sid);
    const persisted = state.sections[sid] || {};
    const srcIds = [];
    React.Children.forEach(sec.props.children, (ab) => {
      if (!ab || ab.type !== DCArtboard) return;
      const aid = ab.props.id ?? ab.props.label;
      if (!aid) return;
      registry[`${sid}/${aid}`] = { sectionId: sid, artboard: ab };
      srcIds.push(aid);
    });
    const kept = (persisted.order || []).filter((k) => srcIds.includes(k));
    sectionMeta[sid] = {
      title: persisted.title ?? sec.props.title,
      subtitle: sec.props.subtitle,
      slotIds: [...kept, ...srcIds.filter((k) => !kept.includes(k))],
    };
  });

  const api = React.useMemo(() => ({
    state,
    section: (id) => state.sections[id] || {},
    patchSection: (id, p) => setState((s) => ({
      ...s,
      sections: { ...s.sections, [id]: { ...s.sections[id], ...(typeof p === 'function' ? p(s.sections[id] || {}) : p) } },
    })),
    setFocus: (slotId) => setState((s) => ({ ...s, focus: slotId })),
  }), [state]);

  // Esc exits focus; any outside pointerdown commits an in-progress rename.
  React.useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') api.setFocus(null); };
    const onPd = (e) => {
      const ae = document.activeElement;
      if (ae && ae.isContentEditable && !ae.contains(e.target)) ae.blur();
    };
    document.addEventListener('keydown', onKey);
    document.addEventListener('pointerdown', onPd, true);
    return () => {
      document.removeEventListener('keydown', onKey);
      document.removeEventListener('pointerdown', onPd, true);
    };
  }, [api]);

  return (
    <DCCtx.Provider value={api}>
      <DCViewport minScale={minScale} maxScale={maxScale} style={style}>{ready && children}</DCViewport>
      {state.focus && registry[state.focus] && (
        <DCFocusOverlay entry={registry[state.focus]} sectionMeta={sectionMeta} sectionOrder={sectionOrder} />
      )}
    </DCCtx.Provider>
  );
}

// ─────────────────────────────────────────────────────────────
// DCViewport — transform-based pan/zoom (internal)
//
// Input mapping (Figma-style):
//   • trackpad pinch  → zoom   (ctrlKey wheel; Safari gesture* events)
//   • trackpad scroll → pan    (two-finger)
//   • mouse wheel     → zoom   (notched; distinguished from trackpad scroll)
//   • middle-drag / primary-drag-on-bg → pan
//
// Transform state lives in a ref and is written straight to the DOM
// (translate3d + will-change) so wheel ticks don't go through React —
// keeps pans at 60fps on dense canvases.
// ─────────────────────────────────────────────────────────────
function DCViewport({ children, minScale = 0.1, maxScale = 8, style = {} }) {
  const vpRef = React.useRef(null);
  const worldRef = React.useRef(null);
  const tf = React.useRef({ x: 0, y: 0, scale: 1 });

  const apply = React.useCallback(() => {
    const { x, y, scale } = tf.current;
    const el = worldRef.current;
    if (el) el.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;
  }, []);

  React.useEffect(() => {
    const vp = vpRef.current;
    if (!vp) return;

    const zoomAt = (cx, cy, factor) => {
      const r = vp.getBoundingClientRect();
      const px = cx - r.left, py = cy - r.top;
      const t = tf.current;
      const next = Math.min(maxScale, Math.max(minScale, t.scale * factor));
      const k = next / t.scale;
      // keep the world point under the cursor fixed
      t.x = px - (px - t.x) * k;
      t.y = py - (py - t.y) * k;
      t.scale = next;
      apply();
    };

    // Mouse-wheel vs trackpad-scroll heuristic. A physical wheel sends
    // line-mode deltas (Firefox) or large integer pixel deltas with no X
    // component (Chrome/Safari, typically multiples of 100/120). Trackpad
    // two-finger scroll sends small/fractional pixel deltas, often with
    // non-zero deltaX. ctrlKey is set by the browser for trackpad pinch.
    const isMouseWheel = (e) =>
      e.deltaMode !== 0 ||
      (e.deltaX === 0 && Number.isInteger(e.deltaY) && Math.abs(e.deltaY) >= 40);

    const onWheel = (e) => {
      e.preventDefault();
      if (isGesturing) return; // Safari: gesture* owns the pinch — discard concurrent wheels
      if (e.ctrlKey) {
        // trackpad pinch (or explicit ctrl+wheel)
        zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.01));
      } else if (isMouseWheel(e)) {
        // notched mouse wheel — fixed-ratio step per click
        zoomAt(e.clientX, e.clientY, Math.exp(-Math.sign(e.deltaY) * 0.18));
      } else {
        // trackpad two-finger scroll — pan
        tf.current.x -= e.deltaX;
        tf.current.y -= e.deltaY;
        apply();
      }
    };

    // Safari sends native gesture* events for trackpad pinch with a smooth
    // e.scale; preferring these over the ctrl+wheel fallback gives a much
    // better feel there. No-ops on other browsers. Safari also fires
    // ctrlKey wheel events during the same pinch — isGesturing makes
    // onWheel drop those entirely so they neither zoom nor pan.
    let gsBase = 1;
    let isGesturing = false;
    const onGestureStart = (e) => { e.preventDefault(); isGesturing = true; gsBase = tf.current.scale; };
    const onGestureChange = (e) => {
      e.preventDefault();
      zoomAt(e.clientX, e.clientY, (gsBase * e.scale) / tf.current.scale);
    };
    const onGestureEnd = (e) => { e.preventDefault(); isGesturing = false; };

    // Drag-pan: middle button anywhere, or primary button on canvas
    // background (anything that isn't an artboard or an inline editor).
    let drag = null;
    const onPointerDown = (e) => {
      const onBg = !e.target.closest('[data-dc-slot], .dc-editable');
      if (!(e.button === 1 || (e.button === 0 && onBg))) return;
      e.preventDefault();
      vp.setPointerCapture(e.pointerId);
      drag = { id: e.pointerId, lx: e.clientX, ly: e.clientY };
      vp.style.cursor = 'grabbing';
    };
    const onPointerMove = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      tf.current.x += e.clientX - drag.lx;
      tf.current.y += e.clientY - drag.ly;
      drag.lx = e.clientX; drag.ly = e.clientY;
      apply();
    };
    const onPointerUp = (e) => {
      if (!drag || e.pointerId !== drag.id) return;
      vp.releasePointerCapture(e.pointerId);
      drag = null;
      vp.style.cursor = '';
    };

    vp.addEventListener('wheel', onWheel, { passive: false });
    vp.addEventListener('gesturestart', onGestureStart, { passive: false });
    vp.addEventListener('gesturechange', onGestureChange, { passive: false });
    vp.addEventListener('gestureend', onGestureEnd, { passive: false });
    vp.addEventListener('pointerdown', onPointerDown);
    vp.addEventListener('pointermove', onPointerMove);
    vp.addEventListener('pointerup', onPointerUp);
    vp.addEventListener('pointercancel', onPointerUp);
    return () => {
      vp.removeEventListener('wheel', onWheel);
      vp.removeEventListener('gesturestart', onGestureStart);
      vp.removeEventListener('gesturechange', onGestureChange);
      vp.removeEventListener('gestureend', onGestureEnd);
      vp.removeEventListener('pointerdown', onPointerDown);
      vp.removeEventListener('pointermove', onPointerMove);
      vp.removeEventListener('pointerup', onPointerUp);
      vp.removeEventListener('pointercancel', onPointerUp);
    };
  }, [apply, minScale, maxScale]);

  const gridSvg = `url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M120 0H0v120' fill='none' stroke='${encodeURIComponent(DC.grid)}' stroke-width='1'/%3E%3C/svg%3E")`;
  return (
    <div
      ref={vpRef}
      className="design-canvas"
      style={{
        height: '100vh', width: '100vw',
        background: DC.bg,
        overflow: 'hidden',
        overscrollBehavior: 'none',
        touchAction: 'none',
        position: 'relative',
        fontFamily: DC.font,
        boxSizing: 'border-box',
        ...style,
      }}
    >
      <div
        ref={worldRef}
        style={{
          position: 'absolute', top: 0, left: 0,
          transformOrigin: '0 0',
          willChange: 'transform',
          width: 'max-content', minWidth: '100%',
          minHeight: '100%',
          padding: '60px 0 80px',
        }}
      >
        <div style={{ position: 'absolute', inset: -6000, backgroundImage: gridSvg, backgroundSize: '120px 120px', pointerEvents: 'none', zIndex: -1 }} />
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// DCSection — editable title + h-row of artboards in persisted order
// ─────────────────────────────────────────────────────────────
function DCSection({ id, title, subtitle, children, gap = 48 }) {
  const ctx = React.useContext(DCCtx);
  const sid = id ?? title;
  const all = React.Children.toArray(children);
  const artboards = all.filter((c) => c && c.type === DCArtboard);
  const rest = all.filter((c) => !(c && c.type === DCArtboard));
  const srcOrder = artboards.map((a) => a.props.id ?? a.props.label);
  const sec = (ctx && sid && ctx.section(sid)) || {};

  const order = React.useMemo(() => {
    const kept = (sec.order || []).filter((k) => srcOrder.includes(k));
    return [...kept, ...srcOrder.filter((k) => !kept.includes(k))];
  }, [sec.order, srcOrder.join('|')]);

  const byId = Object.fromEntries(artboards.map((a) => [a.props.id ?? a.props.label, a]));

  return (
    <div data-dc-section={sid} style={{ marginBottom: 80, position: 'relative' }}>
      <div style={{ padding: '0 60px 56px' }}>
        <DCEditable tag="div" value={sec.title ?? title}
          onChange={(v) => ctx && sid && ctx.patchSection(sid, { title: v })}
          style={{ fontSize: 28, fontWeight: 600, color: DC.title, letterSpacing: -0.4, marginBottom: 6, display: 'inline-block' }} />
        {subtitle && <div style={{ fontSize: 16, color: DC.subtitle }}>{subtitle}</div>}
      </div>
      <div style={{ display: 'flex', gap, padding: '0 60px', alignItems: 'flex-start', width: 'max-content' }}>
        {order.map((k) => (
          <DCArtboardFrame key={k} sectionId={sid} artboard={byId[k]} order={order}
            label={(sec.labels || {})[k] ?? byId[k].props.label}
            onRename={(v) => ctx && ctx.patchSection(sid, (x) => ({ labels: { ...x.labels, [k]: v } }))}
            onReorder={(next) => ctx && ctx.patchSection(sid, { order: next })}
            onFocus={() => ctx && ctx.setFocus(`${sid}/${k}`)} />
        ))}
      </div>
      {rest}
    </div>
  );
}

// DCArtboard — marker; rendered by DCArtboardFrame via DCSection.
function DCArtboard() { return null; }

function DCArtboardFrame({ sectionId, artboard, label, order, onRename, onReorder, onFocus }) {
  const { id: rawId, label: rawLabel, width = 260, height = 480, children, style = {} } = artboard.props;
  const id = rawId ?? rawLabel;
  const ref = React.useRef(null);

  // Live drag-reorder: dragged card sticks to cursor; siblings slide into
  // their would-be slots in real time via transforms. DOM order only
  // changes on drop.
  const onGripDown = (e) => {
    e.preventDefault(); e.stopPropagation();
    const me = ref.current;
    // translateX is applied in local (pre-scale) space but pointer deltas and
    // getBoundingClientRect().left are screen-space — divide by the viewport's
    // current scale so the dragged card tracks the cursor at any zoom level.
    const scale = me.getBoundingClientRect().width / me.offsetWidth || 1;
    const peers = Array.from(document.querySelectorAll(`[data-dc-section="${sectionId}"] [data-dc-slot]`));
    const homes = peers.map((el) => ({ el, id: el.dataset.dcSlot, x: el.getBoundingClientRect().left }));
    const slotXs = homes.map((h) => h.x);
    const startIdx = order.indexOf(id);
    const startX = e.clientX;
    let liveOrder = order.slice();
    me.classList.add('dc-dragging');

    const layout = () => {
      for (const h of homes) {
        if (h.id === id) continue;
        const slot = liveOrder.indexOf(h.id);
        h.el.style.transform = `translateX(${(slotXs[slot] - h.x) / scale}px)`;
      }
    };

    const move = (ev) => {
      const dx = ev.clientX - startX;
      me.style.transform = `translateX(${dx / scale}px)`;
      const cur = homes[startIdx].x + dx;
      let nearest = 0, best = Infinity;
      for (let i = 0; i < slotXs.length; i++) {
        const d = Math.abs(slotXs[i] - cur);
        if (d < best) { best = d; nearest = i; }
      }
      if (liveOrder.indexOf(id) !== nearest) {
        liveOrder = order.filter((k) => k !== id);
        liveOrder.splice(nearest, 0, id);
        layout();
      }
    };

    const up = () => {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      const finalSlot = liveOrder.indexOf(id);
      me.classList.remove('dc-dragging');
      me.style.transform = `translateX(${(slotXs[finalSlot] - homes[startIdx].x) / scale}px)`;
      // After the settle transition, kill transitions + clear transforms +
      // commit the reorder in the same frame so there's no visual snap-back.
      setTimeout(() => {
        for (const h of homes) { h.el.style.transition = 'none'; h.el.style.transform = ''; }
        if (liveOrder.join('|') !== order.join('|')) onReorder(liveOrder);
        requestAnimationFrame(() => requestAnimationFrame(() => {
          for (const h of homes) h.el.style.transition = '';
        }));
      }, 180);
    };
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  };

  return (
    <div ref={ref} data-dc-slot={id} style={{ position: 'relative', flexShrink: 0 }}>
      <div className="dc-labelrow" style={{ position: 'absolute', bottom: '100%', left: -4, marginBottom: 4, color: DC.label }}>
        <div className="dc-grip" onPointerDown={onGripDown} title="Drag to reorder">

        </div>
        <div className="dc-labeltext" onClick={onFocus} title="Click to focus">
          <DCEditable value={label} onChange={onRename} onClick={(e) => e.stopPropagation()}
            style={{ fontSize: 15, fontWeight: 500, color: DC.label, lineHeight: 1 }} />
        </div>
      </div>
      <button className="dc-expand" onClick={onFocus} onPointerDown={(e) => e.stopPropagation()} title="Focus">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M7 1h4v4M5 11H1V7M11 1L7.5 4.5M1 11l3.5-3.5"/></svg>
      </button>
      <div className="dc-card"
        style={{ borderRadius: 2, boxShadow: '0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06)', overflow: 'hidden', width, height, background: '#fff', ...style }}>
        {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb', fontSize: 13, fontFamily: DC.font }}>{id}</div>}
      </div>
    </div>
  );
}

// Inline rename — commits on blur or Enter.
function DCEditable({ value, onChange, style, tag = 'span', onClick }) {
  const T = tag;
  return (
    <T className="dc-editable" contentEditable suppressContentEditableWarning
      onClick={onClick}
      onPointerDown={(e) => e.stopPropagation()}
      onBlur={(e) => onChange && onChange(e.currentTarget.textContent)}
      onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } }}
      style={style}>{value}</T>
  );
}

// ─────────────────────────────────────────────────────────────
// Focus mode — overlay one artboard; ←/→ within section, ↑/↓ across
// sections, Esc or backdrop click to exit.
// ─────────────────────────────────────────────────────────────
function DCFocusOverlay({ entry, sectionMeta, sectionOrder }) {
  const ctx = React.useContext(DCCtx);
  const { sectionId, artboard } = entry;
  const sec = ctx.section(sectionId);
  const meta = sectionMeta[sectionId];
  const peers = meta.slotIds;
  const aid = artboard.props.id ?? artboard.props.label;
  const idx = peers.indexOf(aid);
  const secIdx = sectionOrder.indexOf(sectionId);

  const go = (d) => { const n = peers[(idx + d + peers.length) % peers.length]; if (n) ctx.setFocus(`${sectionId}/${n}`); };
  const goSection = (d) => {
    const ns = sectionOrder[(secIdx + d + sectionOrder.length) % sectionOrder.length];
    const first = sectionMeta[ns] && sectionMeta[ns].slotIds[0];
    if (first) ctx.setFocus(`${ns}/${first}`);
  };

  React.useEffect(() => {
    const k = (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowUp') { e.preventDefault(); goSection(-1); }
      if (e.key === 'ArrowDown') { e.preventDefault(); goSection(1); }
    };
    document.addEventListener('keydown', k);
    return () => document.removeEventListener('keydown', k);
  });

  const { width = 260, height = 480, children } = artboard.props;
  const [vp, setVp] = React.useState({ w: window.innerWidth, h: window.innerHeight });
  React.useEffect(() => { const r = () => setVp({ w: window.innerWidth, h: window.innerHeight }); window.addEventListener('resize', r); return () => window.removeEventListener('resize', r); }, []);
  const scale = Math.max(0.1, Math.min((vp.w - 200) / width, (vp.h - 260) / height, 2));

  const [ddOpen, setDd] = React.useState(false);
  const Arrow = ({ dir, onClick }) => (
    <button onClick={(e) => { e.stopPropagation(); onClick(); }}
      style={{ position: 'absolute', top: '50%', [dir]: 28, transform: 'translateY(-50%)',
        border: 'none', background: 'rgba(255,255,255,.08)', color: 'rgba(255,255,255,.9)',
        width: 44, height: 44, borderRadius: 22, fontSize: 18, cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background .15s' }}
      onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.18)')}
      onMouseLeave={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.08)')}>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round">
        <path d={dir === 'left' ? 'M11 3L5 9l6 6' : 'M7 3l6 6-6 6'} /></svg>
    </button>
  );

  // Portal to body so position:fixed is the real viewport regardless of any
  // transform on DesignCanvas's ancestors (including the canvas zoom itself).
  return ReactDOM.createPortal(
    <div onClick={() => ctx.setFocus(null)}
      onWheel={(e) => e.preventDefault()}
      style={{ position: 'fixed', inset: 0, zIndex: 100, background: 'rgba(24,20,16,.6)', backdropFilter: 'blur(14px)',
        fontFamily: DC.font, color: '#fff' }}>

      {/* top bar: section dropdown (left) · close (right) */}
      <div onClick={(e) => e.stopPropagation()}
        style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 72, display: 'flex', alignItems: 'flex-start', padding: '16px 20px 0', gap: 16 }}>
        <div style={{ position: 'relative' }}>
          <button onClick={() => setDd((o) => !o)}
            style={{ border: 'none', background: 'transparent', color: '#fff', cursor: 'pointer', padding: '6px 8px',
              borderRadius: 6, textAlign: 'left', fontFamily: 'inherit' }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <span style={{ fontSize: 18, fontWeight: 600, letterSpacing: -0.3 }}>{meta.title}</span>
              <svg width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" style={{ opacity: .7 }}><path d="M2 4l3.5 3.5L9 4"/></svg>
            </span>
            {meta.subtitle && <span style={{ display: 'block', fontSize: 13, opacity: .6, fontWeight: 400, marginTop: 2 }}>{meta.subtitle}</span>}
          </button>
          {ddOpen && (
            <div style={{ position: 'absolute', top: '100%', left: 0, marginTop: 4, background: '#2a251f', borderRadius: 8,
              boxShadow: '0 8px 32px rgba(0,0,0,.4)', padding: 4, minWidth: 200, zIndex: 10 }}>
              {sectionOrder.map((sid) => (
                <button key={sid} onClick={() => { setDd(false); const f = sectionMeta[sid].slotIds[0]; if (f) ctx.setFocus(`${sid}/${f}`); }}
                  style={{ display: 'block', width: '100%', textAlign: 'left', border: 'none', cursor: 'pointer',
                    background: sid === sectionId ? 'rgba(255,255,255,.1)' : 'transparent', color: '#fff',
                    padding: '8px 12px', borderRadius: 5, fontSize: 14, fontWeight: sid === sectionId ? 600 : 400, fontFamily: 'inherit' }}>
                  {sectionMeta[sid].title}
                </button>
              ))}
            </div>
          )}
        </div>
        <div style={{ flex: 1 }} />
        <button onClick={() => ctx.setFocus(null)}
          onMouseEnter={(e) => (e.currentTarget.style.background = 'rgba(255,255,255,.12)')}
          onMouseLeave={(e) => (e.currentTarget.style.background = 'transparent')}
          style={{ border: 'none', background: 'transparent', color: 'rgba(255,255,255,.7)', width: 32, height: 32,
            borderRadius: 16, fontSize: 20, cursor: 'pointer', lineHeight: 1, transition: 'background .12s' }}>×</button>
      </div>

      {/* card centered, label + index below — only the card itself stops
          propagation so any backdrop click (including the margins around
          the card) exits focus */}
      <div
        style={{ position: 'absolute', top: 64, bottom: 56, left: 100, right: 100, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 16 }}>
        <div onClick={(e) => e.stopPropagation()} style={{ width: width * scale, height: height * scale, position: 'relative' }}>
          <div style={{ width, height, transform: `scale(${scale})`, transformOrigin: 'top left', background: '#fff', borderRadius: 2, overflow: 'hidden',
            boxShadow: '0 20px 80px rgba(0,0,0,.4)' }}>
            {children || <div style={{ height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#bbb' }}>{aid}</div>}
          </div>
        </div>
        <div onClick={(e) => e.stopPropagation()} style={{ fontSize: 14, fontWeight: 500, opacity: .85, textAlign: 'center' }}>
          {(sec.labels || {})[aid] ?? artboard.props.label}
          <span style={{ opacity: .5, marginLeft: 10, fontVariantNumeric: 'tabular-nums' }}>{idx + 1} / {peers.length}</span>
        </div>
      </div>

      <Arrow dir="left" onClick={() => go(-1)} />
      <Arrow dir="right" onClick={() => go(1)} />

      {/* dots */}
      <div onClick={(e) => e.stopPropagation()}
        style={{ position: 'absolute', bottom: 20, left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: 8 }}>
        {peers.map((p, i) => (
          <button key={p} onClick={() => ctx.setFocus(`${sectionId}/${p}`)}
            style={{ border: 'none', padding: 0, cursor: 'pointer', width: 6, height: 6, borderRadius: 3,
              background: i === idx ? '#fff' : 'rgba(255,255,255,.3)' }} />
        ))}
      </div>
    </div>,
    document.body,
  );
}

// ─────────────────────────────────────────────────────────────
// Post-it — absolute-positioned sticky note
// ─────────────────────────────────────────────────────────────
function DCPostIt({ children, top, left, right, bottom, rotate = -2, width = 180 }) {
  return (
    <div style={{
      position: 'absolute', top, left, right, bottom, width,
      background: DC.postitBg, padding: '14px 16px',
      fontFamily: '"Comic Sans MS", "Marker Felt", "Segoe Print", cursive',
      fontSize: 14, lineHeight: 1.4, color: DC.postitText,
      boxShadow: '0 2px 8px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08)',
      transform: `rotate(${rotate}deg)`,
      zIndex: 5,
    }}>{children}</div>
  );
}

Object.assign(window, { DesignCanvas, DCSection, DCArtboard, DCPostIt });

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// ── Style 3: Minimal (现代极简) ──────────────────────────────
function CardMinimal({ unit, faction, dead, damaged, scale = 1, onCard = false }) {

        <span style={{color: damaged ? '#c2552c' : '#2d5a3d'}}>{unit.hp}</span>

function Card({ style, ...props }) {
  if (style === 'heraldry') return <CardHeraldry {...props}/>;

function BattlefieldBg({ kind, mood }) {
  const moodPalette = {
    warm:   { sky1: '#5a3520', sky2: '#3a2010', sky3: '#1a0e08', sun: '#f5b568', smoke: '#6a4a30', mud: '#3a2818', accent: '#d4a55c' },

  if (kind === 'sandtable') {
    return <SandtableBg/>;

  if (kind === 'map') {
    return <MapBg/>;

  // Default: painted battlefield
  return <PaintedBattlefield p={moodPalette}/>;
}

// ─────────── Particle system ───────────
function spawnParticle(layer, x, y, kind = 'smoke', extra) {
  if (!layer) return;
  const p = document.createElement('div');
  p.style.cssText = `position:absolute;pointer-events:none;left:${x}px;top:${y}px;`;
  if (kind === 'smoke') {
    const size = 20 + Math.random() * 30;
    p.style.cssText += `
      width:${size}px;height:${size}px;border-radius:50%;
      background:radial-gradient(circle,rgba(220,200,180,0.7),transparent 70%);
      transform:translate(-50%,-50%);
      animation:smoke-rise ${1.2 + Math.random()*0.8}s ease-out forwards;`;
  } else if (kind === 'spark') {
    const size = 3 + Math.random() * 4;
    const angle = Math.random() * Math.PI * 2;
    const dist = 30 + Math.random() * 60;
    p.style.cssText += `
      width:${size}px;height:${size}px;border-radius:50%;
      background:#f5d889;box-shadow:0 0 ${size*2}px #f5d889;
      transform:translate(-50%,-50%);
      --dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist}px;
      animation:spark-fly 0.6s ease-out forwards;`;
  } else if (kind === 'flash') {
    p.style.cssText += `
      width:80px;height:80px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,240,200,1),rgba(255,200,100,0.3) 30%,transparent 70%);
      transform:translate(-50%,-50%);
      animation:flash-burst 0.4s ease-out forwards;`;
  } else if (kind === 'damage') {
    p.textContent = extra || '-1';
    p.style.cssText += `
      color:#ff5040;font-weight:900;font-size:32px;
      text-shadow:0 0 8px rgba(0,0,0,0.9),0 2px 0 #1a0a04;
      font-family:Georgia,serif;
      transform:translate(-50%,-50%);
      animation:damage-pop 1s ease-out forwards;`;
  }
  layer.appendChild(p);
  setTimeout(() => p.remove(), 1500);
}

// ─────────── Battlefield ───────────
function Battlefield({ theme, onSpeed }) {
  const speed = onSpeed || 1;
  const cardStyle = theme.cardStyle || 'oil';
  const bgKind = theme.bgKind || 'painting';
  const mood = theme.mood || 'cold';
  const p1Faction = theme.p1 || 'france';
  const p2Faction = theme.p2 || 'britain';

  const [turn, setTurn] = useState(1);
  const [activePlayer, setActivePlayer] = useState(1);
  const [p1HP, setP1HP] = useState(20);
  const [p2HP, setP2HP] = useState(20);
  const [p1Morale, setP1Morale] = useState(3);
  const [p2Morale, setP2Morale] = useState(3);
  const [hand, setHand] = useState([]);
  const [p1Deck, setP1Deck] = useState(() => {
    const d = window.FACTION_DECKS[p1Faction] || [];
    // build a 24-card deck and shuffle
    const arr = [];
    for (let i = 0; i < 24; i++) arr.push(d[i % d.length]);
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
  });
  const [p1Discard, setP1Discard] = useState([]);
  const [p2Hand, setP2Hand] = useState([1, 1, 1, 1]);
  const [p2Deck, setP2Deck] = useState(() => {
    const d = window.FACTION_DECKS[p2Faction] || [];
    const arr = [];
    for (let i = 0; i < 24; i++) arr.push(d[i % d.length]);
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
  });
  const [p2Discard, setP2Discard] = useState([]);
  const [showDiscard, setShowDiscard] = useState(null); // 'p1' | 'p2' | null
  const [hoverIdx, setHoverIdx] = useState(-1);
  const handRef = useRef(null);
  // Board layout:
  //   p2.rear  (P2's rear, top row)
  //   p2.front (P2's front, second row — touches skirmish)
  //   skirmish.shared (one shared row, holds both p1 and p2 units mixed)
  //   p1.front (third row)
  //   p1.rear  (bottom row)
  const [board, setBoard] = useState({
    p2rear:   [null, null, null, null],
    p2front:  [null, null, null, null],
    skirmish: [null, null, null, null],
    p1front:  [null, null, null, null],
    p1rear:   [null, null, null, null],
  });
  const [draggingCard, setDraggingCard] = useState(null);
  const [dragPos, setDragPos] = useState({ x: 0, y: 0 });
  const [hoveredSlot, setHoveredSlot] = useState(null);
  const [hoveredHand, setHoveredHand] = useState(null);
  const [shake, setShake] = useState(false);
  const [flash, setFlash] = useState(false);
  const [turnBanner, setTurnBanner] = useState(null);
  const [endScreen, setEndScreen] = useState(null);
  const [attacking, setAttacking] = useState(null);

  const fxLayer = useRef(null);
  const stage = useRef(null);
  const unitIdRef = useRef(1);

  useEffect(() => {
    drawCards(4);
    setTurnBanner({ turn: 1, player: 1 });
    setTimeout(() => setTurnBanner(null), 2200 / speed);
  }, []);

  function drawCards(n) {
    setP1Deck(deck => {
      const taken = deck.slice(0, n);
      const remain = deck.slice(n);
      const newCards = taken.map(t => ({ ...t, id: 'c' + (unitIdRef.current++), faction: p1Faction, drawing: true }));
      setHand(h => [...h, ...newCards]);
      setTimeout(() => setHand(h => h.map(c => ({ ...c, drawing: false }))), 600 / speed);
      return remain;
    });
  }

  // Which lines can P1 deploy to? Own front, own rear, and the shared skirmish.
  function canP1Deploy(lineKey) {
    return lineKey === 'p1front' || lineKey === 'p1rear' || lineKey === 'skirmish';
  }
  // For skirmish line, does this slot belong to player? (left 2 = p1, right 2 = p2 by convention — but let's allow any empty)

  function onCardMouseDown(e, card) {
    if (card.cost > p1Morale || activePlayer !== 1) return;
    e.preventDefault();
    setDraggingCard(card);
    const rect = stage.current.getBoundingClientRect();
    setDragPos({ x: e.clientX - rect.left, y: e.clientY - rect.top });
  }

  useEffect(() => {
    if (!draggingCard) return;
    function onMove(e) {
      const rect = stage.current.getBoundingClientRect();
      setDragPos({ x: e.clientX - rect.left, y: e.clientY - rect.top });
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const slot = el?.closest('[data-slot]');
      if (slot) {
        setHoveredSlot({
          line: slot.dataset.line,
          idx: parseInt(slot.dataset.idx),
        });
      } else {
        setHoveredSlot(null);
      }
    }
    function onUp() {
      if (hoveredSlot && draggingCard && canP1Deploy(hoveredSlot.line)) {
        const slotData = board[hoveredSlot.line][hoveredSlot.idx];
        if (!slotData) deployCard(draggingCard, hoveredSlot.line, hoveredSlot.idx);
      }
      setDraggingCard(null);
      setHoveredSlot(null);
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
  }, [draggingCard, hoveredSlot, board]);

  function deployCard(card, line, idx) {
    setBoard(b => {
      if (b[line][idx]) return b;
      const nextLine = [...b[line]];
      nextLine[idx] = { ...card, owner: 'p1', deployedTurn: turn, justDeployed: true };
      return { ...b, [line]: nextLine };
    });
    setHand(h => h.filter(c => c.id !== card.id));
    setP1Morale(m => m - card.cost);

    setTimeout(() => {
      const slotEl = document.querySelector(`[data-slot][data-line="${line}"][data-idx="${idx}"]`);
      if (slotEl) {
        const r = slotEl.getBoundingClientRect();
        const sr = stage.current.getBoundingClientRect();
        const cx = r.left + r.width/2 - sr.left;
        const cy = r.top + r.height/2 - sr.top;
        spawnParticle(fxLayer.current, cx, cy, 'flash');
        for (let i = 0; i < 8; i++) spawnParticle(fxLayer.current, cx, cy, 'spark');
        for (let i = 0; i < 5; i++) {
          setTimeout(() => spawnParticle(fxLayer.current, cx + (Math.random()-0.5)*40, cy + (Math.random()-0.5)*40, 'smoke'), i*60);
        }
      }
    }, 50);

    setTimeout(() => {
      setBoard(b => {
        const ln = b[line].map(u => u?.id === card.id ? { ...u, justDeployed: false } : u);
        return { ...b, [line]: ln };
      });
    }, 700 / speed);
  }

  // Attack: find target along line direction (toward enemy)
  function attackUnit(line, idx) {
    const unit = board[line][idx];
    if (!unit || unit.justDeployed || unit.owner !== 'p1') return;
    // Determine target line — p1 attacks "upward" (toward p2)
    const targetOrder = ['p1rear', 'p1front', 'skirmish', 'p2front', 'p2rear'];
    const myLineIdx = targetOrder.indexOf(line);
    let targetLine = null, targetIdx = null;
    for (let i = myLineIdx + 1; i < targetOrder.length; i++) {
      const ln = targetOrder[i];
      const t = board[ln][idx];
      if (t && t.owner === 'p2') { targetLine = ln; targetIdx = idx; break; }
    }
    const slotEl = document.querySelector(`[data-slot][data-line="${line}"][data-idx="${idx}"]`);
    const targetEl = targetLine
      ? document.querySelector(`[data-slot][data-line="${targetLine}"][data-idx="${targetIdx}"]`)
      : document.querySelector('[data-hq="p2"]');
    if (!slotEl || !targetEl) return;
    const sr = stage.current.getBoundingClientRect();
    const a = slotEl.getBoundingClientRect();
    const t = targetEl.getBoundingClientRect();
    const dx = t.left - a.left;
    const dy = t.top - a.top;
    setAttacking({ line, idx, dx: dx*0.55, dy: dy*0.55 });

    setTimeout(() => {
      const impactX = a.left + a.width/2 + dx*0.55 - sr.left;
      const impactY = a.top + a.height/2 + dy*0.55 - sr.top;
      spawnParticle(fxLayer.current, impactX, impactY, 'flash');
      for (let i = 0; i < 12; i++) spawnParticle(fxLayer.current, impactX, impactY, 'spark');
      for (let i = 0; i < 6; i++) {
        setTimeout(() => spawnParticle(fxLayer.current, impactX + (Math.random()-0.5)*30, impactY + (Math.random()-0.5)*30, 'smoke'), i*50);
      }
      const dmg = unit.atk;
      spawnParticle(fxLayer.current, impactX, impactY, 'damage', '-' + dmg);
      setShake(true); setFlash(true);
      setTimeout(() => { setShake(false); setFlash(false); }, 250);

      if (targetLine) {
        setBoard(b => {
          const ln = [...b[targetLine]];
          const tgt = ln[targetIdx];
          if (!tgt) return b;
          const newHp = tgt.hp - dmg;
          if (newHp <= 0) {
            ln[targetIdx] = { ...tgt, hp: 0, dead: true };
            // add to enemy discard
            if (tgt.owner === 'p2') setP2Discard(d => [...d, tgt]);
            else setP1Discard(d => [...d, tgt]);
            setTimeout(() => setBoard(bb => {
              const l2 = [...bb[targetLine]]; l2[targetIdx] = null;
              return { ...bb, [targetLine]: l2 };
            }), 800/speed);
            // counter
            const counter = tgt.atk;
            setTimeout(() => setBoard(b2 => {
              const myLn = [...b2[line]];
              if (myLn[idx]) {
                myLn[idx] = { ...myLn[idx], hp: myLn[idx].hp - counter };
                if (myLn[idx].hp <= 0) {
                  const dyingUnit = myLn[idx];
                  if (dyingUnit.owner === 'p1') setP1Discard(d => [...d, dyingUnit]);
                  else setP2Discard(d => [...d, dyingUnit]);
                  setTimeout(() => setBoard(bb => {
                    const l3 = [...bb[line]]; l3[idx] = null;
                    return { ...bb, [line]: l3 };
                  }), 800/speed);
                }
              }
              return { ...b2, [line]: myLn };
            }), 100);
          } else {
            ln[targetIdx] = { ...tgt, hp: newHp };
          }
          return { ...b, [targetLine]: ln };
        });
      } else {
        setP2HP(h => Math.max(0, h - dmg));
      }
    }, 280 / speed);

    setTimeout(() => setAttacking(null), 600 / speed);
  }

  function endTurn() {
    setActivePlayer(2);
    setTurnBanner({ turn, player: 2 });
    // simulated AI deploy
    setTimeout(() => {
      const deck = window.FACTION_DECKS[p2Faction];
      const u = deck[Math.floor(Math.random() * deck.length)];
      if (u.cost <= p2Morale) {
        const candidates = ['p2front', 'p2rear', 'skirmish'];
        for (const ln of candidates) {
          const idx = board[ln].findIndex(s => !s);
          if (idx >= 0) {
            setBoard(b => {
              const next = [...b[ln]];
              next[idx] = { ...u, id: 'e' + (unitIdRef.current++), faction: p2Faction, owner: 'p2', justDeployed: true };
              return { ...b, [ln]: next };
            });
            setP2Morale(m => m - u.cost);
            const slotEl = document.querySelector(`[data-slot][data-line="${ln}"][data-idx="${idx}"]`);
            if (slotEl) {
              const r = slotEl.getBoundingClientRect();
              const sr = stage.current.getBoundingClientRect();
              spawnParticle(fxLayer.current, r.left+r.width/2-sr.left, r.top+r.height/2-sr.top, 'flash');
            }
            break;
          }
        }
      }
    }, 1500/speed);

    setTimeout(() => {
      setTurnBanner(null);
      setActivePlayer(1);
      setTurn(t => t + 1);
      setP1Morale(m => Math.min(10, m + (turn + 1)));
      setP2Morale(m => Math.min(10, m + (turn + 1)));
      setTurnBanner({ turn: turn + 1, player: 1 });
      drawCards(1);
      setTimeout(() => setTurnBanner(null), 1800/speed);
    }, 3000 / speed);
  }

  useEffect(() => {
    if (p1HP <= 0 && !endScreen) setEndScreen('defeat');
    else if (p2HP <= 0 && !endScreen) setEndScreen('victory');
  }, [p1HP, p2HP]);

  const f1 = window.FACTIONS[p1Faction];
  const f2 = window.FACTIONS[p2Faction];

  // Line definitions (top to bottom)
  const lineDefs = [
    { key: 'p2rear',   label: '后方 · ARRIÈRE',         owner: 'p2', kind: 'rear' },
    { key: 'p2front',  label: '前线 · LIGNE DE FRONT',   owner: 'p2', kind: 'front' },
    { key: 'skirmish', label: '散兵线 · TIRAILLEURS',    owner: 'shared', kind: 'skirmish' },
    { key: 'p1front',  label: '前线 · LIGNE DE FRONT',   owner: 'p1', kind: 'front' },
    { key: 'p1rear',   label: '后方 · ARRIÈRE',         owner: 'p1', kind: 'rear' },
  ];

  return (
    <div ref={stage} className={'battlefield-stage' + (shake ? ' shake' : '')} style={{
      position: 'relative', width: '100%', height: '100%',
      borderRadius: 6, overflow: 'hidden',
      transform: shake ? `translate(${(Math.random()-0.5)*8}px,${(Math.random()-0.5)*8}px)` : 'none',
      transition: shake ? 'none' : 'transform 0.1s',
    }}>
      <BattlefieldBg kind={bgKind} mood={mood}/>

      {/* HQ bars top + bottom */}
      <HQBar side="p2" faction={f2} hp={p2HP} morale={p2Morale} active={activePlayer===2}/>
      <HQBar side="p1" faction={f1} hp={p1HP} morale={p1Morale} active={activePlayer===1}/>

      {/* Five lines */}
      <div style={{
        position: 'absolute',
        top: 92, bottom: 210,
        left: 12, right: 78,
        display: 'flex', flexDirection: 'column', gap: 6,
      }}>
        {lineDefs.map(def => (
          <Line key={def.key} def={def} board={board} hovered={hoveredSlot}
            f1={f1} f2={f2} cardStyle={cardStyle}
            attacking={attacking} onAttack={attackUnit} speed={speed}
            canHover={!!draggingCard && canP1Deploy(def.key)}
          />
        ))}
      </div>

      {/* enemy hand (top) */}
      <div style={{position: 'absolute', top: 4, left: '50%', transform: 'translateX(-50%)', display: 'flex', height: 46, zIndex: 6}}>
        {p2Hand.map((_, i) => (
          <div key={i} style={{
            width: 34, height: 46, marginLeft: i ? -12 : 0,
            background: `linear-gradient(135deg, ${f2.primary}, #1a1410)`,
            border: `1.5px solid ${f2.gold}`, borderRadius: 3,
            transform: `rotate(${(i-1.5)*5}deg) translateY(${Math.abs(i-1.5)*2}px)`,
            boxShadow: '0 2px 4px rgba(0,0,0,0.6)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <div dangerouslySetInnerHTML={{__html: f2.crest(22)}}/>
          </div>
        ))}
      </div>

      {/* player hand */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, height: 158,
        display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        pointerEvents: 'none', zIndex: 7,
      }}>
        {hand.map((card, i) => {
          const N = hand.length;
          const angle = (i - (N-1)/2) * 6;
          const offY = Math.abs(i - (N-1)/2) * 6;
          const isHovered = hoveredHand === card.id;
          const isDragging = draggingCard?.id === card.id;
          if (isDragging) return null;
          return (
            <div key={card.id} style={{
              position: 'relative',
              transform: `translateY(${card.drawing ? 200 : (isHovered ? -90 : offY)}px) rotate(${isHovered ? 0 : angle}deg) scale(${isHovered ? 1.4 : 1})`,
              transformOrigin: 'bottom center',
              transition: `transform ${0.4/speed}s cubic-bezier(.2,.8,.3,1)`,
              marginLeft: i ? -28 : 0,
              zIndex: isHovered ? 100 : i,
              pointerEvents: 'auto',
              cursor: card.cost <= p1Morale && activePlayer===1 ? 'grab' : 'not-allowed',
              opacity: card.cost > p1Morale ? 0.65 : 1,
              filter: isHovered ? 'drop-shadow(0 12px 24px rgba(0,0,0,0.8)) drop-shadow(0 0 20px rgba(212,165,92,0.4))' : 'drop-shadow(0 4px 6px rgba(0,0,0,0.5))',
            }}
            onMouseEnter={() => setHoveredHand(card.id)}
            onMouseLeave={() => setHoveredHand(null)}
            onMouseDown={(e) => onCardMouseDown(e, card)}
            >
              <window.Card style={cardStyle} unit={card} faction={card.faction} scale={0.95} onCard/>
            </div>
          );
        })}
      </div>

      {/* dragging ghost */}
      {draggingCard && (
        <div style={{
          position: 'absolute', left: dragPos.x, top: dragPos.y,
          transform: 'translate(-50%, -50%) rotate(-2deg) scale(1.1)',
          pointerEvents: 'none', zIndex: 999,
          filter: 'drop-shadow(0 16px 30px rgba(0,0,0,0.7))',
        }}>
          <window.Card style={cardStyle} unit={draggingCard} faction={draggingCard.faction} onCard/>
        </div>
      )}

      {/* End turn */}
      <button onClick={endTurn} disabled={activePlayer !== 1} style={{
        position: 'absolute', right: 16, top: '45%',
        background: activePlayer === 1
          ? `linear-gradient(180deg, #c8504c, #8b1a1a)`
          : `linear-gradient(180deg, #5a4530, #3a2818)`,
        color: '#f4ead0',
        border: `2px solid ${f1.gold}`,
        padding: '12px 8px',
        borderRadius: 4, cursor: activePlayer === 1 ? 'pointer' : 'default',
        fontFamily: 'Georgia, serif', fontWeight: 'bold',
        writingMode: 'vertical-rl',
        letterSpacing: 4, fontSize: 13,
        boxShadow: '0 4px 8px rgba(0,0,0,0.5)',
        zIndex: 10,
      }}>
        {activePlayer === 1 ? '结 束 回 合' : '敌 方 回 合'}
      </button>

      {flash && <div style={{position: 'absolute', inset: 0, background: 'rgba(255,240,200,0.4)', pointerEvents: 'none', zIndex: 50, animation: 'flash-fade 0.25s ease-out'}}/>}

      <div ref={fxLayer} style={{position: 'absolute', inset: 0, pointerEvents: 'none', zIndex: 60}}/>

      {turnBanner && <TurnBanner turn={turnBanner.turn} player={turnBanner.player} faction={turnBanner.player===1 ? f1 : f2} speed={speed}/>}
      {endScreen && <EndScreen kind={endScreen} faction={f1}/>}
    </div>
  );
}

// ─────────── HQ Bar ───────────
function HQBar({ side, faction, hp, morale, active }) {
  const top = side === 'p2';
  return (
    <div data-hq={side} style={{
      position: 'absolute',
      [top ? 'top' : 'bottom']: top ? 52 : 164,
      left: 12, right: 78,
      height: 36, padding: '4px 12px',
      background: `linear-gradient(90deg, ${faction.primary}cc 0%, rgba(0,0,0,0.6) 100%)`,
      border: `1px solid ${faction.gold}`,
      borderLeft: `4px solid ${faction.gold}`,
      borderRadius: 3,
      display: 'flex', alignItems: 'center', gap: 14,
      color: '#f4ead0', fontFamily: 'Georgia, serif',
      boxShadow: active ? `0 0 16px ${faction.gold}88, inset 0 0 12px rgba(0,0,0,0.4)` : 'inset 0 0 12px rgba(0,0,0,0.4)',
      zIndex: 5,
    }}>
      <div dangerouslySetInnerHTML={{__html: faction.crest(28)}}/>
      <div style={{flex: 1}}>
        <div style={{fontSize: 13, fontWeight: 'bold'}}>{faction.name}</div>
        <div style={{fontSize: 9, color: faction.gold, fontStyle: 'italic'}}>{faction.leader} · {faction.leaderTitle}</div>
      </div>
      <div style={{display: 'flex', gap: 18, fontSize: 11}}>
        <div>
          <div style={{color: faction.gold, fontSize: 9, letterSpacing: 1}}>HQ</div>
          <div style={{fontSize: 18, fontWeight: 900, color: hp < 8 ? '#ff5040' : '#f4ead0'}}>{hp}</div>
        </div>
        <div>
          <div style={{color: faction.gold, fontSize: 9, letterSpacing: 1}}>军令</div>
          <div style={{fontSize: 18, fontWeight: 900}}>{morale}/10</div>
        </div>
      </div>
    </div>
  );
}

// ─────────── Line ───────────
function Line({ def, board, hovered, f1, f2, cardStyle, attacking, onAttack, speed, canHover }) {
  const { key, label, owner, kind } = def;
  const slots = board[key];
  // Visual treatment per line kind
  const lineBg = kind === 'skirmish'
    ? `linear-gradient(to bottom, rgba(180,120,60,0.10), rgba(120,80,40,0.10))`
    : kind === 'front'
      ? `linear-gradient(to bottom, ${owner==='p1' ? 'rgba(74,111,165,0.10)' : 'rgba(139,26,26,0.10)'}, rgba(0,0,0,0.18))`
      : `rgba(0,0,0,0.18)`;
  const borderColor = owner === 'p1' ? `${f1.gold}66` : owner === 'p2' ? `${f2.gold}66` : `${f1.gold}33`;
  return (
    <div style={{
      flex: 1, display: 'flex', alignItems: 'stretch', gap: 6,
      background: lineBg,
      border: `1px ${kind === 'skirmish' ? 'dashed' : 'solid'} ${borderColor}`,
      borderRadius: 3,
      padding: '4px 8px',
      position: 'relative',
    }}>
      {/* line label */}
      <div style={{
        writingMode: 'vertical-rl', textOrientation: 'mixed',
        width: 22,
        color: owner === 'p1' ? f1.gold : owner === 'p2' ? f2.gold : '#a08560',
        fontSize: 9, letterSpacing: 2,
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        textShadow: '0 1px 2px #000', flexShrink: 0,
      }}>{label}</div>
      {/* 4 slots */}
      <div style={{flex: 1, display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 6, justifyItems: 'center', alignItems: 'center'}}>
        {slots.map((u, i) => (
          <Slot key={i} line={key} idx={i} unit={u}
            f1={f1} f2={f2}
            ownerLine={owner}
            hovered={hovered?.line===key && hovered?.idx===i}
            cardStyle={cardStyle}
            attacking={attacking?.line===key && attacking?.idx===i ? attacking : null}
            onAttack={() => onAttack(key, i)}
            speed={speed}
            canHover={canHover}
            kind={kind}
          />
        ))}
      </div>
    </div>
  );
}

// ─────────── Slot ───────────
function Slot({ line, idx, unit, f1, f2, ownerLine, hovered, cardStyle, attacking, onAttack, speed, canHover, kind }) {
  const isP2Unit = unit?.owner === 'p2';
  const transform = attacking
    ? `translate(${attacking.dx}px, ${attacking.dy}px) scale(1.05)`
    : 'none';
  return (
    <div data-slot data-line={line} data-idx={idx} style={{
      width: 88, height: 110,
      border: hovered && canHover
        ? `2px solid ${f1.gold}`
        : `1px dashed ${kind === 'skirmish' ? 'rgba(212,165,92,0.4)' : (ownerLine === 'p1' ? `${f1.gold}55` : `${f2.gold}55`)}`,
      borderRadius: 3,
      background: hovered && canHover ? `${f1.gold}30` : 'rgba(0,0,0,0.25)',
      boxShadow: hovered && canHover ? `0 0 16px ${f1.gold}88` : 'inset 0 0 12px rgba(0,0,0,0.35)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      transition: 'border-color 0.15s, background 0.15s, box-shadow 0.15s',
      position: 'relative',
    }}>
      {unit && (
        <div
          onClick={!isP2Unit ? onAttack : undefined}
          style={{
            transform: `${isP2Unit ? 'rotate(180deg) ' : ''}${transform}`,
            transition: attacking ? `transform ${0.28/speed}s cubic-bezier(.5,-0.4,.5,1.4)` : `transform ${0.4/speed}s ease-out`,
            cursor: !isP2Unit && !unit.justDeployed ? 'pointer' : 'default',
            animation: unit.justDeployed ? `card-deploy ${0.6/speed}s ease-out` : 'none',
            filter: unit.dead ? 'opacity(0.5) grayscale(1)' : (unit.justDeployed ? `drop-shadow(0 0 12px ${f1.gold})` : 'none'),
          }}>
          <window.Card style={cardStyle} unit={unit} faction={unit.faction}
            damaged={unit.hp < (window.FACTION_DECKS[unit.faction]?.find(c => c.name === unit.name)?.hp || unit.hp)}
            dead={unit.dead}
            scale={0.74} onCard/>
        </div>
      )}
    </div>
  );
}

// ─────────── Turn Banner ───────────
function TurnBanner({ turn, player, faction, speed }) {
  return (
    <div style={{
      position: 'absolute', inset: 0, display: 'flex',
      alignItems: 'center', justifyContent: 'center',
      pointerEvents: 'none', zIndex: 90,
      animation: `banner-sweep ${2/speed}s ease-out forwards`,
    }}>
      <div style={{
        background: `linear-gradient(90deg, transparent 0%, ${faction.primary}f0 20%, ${faction.primary}f0 80%, transparent 100%)`,
        borderTop: `2px solid ${faction.gold}`,
        borderBottom: `2px solid ${faction.gold}`,
        padding: '14px 80px', textAlign: 'center',
        color: '#f4ead0', fontFamily: 'Georgia, serif',
        boxShadow: `0 0 30px ${faction.gold}aa`,
        minWidth: '70%',
      }}>
        <div style={{fontSize: 14, color: faction.gold, letterSpacing: 6, marginBottom: 4}}>
          ── 第 {turn} 回合 · TURN {turn} ──
        </div>
        <div style={{fontSize: 26, fontWeight: 900, letterSpacing: 4, textShadow: '0 2px 4px rgba(0,0,0,0.8)'}}>
          {player === 1 ? '我方行动' : '敌方行动'}
        </div>
        <div style={{fontSize: 11, color: faction.gold, marginTop: 4, fontStyle: 'italic'}}>{faction.motto}</div>
      </div>
    </div>
  );
}

// ─────────── End Screen ───────────
function EndScreen({ kind, faction }) {
  const isWin = kind === 'victory';
  return (
    <div style={{
      position: 'absolute', inset: 0,
      background: `radial-gradient(ellipse at center, ${isWin ? 'rgba(20,40,20,0.85)' : 'rgba(40,10,10,0.9)'}, rgba(0,0,0,0.95))`,
      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
      zIndex: 200, color: '#f4ead0',
      animation: 'end-fade 0.8s ease-out',
    }}>
      <div style={{fontSize: 80, marginBottom: 12, color: isWin ? faction.gold : '#8b6f47'}}>
        {isWin ? (
          <svg width="100" height="100" viewBox="0 0 100 100">
            <defs>
              <radialGradient id="medal-grad" cx="0.3" cy="0.3"><stop offset="0" stopColor="#f5d889"/><stop offset="1" stopColor="#8b6f1e"/></radialGradient>
            </defs>
            <path d="M50,15 L60,35 L60,55 L50,65 L40,55 L40,35 Z" fill="#8b1a1a"/>
            <circle cx="50" cy="65" r="22" fill="url(#medal-grad)" stroke="#3a2818" strokeWidth="2"/>
            <path d="M50,52 L53,62 L63,62 L55,68 L58,78 L50,72 L42,78 L45,68 L37,62 L47,62 Z" fill="#3a2818"/>
          </svg>
        ) : (
          <svg width="100" height="100" viewBox="0 0 100 100">
            <path d="M30,30 Q30,15 50,15 Q70,15 70,30 L70,55 Q70,60 65,60 L60,60 L60,70 L40,70 L40,60 L35,60 Q30,60 30,55 Z" fill="#8b6f47"/>
            <circle cx="40" cy="38" r="4" fill="#1a0a04"/><circle cx="60" cy="38" r="4" fill="#1a0a04"/>
            <path d="M45,50 Q50,53 55,50" fill="none" stroke="#1a0a04" strokeWidth="2"/>
          </svg>
        )}
      </div>
      <div style={{fontSize: 48, fontWeight: 900, letterSpacing: 12, color: isWin ? faction.gold : '#c2552c', textShadow: '0 4px 8px rgba(0,0,0,0.8)', fontFamily: 'Georgia, serif'}}>
        {isWin ? '胜  利' : '败  北'}
      </div>
      <div style={{fontSize: 14, color: '#a08560', marginTop: 8, letterSpacing: 4, fontStyle: 'italic'}}>
        {isWin ? 'VICTOIRE · ' + faction.motto : 'DÉFAITE'}
      </div>
    </div>
  );
}

window.Battlefield = Battlefield;

</script>

<script type="text/babel">
const { useState, useEffect } = React;

// 4 variations — different combinations of bg/card/mood/factions
const VARIATIONS = [
  {
    id: 'v1', label: 'A · 滑铁卢黄昏', subtitle: '油画 + 战画 + 黄昏',
    bgKind: 'painting', cardStyle: 'oil', mood: 'dusk',
    p1: 'france', p2: 'britain',
  },
  {
    id: 'v2', label: 'B · 博罗季诺夜战', subtitle: '油画 + 战画 + 夜战',
    bgKind: 'painting', cardStyle: 'oil', mood: 'night',
    p1: 'france', p2: 'russia',
  },
  {
    id: 'v3', label: 'C · 总参谋部沙盘', subtitle: '纹章 + 沙盘 + 暖棕',
    bgKind: 'sandtable', cardStyle: 'heraldry', mood: 'warm',
    p1: 'prussia', p2: 'austria',
  },
  {
    id: 'v4', label: 'D · 战略地图厅', subtitle: '极简 + 地图 + 冷蓝',
    bgKind: 'map', cardStyle: 'minimal', mood: 'cold',
    p1: 'spain', p2: 'france',
  },
];

function App() {
  if (!window.useTweaks || !window.DesignCanvas || !window.Battlefield) {
    return <div style={{padding:40,color:'#f4ead0',fontFamily:'monospace'}}>Loading... missing: {[
      !window.useTweaks && 'useTweaks',
      !window.DesignCanvas && 'DesignCanvas',
      !window.Battlefield && 'Battlefield',
      !window.Card && 'Card',
      !window.FACTIONS && 'FACTIONS',
    ].filter(Boolean).join(', ')}</div>;
  }
  const [tweaks, setTweak] = window.useTweaks(window.TWEAK_DEFAULTS);
  const [focusedVariation, setFocusedVariation] = useState(null);

  return (
    <window.DesignCanvas>
      <window.DCSection id="napoleon" title="拿破仑战争 · 卡牌对战" subtitle="4 个视觉方向 — 拖拽手牌部署单位 · 点击单位攻击 · 右侧结束回合">

        {VARIATIONS.map(v => (
          <window.DCArtboard
            key={v.id} id={v.id} label={v.label}
            width={1280} height={1080}
          >
            <div style={{width: '100%', height: '100%', background: '#0e0a06', position: 'relative'}}>
              <window.Battlefield
                theme={{
                  bgKind: tweaks.bgKind === 'default' ? v.bgKind : tweaks.bgKind,
                  cardStyle: tweaks.cardStyle === 'default' ? v.cardStyle : tweaks.cardStyle,
                  mood: tweaks.mood === 'default' ? v.mood : tweaks.mood,
                  p1: v.p1, p2: v.p2,
                }}
                onSpeed={tweaks.speed}
              />
            </div>
            {/* corner subtitle plate */}
            <div style={{
              position: 'absolute', bottom: 8, left: 12,
              background: 'rgba(0,0,0,0.6)', color: '#d4a55c',
              padding: '4px 10px', borderRadius: 3, fontSize: 11,
              border: '1px solid rgba(212,165,92,0.4)',
              fontFamily: 'Georgia, serif', letterSpacing: 1,
              pointerEvents: 'none',
            }}>{v.subtitle}</div>
          </window.DCArtboard>
        ))}

      </window.DCSection>

      <window.TweaksPanel title="Tweaks">
        <window.TweakSection title="战场背景">
          <window.TweakRadio
            label="背景类型"
            value={tweaks.bgKind}
            options={[
              {value: 'default', label: '按变体'},
              {value: 'painting', label: '战画'},
              {value: 'sandtable', label: '沙盘'},
              {value: 'map', label: '地图'},
            ]}
            onChange={v => setTweak('bgKind', v)}
          />
          <window.TweakSelect
            label="色调"
            value={tweaks.mood}
            options={[
              {value: 'default', label: '按变体默认'},
              {value: 'warm', label: '暖棕 · 黎明'},
              {value: 'cold', label: '冷蓝 · 清晨'},
              {value: 'dusk', label: '黄昏 · 滑铁卢'},
              {value: 'night', label: '夜战 · 博罗季诺'},
            ]}
            onChange={v => setTweak('mood', v)}
          />
        </window.TweakSection>

        <window.TweakSection title="卡牌样式">
          <window.TweakRadio
            label="卡面"
            value={tweaks.cardStyle}
            options={[
              {value: 'default', label: '按变体'},
              {value: 'oil', label: '油画'},
              {value: 'heraldry', label: '纹章'},
              {value: 'minimal', label: '极简'},
            ]}
            onChange={v => setTweak('cardStyle', v)}
          />
        </window.TweakSection>

        <window.TweakSection title="动画">
          <window.TweakSlider
            label="动画速度"
            value={tweaks.speed}
            min={0.3} max={3} step={0.1}
            onChange={v => setTweak('speed', v)}
            format={v => v.toFixed(1) + 'x'}
          />
        </window.TweakSection>
      </window.TweaksPanel>
    </window.DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

</body>
</html>
