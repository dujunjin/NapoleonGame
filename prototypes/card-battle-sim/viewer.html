<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>拿破仑卡牌模拟器 - 对局回放</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: "Hiragino Sans", "Microsoft YaHei", sans-serif;
    background: #1a1410;
    color: #e8d8b8;
    min-height: 100vh;
    background-image:
        radial-gradient(ellipse at top, rgba(80,40,20,0.4) 0%, transparent 60%),
        repeating-linear-gradient(45deg, transparent 0, transparent 10px, rgba(255,255,255,0.01) 10px, rgba(255,255,255,0.01) 20px);
}

.container { max-width: 1400px; margin: 0 auto; padding: 20px; }

header {
    text-align: center;
    border-bottom: 2px solid #8b6f47;
    padding: 16px 0;
    margin-bottom: 20px;
    position: relative;
}
header h1 {
    font-size: 28px;
    letter-spacing: 4px;
    color: #d4a55c;
    text-shadow: 2px 2px 0 #000;
}
header .subtitle { font-size: 13px; color: #8b6f47; margin-top: 6px; }

/* 控制条 */
.controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #2a1f15;
    border: 1px solid #5a4530;
    border-radius: 4px;
    padding: 12px 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
}
.controls .turn-info {
    font-size: 16px;
    font-weight: bold;
}
.controls .turn-info .turn-num { color: #d4a55c; font-size: 22px; }
.controls .turn-info .active { color: #c2956b; }

.btn {
    background: #5a4530;
    color: #e8d8b8;
    border: 1px solid #8b6f47;
    padding: 8px 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    border-radius: 3px;
    transition: all 0.15s;
}
.btn:hover { background: #8b6f47; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary { background: #8b3a1f; border-color: #c2552c; }
.btn.primary:hover { background: #c2552c; }

.btn-group { display: flex; gap: 6px; }

/* 主战场布局 */
.battlefield {
    display: grid;
    grid-template-rows: auto auto auto auto auto auto auto;
    gap: 10px;
    background: linear-gradient(to bottom, #3a2818 0%, #2a1f15 50%, #3a2818 100%);
    border: 2px solid #8b6f47;
    border-radius: 6px;
    padding: 16px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
}

/* HQ 区域 */
.hq {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: rgba(0,0,0,0.3);
    border-radius: 3px;
}
.hq.p1 { border-left: 4px solid #4a6fa5; }  /* 法兰西蓝 */
.hq.p2-prussia { border-left: 4px solid #4a4a4a; }  /* 普鲁士黑 */
.hq.p2-russia { border-left: 4px solid #2d5a3d; }  /* 俄罗斯绿 */
.hq.p2-france { border-left: 4px solid #4a6fa5; }
.hq .name { font-size: 18px; font-weight: bold; }
.hq .stats { display: flex; gap: 24px; font-size: 14px; }
.hq .stat-label { color: #8b6f47; margin-right: 4px; }
.hq .hq-hp { font-size: 24px; color: #c2552c; font-weight: bold; }

/* 战线 */
.line {
    min-height: 110px;
    background: rgba(0,0,0,0.2);
    border: 1px solid #5a4530;
    border-radius: 3px;
    padding: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.line-label {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    width: 28px;
    color: #8b6f47;
    font-size: 12px;
    letter-spacing: 2px;
    border-right: 1px dashed #5a4530;
    padding-right: 8px;
    flex-shrink: 0;
}
.units-container {
    flex: 1;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.line.skirmish {
    background: linear-gradient(to bottom, rgba(180,120,60,0.15), rgba(120,80,40,0.15));
    border: 1px dashed #8b6f47;
}

.line-divider {
    text-align: center;
    color: #8b6f47;
    font-size: 11px;
    letter-spacing: 6px;
    padding: 4px 0;
    border-top: 1px dashed #5a4530;
    border-bottom: 1px dashed #5a4530;
}

/* 单位卡 */
.unit {
    width: 90px;
    height: 110px;
    background: linear-gradient(135deg, #f4e4c1 0%, #d4b88a 100%);
    border: 2px solid #2a1f15;
    border-radius: 3px;
    color: #2a1f15;
    padding: 4px;
    display: flex;
    flex-direction: column;
    box-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    font-size: 10px;
    position: relative;
    flex-shrink: 0;
}
.unit.faction-法兰西 { border-color: #4a6fa5; }
.unit.faction-普鲁士 { border-color: #1a1a1a; }
.unit.faction-俄罗斯 { border-color: #2d5a3d; }

.unit .cost {
    position: absolute;
    top: -6px;
    left: -6px;
    width: 22px;
    height: 22px;
    background: #8b3a1f;
    color: #fff;
    border: 2px solid #2a1f15;
    border-radius: 50%;
    text-align: center;
    line-height: 18px;
    font-weight: bold;
    font-size: 12px;
}
.unit .name {
    font-weight: bold;
    font-size: 11px;
    text-align: center;
    margin-top: 6px;
    line-height: 1.2;
    height: 28px;
    overflow: hidden;
    border-bottom: 1px solid #8b6f47;
    padding-bottom: 2px;
}
.unit .type {
    font-size: 9px;
    color: #5a4530;
    text-align: center;
    margin: 2px 0;
}
.unit .keywords {
    font-size: 8px;
    color: #2a4a8b;
    text-align: center;
    flex: 1;
    line-height: 1.3;
}
.unit .stats-row {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid #8b6f47;
    padding-top: 2px;
    font-weight: bold;
}
.unit .atk { color: #8b3a1f; font-size: 13px; }
.unit .hp { font-size: 13px; }
.unit .hp.damaged { color: #c2552c; }
.unit .hp.full { color: #2d5a3d; }

/* 玩家2 单位翻转 */
.p2-unit {
    transform: scaleY(-1);
}
.p2-unit > * { transform: scaleY(-1); }

/* 日志区 */
.log-panel {
    margin-top: 20px;
    background: #2a1f15;
    border: 1px solid #5a4530;
    border-radius: 4px;
    padding: 12px 16px;
    max-height: 220px;
    overflow-y: auto;
    font-family: "SF Mono", Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
}
.log-panel .log-line { margin: 1px 0; }
.log-panel .log-line.deploy { color: #d4a55c; }
.log-panel .log-line.attack { color: #c2552c; }
.log-panel .log-line.special { color: #6f9f6f; }

/* 信息面板 */
.info-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 12px;
}
.player-info {
    background: rgba(0,0,0,0.3);
    border: 1px solid #5a4530;
    border-radius: 3px;
    padding: 8px 12px;
    display: flex;
    gap: 16px;
    align-items: center;
    font-size: 13px;
}
.player-info.active { border-color: #d4a55c; box-shadow: 0 0 8px rgba(212,165,92,0.4); }
.player-info .label { color: #8b6f47; }
.player-info .value { color: #e8d8b8; font-weight: bold; }

/* 加载状态 */
.loading, .error {
    text-align: center;
    padding: 60px 20px;
    color: #8b6f47;
}
.error { color: #c2552c; }
</style>
</head>
<body>
<div class="container">
    <header>
        <h1>拿 破 仑 战 争 · 对 局 回 放</h1>
        <div class="subtitle">RULE PROTOTYPE · 三线战场 · 军令系统</div>
    </header>

    <div id="root">
        <div class="loading">加载对局数据中...</div>
    </div>
</div>

<script>
let MATCH_DATA = null;
let currentStep = 0;

async function loadMatch(filename = "match_data.json") {
    try {
        const res = await fetch(filename);
        MATCH_DATA = await res.json();
        renderUI();
    } catch (e) {
        document.getElementById("root").innerHTML =
            `<div class="error">无法加载 ${filename}<br>请先运行：<code>python3 export_match.py</code><br><br>错误：${e.message}</div>`;
    }
}

async function loadDifferent(filename) {
    if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
    }
    currentStep = 0;
    await loadMatch(filename);
    // 切换后保持下拉框选中状态
    const sel = document.getElementById("match-select");
    if (sel) sel.value = filename;
}

function renderUI() {
    const root = document.getElementById("root");
    root.innerHTML = `
        <div class="controls">
            <div class="turn-info">
                <span>对局：</span>
                <span class="active">${MATCH_DATA.meta.p1_faction}</span>
                <span> vs </span>
                <span class="active">${MATCH_DATA.meta.p2_faction}</span>
                <span style="margin-left:24px">回合 <span class="turn-num" id="turn-display">0</span></span>
                <span style="margin-left:16px;color:#8b6f47" id="active-display"></span>
            </div>
            <div class="btn-group">
                <select class="btn" id="match-select" onchange="loadDifferent(this.value)" style="cursor:pointer">
                    <option value="match_data.json">默认对局</option>
                    <option value="match_france_vs_prussia.json">法兰西 vs 普鲁士 (seed=10)</option>
                    <option value="match_prussia_vs_russia.json">普鲁士 vs 俄罗斯 (seed=7)</option>
                </select>
                <button class="btn" onclick="goto(0)">⏮ 起始</button>
                <button class="btn" onclick="step(-1)" id="btn-prev">◀ 上一步</button>
                <button class="btn primary" onclick="togglePlay()" id="btn-play">▶ 播放</button>
                <button class="btn" onclick="step(1)" id="btn-next">下一步 ▶</button>
                <button class="btn" onclick="goto(MATCH_DATA.timeline.length - 1)">最终 ⏭</button>
            </div>
        </div>

        <div class="info-bar">
            <div class="player-info" id="p1-info">
                <span><span class="label">玩家：</span><span class="value">${MATCH_DATA.timeline[0].state.p1.name}</span></span>
                <span><span class="label">HQ：</span><span class="value" id="p1-hq">25</span></span>
                <span><span class="label">军令：</span><span class="value" id="p1-orders">2/2</span></span>
                <span><span class="label">手牌：</span><span class="value" id="p1-hand">4</span></span>
                <span><span class="label">牌库：</span><span class="value" id="p1-deck">26</span></span>
            </div>
            <div class="player-info" id="p2-info">
                <span><span class="label">玩家：</span><span class="value">${MATCH_DATA.timeline[0].state.p2.name}</span></span>
                <span><span class="label">HQ：</span><span class="value" id="p2-hq">25</span></span>
                <span><span class="label">军令：</span><span class="value" id="p2-orders">2/2</span></span>
                <span><span class="label">手牌：</span><span class="value" id="p2-hand">6</span></span>
                <span><span class="label">牌库：</span><span class="value" id="p2-deck">24</span></span>
            </div>
        </div>

        <div class="battlefield">
            <div class="hq p2-${factionClass(MATCH_DATA.meta.p2_faction)}">
                <div class="name">${MATCH_DATA.meta.p2_faction} HQ</div>
                <div class="stats">
                    <span><span class="stat-label">血量</span><span class="hq-hp" id="p2-hq-big">25</span></span>
                </div>
            </div>
            <div class="line" id="line-p2-rear">
                <div class="line-label">敌·后方</div>
                <div class="units-container"></div>
            </div>
            <div class="line" id="line-p2-main">
                <div class="line-label">敌·主力</div>
                <div class="units-container"></div>
            </div>
            <div class="line skirmish" id="line-skirmish">
                <div class="line-label">散 兵 线</div>
                <div class="units-container" style="border-bottom:1px dashed #8b6f47;padding-bottom:6px;margin-bottom:4px;" id="skirmish-p2"></div>
                <div class="units-container" id="skirmish-p1"></div>
            </div>
            <div class="line" id="line-p1-main">
                <div class="line-label">我·主力</div>
                <div class="units-container"></div>
            </div>
            <div class="line" id="line-p1-rear">
                <div class="line-label">我·后方</div>
                <div class="units-container"></div>
            </div>
            <div class="hq p1">
                <div class="name">${MATCH_DATA.meta.p1_faction} HQ</div>
                <div class="stats">
                    <span><span class="stat-label">血量</span><span class="hq-hp" id="p1-hq-big">25</span></span>
                </div>
            </div>
        </div>

        <div class="log-panel" id="log-panel">
            <div class="log-line">对局开始 · 种子 ${MATCH_DATA.meta.seed}</div>
        </div>
    `;
    
    renderStep(0);
    document.addEventListener("keydown", handleKey);
}

function factionClass(faction) {
    if (faction === "法兰西") return "france";
    if (faction === "普鲁士") return "prussia";
    if (faction === "俄罗斯") return "russia";
    return "france";
}

function unitHTML(u, isP2) {
    const damaged = u.current_hp < u.max_hp;
    const hpClass = damaged ? "damaged" : "full";
    const kw = (u.keywords || []).filter(k => !k.startsWith("光环")).slice(0, 3).join("·");
    return `
        <div class="unit ${isP2 ? 'p2-unit' : ''} faction-${u.name.includes('俄') || u.name.includes('哥萨克') || u.name.includes('库图') || u.name.includes('巴格') || u.name.includes('普拉') || u.name.includes('独角') || u.name.includes('莫斯科') || u.name.includes('帝国大军') || u.name.includes('东正') || u.name.includes('西伯') || u.name.includes('猎兵团') ? '俄罗斯' : (u.name.includes('普鲁') || u.name.includes('耶格') || u.name.includes('黑色') || u.name.includes('死骑') || u.name.includes('布吕') || u.name.includes('西里') ? '普鲁士' : '法兰西')}">
            <div class="cost">${u.cost}</div>
            <div class="name">${u.name}</div>
            <div class="type">${u.type}</div>
            <div class="keywords">${kw}</div>
            <div class="stats-row">
                <span class="atk">⚔ ${u.attack}</span>
                <span class="hp ${hpClass}">♥ ${u.current_hp}/${u.max_hp}</span>
            </div>
        </div>
    `;
}

function renderStep(idx) {
    currentStep = Math.max(0, Math.min(idx, MATCH_DATA.timeline.length - 1));
    const node = MATCH_DATA.timeline[currentStep];
    const s = node.state;
    
    // 顶部信息
    document.getElementById("turn-display").textContent = node.turn;
    let activeText = "";
    if (node.active_player === 0) activeText = `· ${s.p1.faction} 行动`;
    else if (node.active_player === 1) activeText = `· ${s.p2.faction} 行动`;
    document.getElementById("active-display").textContent = activeText;
    
    // 玩家面板
    document.getElementById("p1-hq").textContent = s.p1.hq_hp;
    document.getElementById("p1-orders").textContent = s.p1.orders;
    document.getElementById("p1-hand").textContent = s.p1.hand_size;
    document.getElementById("p1-deck").textContent = s.p1.deck_size;
    document.getElementById("p2-hq").textContent = s.p2.hq_hp;
    document.getElementById("p2-orders").textContent = s.p2.orders;
    document.getElementById("p2-hand").textContent = s.p2.hand_size;
    document.getElementById("p2-deck").textContent = s.p2.deck_size;
    
    document.getElementById("p1-hq-big").textContent = s.p1.hq_hp;
    document.getElementById("p2-hq-big").textContent = s.p2.hq_hp;
    
    document.getElementById("p1-info").classList.toggle("active", node.active_player === 0);
    document.getElementById("p2-info").classList.toggle("active", node.active_player === 1);
    
    // 战线
    document.querySelector("#line-p2-rear .units-container").innerHTML =
        s.p2.rear.map(u => unitHTML(u, true)).join("");
    document.querySelector("#line-p2-main .units-container").innerHTML =
        s.p2.main.map(u => unitHTML(u, true)).join("");
    document.getElementById("skirmish-p2").innerHTML =
        s.p2.skirmish.map(u => unitHTML(u, true)).join("");
    document.getElementById("skirmish-p1").innerHTML =
        s.p1.skirmish.map(u => unitHTML(u, false)).join("");
    document.querySelector("#line-p1-main .units-container").innerHTML =
        s.p1.main.map(u => unitHTML(u, false)).join("");
    document.querySelector("#line-p1-rear .units-container").innerHTML =
        s.p1.rear.map(u => unitHTML(u, false)).join("");
    
    // 累积日志（显示从开始到当前步骤的所有日志）
    const logPanel = document.getElementById("log-panel");
    let allLogs = `<div class="log-line">对局开始 · 种子 ${MATCH_DATA.meta.seed}</div>`;
    for (let i = 1; i <= currentStep; i++) {
        const n = MATCH_DATA.timeline[i];
        if (n.log && n.log.length > 0) {
            for (const line of n.log) {
                let cls = "";
                if (line.includes("▶") || line.includes("部署")) cls = "deploy";
                else if (line.includes("⚔") || line.includes("💥")) cls = "attack";
                else if (line.includes("⚠") || line.includes("✨") || line.includes("⇒")) cls = "special";
                allLogs += `<div class="log-line ${cls}">${escapeHtml(line)}</div>`;
            }
        }
    }
    
    // 终局信息
    if (currentStep === MATCH_DATA.timeline.length - 1) {
        allLogs += `<div class="log-line" style="margin-top:8px;color:#d4a55c;font-weight:bold">━━ ${MATCH_DATA.meta.end_reason} · 胜者：${MATCH_DATA.meta.winner_name} ━━</div>`;
    }
    
    logPanel.innerHTML = allLogs;
    logPanel.scrollTop = logPanel.scrollHeight;
    
    // 按钮状态
    document.getElementById("btn-prev").disabled = currentStep === 0;
    document.getElementById("btn-next").disabled = currentStep === MATCH_DATA.timeline.length - 1;
}

function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function step(delta) {
    renderStep(currentStep + delta);
}

function goto(idx) {
    renderStep(idx);
}

let playInterval = null;
function togglePlay() {
    const btn = document.getElementById("btn-play");
    if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
        btn.textContent = "▶ 播放";
        return;
    }
    btn.textContent = "⏸ 暂停";
    playInterval = setInterval(() => {
        if (currentStep >= MATCH_DATA.timeline.length - 1) {
            clearInterval(playInterval);
            playInterval = null;
            btn.textContent = "▶ 播放";
            return;
        }
        step(1);
    }, 1500);
}

function handleKey(e) {
    if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "ArrowRight") step(1);
    else if (e.key === " ") { e.preventDefault(); togglePlay(); }
}

loadMatch();
</script>
</body>
</html>
