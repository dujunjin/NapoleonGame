<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拿破仑战争 - 对局回放</title>
<style>
/* === CSS Variables === */
:root {
    --void: #0a0c14;
    --abyss: #0f1220;
    --slate: #1a1f35;
    --slate-lt: #252b45;
    --brass: #c9a84c;
    --brass-glow: #e0c060;
    --brass-dim: #8a7530;
    --blood: #8b1a1a;
    --blood-bright: #c23030;
    --blood-glow: #e04040;
    --smoke: #4a4a5a;
    --smoke-lt: #6a6a7a;
    --frost: #5a7a9a;
    --frost-lt: #7a9aba;
    --forest: #2a5a3a;
    --forest-lt: #4a8a5a;
    --flame: #e06030;
    --flame-glow: #ff8040;

    --bg-deep: var(--void);
    --bg-surface: var(--abyss);
    --bg-raised: var(--slate-lt);
    --border-main: rgba(201,168,76,0.15);
    --border-dim: rgba(201,168,76,0.08);
    --text-primary: #e0dde8;
    --text-secondary: var(--smoke-lt);
    --text-muted: var(--smoke);
    --gold: var(--brass);
    --gold-bright: var(--brass-glow);
    --red: var(--blood-bright);
    --red-bright: var(--blood-glow);
    --green: var(--forest);
    --green-bright: var(--forest-lt);
    --blue-gray: var(--frost);

    --faction-france: #4a6fa5;
    --faction-prussia: #5a5a5a;
    --faction-russia: #3a6a4a;
    --card-paper: #f0e8d0;
    --card-paper-dark: #d8c8a0;
    --type-infantry: #8fb0c5;
    --type-skirmisher: #7daf64;
    --type-cavalry: #c06a5b;
    --type-artillery: #b79a4a;
    --type-guard: #9f75bd;
    --font-display: "Georgia", "Noto Serif SC", "Songti SC", serif;
    --font-main: "Hiragino Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-body: var(--font-main);
    --font-mono: "SF Mono", "Menlo", "Consolas", monospace;
    --radius: 4px;
    --radius-lg: 6px;
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
    --shadow-inset: inset 0 0 20px rgba(0,0,0,0.3);
}

/* === Reset & Base === */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: var(--font-main);
    background: var(--void);
    color: var(--text-primary);
    min-height: 100vh;
}
.atmosphere {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}
.atmosphere::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
}
.atmosphere::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse at 20% 10%, rgba(201,168,76,0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 90%, rgba(201,168,76,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, transparent 30%, rgba(0,0,0,0.4) 100%);
}

/* === Page Layout === */
.page {
    max-width: 1400px;
    margin: 0 auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* === Replay Header === */
.replay-header {
    text-align: center;
    padding: 12px 16px;
    background: var(--bg-surface);
    border: 1px solid var(--border-main);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
}
.replay-header h1 {
    font-family: var(--font-display);
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(201,168,76,0.6), 1px 1px 0 #000;
}
.replay-header .matchup {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 4px;
}
.replay-header .matchup .faction-p1 { color: var(--faction-france); font-weight: bold; }
.replay-header .matchup .faction-p2 { color: var(--faction-russia); font-weight: bold; }
.replay-header .meta-line {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
}

/* === Controls Bar === */
.controls-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    background: var(--slate);
    border: 1px solid var(--border-main);
    border-top: 2px solid var(--brass-dim);
    border-radius: var(--radius);
    padding: 8px 12px;
    box-shadow: var(--shadow);
}
.controls-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}
.controls-center {
    display: flex;
    align-items: center;
    gap: 4px;
}
.controls-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.turn-info {
    font-size: 13px;
    color: var(--text-secondary);
}
.turn-info .turn-num {
    color: var(--gold-bright);
    font-size: 18px;
    font-weight: bold;
}
.turn-info .active-player {
    color: var(--gold);
    font-weight: bold;
}
.step-counter {
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--font-mono);
}

/* Buttons */
.btn {
    background: var(--bg-raised);
    color: var(--text-primary);
    border: 1px solid var(--border-main);
    padding: 6px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    border-radius: var(--radius);
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
}
.btn:hover { background: var(--border-main); border-color: var(--text-muted); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
}
.btn.primary {
    background: var(--red);
    border-color: var(--red-bright);
    color: #fff;
}
.btn.primary:hover { background: var(--red-bright); }
.btn.icon-btn {
    padding: 6px 8px;
    min-width: 32px;
    text-align: center;
}

.speed-select {
    background: var(--bg-raised);
    color: var(--text-primary);
    border: 1px solid var(--border-main);
    padding: 4px 6px;
    font-family: inherit;
    font-size: 12px;
    border-radius: var(--radius);
    cursor: pointer;
}
.speed-select:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
}

#step-slider {
    width: min(220px, 40vw);
    accent-color: var(--gold);
}
.filter-group {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
}
.filter-chip {
    background: var(--bg-raised);
    color: var(--text-secondary);
    border: 1px solid var(--border-dim);
    border-radius: var(--radius);
    padding: 4px 7px;
    font-size: 11px;
    cursor: pointer;
}
.filter-chip.active {
    color: #1a1a1a;
    background: var(--gold);
    border-color: var(--gold-bright);
}

.match-select {
    background: var(--bg-raised);
    color: var(--text-primary);
    border: 1px solid var(--border-main);
    padding: 6px 8px;
    font-family: inherit;
    font-size: 13px;
    border-radius: var(--radius);
    cursor: pointer;
    max-width: 200px;
}
.match-select:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
}

/* === Player Info Strips === */
.info-strips {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}
.player-strip {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-surface);
    border: 1px solid var(--border-dim);
    border-radius: var(--radius);
    padding: 6px 12px;
    font-size: 12px;
    flex-wrap: wrap;
}
.player-strip.active {
    border-color: var(--gold);
    box-shadow: 0 0 6px rgba(201,168,76,0.3);
}
.player-strip .strip-name {
    font-weight: bold;
    font-size: 13px;
    min-width: 80px;
}
.player-strip .strip-name.p1 { color: var(--faction-france); }
.player-strip .strip-name.p2 { color: var(--faction-russia); }
.player-strip .strip-stat {
    display: flex;
    align-items: baseline;
    gap: 3px;
}
.player-strip .strip-stat .label {
    color: var(--text-muted);
    font-size: 11px;
}
.player-strip .strip-stat .value {
    color: var(--text-primary);
    font-weight: bold;
}
.player-strip .strip-stat .value.hq-hp {
    color: var(--red-bright);
    font-size: 15px;
}
.player-strip .strip-stat .value.orders {
    color: var(--gold);
}

/* === Battle Board === */
.battle-board {
    background: var(--abyss);
    border: 2px solid var(--border-main);
    border-radius: var(--radius-lg);
    padding: 12px;
    box-shadow: 0 0 20px rgba(201,168,76,0.1), inset 0 0 40px rgba(0,0,0,0.8);
    position: relative;
    overflow: hidden;
}

/* HQ strips */
.hq-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: rgba(0,0,0,0.25);
    border-radius: var(--radius);
    margin-bottom: 6px;
}
.hq-strip.enemy {
    border-left: 4px solid var(--faction-russia);
}
.hq-strip.player {
    border-left: 4px solid var(--faction-france);
}
.hq-strip.enemy.p2-prussia { border-left-color: var(--faction-prussia); }
.hq-strip.enemy.p2-russia { border-left-color: var(--faction-russia); }
.hq-strip.enemy.p2-france { border-left-color: var(--faction-france); }
.hq-strip .hq-label {
    font-size: 14px;
    font-weight: bold;
    color: var(--text-secondary);
}
.hq-strip .hq-hp {
    font-size: 22px;
    font-weight: bold;
    color: var(--red-bright);
}
.hq-strip .hq-hp.damaged { color: var(--red); }
.hq-strip.hq-target {
    box-shadow: 0 0 12px rgba(194,85,44,0.6);
    border-color: var(--red-bright);
    animation: hq-hit 0.5s ease-out;
}
.hq-threat {
    margin-left: auto;
    margin-right: 10px;
    padding: 2px 6px;
    border: 1px solid var(--border-dim);
    border-radius: var(--radius);
    font-size: 11px;
    color: var(--text-secondary);
}

.hq-hp-bar {
    flex: 1;
    max-width: 200px;
    height: 16px;
    background: rgba(0,0,0,0.4);
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid rgba(201,168,76,0.15);
}
.hq-hp-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--blood), var(--blood-bright));
    border-radius: 8px;
    transition: width 0.5s ease;
}
.hq-hp-fill.critical {
    animation: hp-pulse 1s ease-in-out infinite;
}
@keyframes hp-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
}

@keyframes threat-pulse {
    0%, 100% { box-shadow: 0 0 8px rgba(224,96,48,0.3); }
    50% { box-shadow: 0 0 16px rgba(224,96,48,0.6); }
}

@keyframes hq-hit {
    0% { transform: translateX(0); }
    10% { transform: translateX(-4px); }
    20% { transform: translateX(4px); }
    30% { transform: translateX(-3px); }
    40% { transform: translateX(3px); }
    50% { transform: translateX(-1px); }
    100% { transform: translateX(0); }
}
.hq-threat.danger {
    color: #fff;
    background: rgba(224,96,48,0.7);
    border-color: var(--flame);
    animation: threat-pulse 1.5s ease-in-out infinite;
}

/* Battlefield lines */
.bf-lines {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.bf-line {
    display: flex;
    align-items: stretch;
    gap: 0;
    background: rgba(0,0,0,0.15);
    border: 1px solid var(--border-dim);
    border-radius: var(--radius);
    min-height: 90px;
    overflow: hidden;
}
.bf-line.skirmish-line {
    background: linear-gradient(to bottom, rgba(201,168,76,0.08), rgba(201,168,76,0.04));
    border: 1px dashed var(--border-main);
}
.bf-line-divider {
    text-align: center;
    color: var(--text-muted);
    font-size: 10px;
    letter-spacing: 4px;
    padding: 2px 0;
    user-select: none;
}

.line-label-col {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    width: 28px;
    min-width: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 2px;
    border-right: 1px solid var(--border-dim);
    background: rgba(0,0,0,0.1);
    flex-shrink: 0;
}
.line-label-col .skirmish-state {
    font-size: 9px;
    color: var(--gold);
    display: block;
    margin-top: 4px;
    writing-mode: horizontal-tb;
}

.units-row {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 6px;
    align-items: center;
    min-height: 90px;
}
.slot-empty {
    border: 1px dashed rgba(74,74,106,0.4);
    border-radius: var(--radius);
    background: rgba(0,0,0,0.08);
    min-height: 78px;
    min-width: 0;
}

/* SVG arrow overlay */
.arrow-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
}
.arrow-line {
    stroke: var(--red);
    stroke-width: 3;
    marker-end: url(#arrowhead);
    filter: drop-shadow(0 0 4px rgba(194,85,44,0.6));
    stroke-dasharray: 8 4;
    animation: arrow-flow 0.6s linear infinite;
}
@keyframes arrow-flow {
    to { stroke-dashoffset: -12; }
}
.arrow-damage {
    font-size: 13px;
    font-weight: bold;
    fill: var(--red-bright);
    text-anchor: middle;
    dominant-baseline: middle;
    filter: drop-shadow(0 0 3px rgba(0,0,0,0.8));
}
.attack-badge {
    position: absolute;
    background: rgba(194,85,44,0.9);
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    padding: 2px 5px;
    border-radius: 3px;
    pointer-events: none;
    z-index: 11;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
}

/* === Unit Cards === */
.unit-card {
    background: linear-gradient(135deg, var(--card-paper) 0%, var(--card-paper-dark) 100%);
    border: 2px solid var(--border-dim);
    border-radius: var(--radius);
    color: #2a2a2a;
    padding: 4px;
    display: flex;
    flex-direction: column;
    box-shadow: 1px 1px 3px rgba(0,0,0,0.4);
    font-size: 10px;
    position: relative;
    min-width: 0;
    transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s, opacity 0.3s;
    cursor: pointer;
}
.unit-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
}
.unit-card.p2-unit {
    transform: scaleY(-1);
}
.unit-card.p2-unit:hover {
    transform: scaleY(-1) translateY(2px);
}
.unit-card.p2-unit > * { transform: scaleY(-1); }

/* Faction borders */
.unit-card.faction-france { border-color: var(--faction-france); }
.unit-card.faction-prussia { border-color: var(--faction-prussia); }
.unit-card.faction-russia { border-color: var(--faction-russia); }

/* Type backgrounds */
.unit-card.type-infantry { background: linear-gradient(135deg, #d8e7f2 0%, #a0c0d4 100%); }
.unit-card.type-skirmisher { background: linear-gradient(135deg, #dff0cf 0%, #a0c878 100%); }
.unit-card.type-cavalry { background: linear-gradient(135deg, #f2d5d1 0%, #d08070 100%); }
.unit-card.type-artillery { background: linear-gradient(135deg, #ece1be 0%, #c8aa58 100%); }
.unit-card.type-guard { background: linear-gradient(135deg, #eadcf4 0%, #b088cc 100%); }

/* Unit cost badge */
.ucard-cost {
    position: absolute;
    top: -5px;
    left: -5px;
    width: 20px;
    height: 20px;
    background: var(--red);
    color: #fff;
    border: 2px solid #2a2a2a;
    border-radius: 50%;
    text-align: center;
    line-height: 16px;
    font-weight: bold;
    font-size: 11px;
    z-index: 1;
}
.ucard-name {
    font-weight: bold;
    font-size: 10px;
    text-align: center;
    margin-top: 4px;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border-bottom: 1px solid rgba(0,0,0,0.15);
    padding-bottom: 2px;
}
.ucard-type {
    font-size: 9px;
    color: #5a5a5a;
    text-align: center;
    margin: 1px 0;
}
.ucard-keywords {
    font-size: 8px;
    color: #2a4a8b;
    text-align: center;
    flex: 1;
    line-height: 1.3;
    overflow: hidden;
}
.ucard-stats {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid rgba(0,0,0,0.15);
    padding-top: 2px;
    font-weight: bold;
}
.ucard-atk { color: var(--red); font-size: 12px; }
.ucard-hp { font-size: 12px; }
.ucard-hp.damaged { color: var(--red); }
.ucard-hp.full { color: var(--green); }

/* Unit states */
@keyframes source-glow {
    from { box-shadow: 0 0 12px rgba(201,168,76,0.7), 0 0 3px var(--brass); }
    to   { box-shadow: 0 0 20px rgba(201,168,76,0.9), 0 0 6px var(--brass-glow); }
}
.unit-card.is-source {
    animation: source-glow 0.8s ease-in-out infinite alternate;
    border-color: var(--gold);
}
@keyframes target-shake {
    0%  { transform: translateX(0); }
    20% { transform: translateX(-3px); }
    40% { transform: translateX(3px); }
    60% { transform: translateX(-2px); }
    80% { transform: translateX(2px); }
    100%{ transform: translateX(0); }
}
.unit-card.is-target {
    box-shadow: 0 0 8px rgba(194,85,44,0.7), 0 0 2px var(--red-bright);
    border-color: var(--red-bright);
    animation: target-shake 0.3s ease-out;
}
@keyframes target-shake-inv {
    0%  { transform: scaleY(-1) translateX(0); }
    20% { transform: scaleY(-1) translateX(-3px); }
    40% { transform: scaleY(-1) translateX(3px); }
    60% { transform: scaleY(-1) translateX(-2px); }
    80% { transform: scaleY(-1) translateX(2px); }
    100%{ transform: scaleY(-1) translateX(0); }
}
.unit-card.p2-unit.is-target { animation: target-shake-inv 0.3s ease-out; }

.unit-card.is-focus,
.hq-strip.is-focus {
    outline: 2px solid var(--gold-bright);
    outline-offset: 2px;
}
.unit-card.is-dead {
    opacity: 0.35;
    filter: grayscale(0.8);
    border-style: dashed;
}
@keyframes deploy-rise {
    0%   { opacity: 0; transform: translateY(20px) scale(0.8); }
    60%  { opacity: 1; }
    100% { transform: translateY(0) scale(1); }
}
.unit-card.is-new { animation: deploy-rise 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
.unit-card.p2-unit.is-new { animation: deploy-rise-inv 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes deploy-rise-inv {
    0%   { opacity: 0; transform: scaleY(-1) translateY(20px) scale(0.8); }
    60%  { opacity: 1; }
    100% { transform: scaleY(-1) translateY(0) scale(1); }
}
.unit-card.is-hp-changed .ucard-hp {
    animation: hp-flash 0.6s ease-out;
}

@keyframes deploy-pulse {
    0% { box-shadow: 0 0 16px rgba(74,138,90,0.8); transform: scale(1.05); }
    100% { box-shadow: none; transform: scale(1); }
}
@keyframes hp-flash {
    0% { background: rgba(194,85,44,0.3); }
    100% { background: transparent; }
}

@keyframes shaken-tremble {
    from { transform: translateX(-1px); }
    to   { transform: translateX(1px); }
}
.unit-card.is-shaken { animation: shaken-tremble 0.15s ease-in-out infinite alternate; }
.unit-card.p2-unit.is-shaken { animation: shaken-tremble-inv 0.15s ease-in-out infinite alternate; }
@keyframes shaken-tremble-inv {
    from { transform: scaleY(-1) translateX(-1px); }
    to   { transform: scaleY(-1) translateX(1px); }
}
.ucard-status-shaken {
    position: absolute;
    top: 18px;
    right: 2px;
    background: rgba(74,58,31,0.88);
    color: var(--brass-glow);
    border: 1px solid var(--brass);
    border-radius: 3px;
    padding: 1px 3px;
    font-size: 8px;
    font-weight: bold;
    line-height: 1.1;
    z-index: 2;
}


/* Owner marker for skirmish */
.owner-marker {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    z-index: 1;
}
.owner-marker.p1 { background: var(--faction-france); }
.owner-marker.p2 { background: var(--faction-russia); }

/* === Current Action Panel === */
.action-panel {
    background: var(--bg-surface);
    border: 1px solid var(--border-main);
    border-radius: var(--radius);
    padding: 10px 16px;
    box-shadow: var(--shadow);
}
.action-panel .action-summary {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-primary);
}
.action-panel .action-summary .action-label {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: bold;
    margin-right: 6px;
    vertical-align: middle;
}
.action-label.deploy { background: var(--gold); color: #1a1a1a; }
.action-label.advance { background: var(--blue-gray); color: #fff; }
.action-label.attack { background: var(--red); color: #fff; }
.action-label.event { background: var(--green); color: #fff; }
.action-label.hq_attack { background: #8b2a1f; color: #fff; }
.action-label.start { background: var(--text-muted); color: #fff; }
.action-label.end { background: var(--green); color: #fff; }

/* === Battle History === */
.history-panel {
    background: var(--bg-surface);
    border: 1px solid var(--border-main);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
}
.history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border-dim);
}
.history-header .panel-title {
    font-size: 13px;
    font-weight: bold;
    color: var(--gold);
    letter-spacing: 1px;
}
.history-toggle-btn {
    background: none;
    border: 1px solid var(--border-dim);
    color: var(--text-secondary);
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    border-radius: var(--radius);
    font-family: inherit;
}
.history-toggle-btn:hover { border-color: var(--text-muted); }
.history-toggle-btn:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
}

.history-table-wrap {
    max-height: 280px;
    overflow-y: auto;
    overflow-x: auto;
}
.history-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}
.history-table thead th {
    position: sticky;
    top: 0;
    background: var(--bg-raised);
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: bold;
    text-align: left;
    padding: 5px 8px;
    border-bottom: 1px solid var(--border-dim);
    white-space: nowrap;
}
.history-table tbody tr {
    cursor: pointer;
    transition: background 0.1s;
}
.history-table tbody tr:hover {
    background: rgba(201,168,76,0.08);
}
.history-table tbody tr.current-row {
    background: rgba(201,168,76,0.15);
    border-left: 3px solid var(--gold);
}
.history-table tbody tr:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: -2px;
}
.history-table td {
    padding: 4px 8px;
    border-bottom: 1px solid rgba(74,74,106,0.2);
    vertical-align: middle;
    white-space: nowrap;
}
.history-table td.desc-cell {
    white-space: normal;
    max-width: 400px;
    overflow: hidden;
    text-overflow: ellipsis;
}
.history-table .faction-badge {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: bold;
    color: #fff;
}
.faction-badge.f1 { background: var(--faction-france); }
.faction-badge.f2 { background: var(--faction-russia); }
.faction-badge.f-neutral { background: var(--text-muted); }
.history-table .action-badge {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: bold;
}
.history-table .marker {
    font-size: 10px;
}

/* Raw log area */
.raw-log-area {
    border-top: 1px solid var(--border-dim);
    display: none;
}
.raw-log-area.visible { display: block; }
.raw-log-content {
    max-height: 180px;
    overflow-y: auto;
    padding: 8px 12px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-secondary);
}
.raw-log-content .log-line { margin: 1px 0; }
.raw-log-content .log-line.log-deploy { color: var(--gold); }
.raw-log-content .log-line.log-attack { color: var(--red-bright); }
.raw-log-content .log-line.log-special { color: var(--green-bright); }

/* === Final Result Banner (legacy — replaced by .result-overlay) === */
/* kept for backwards compat; new overlay uses .result-overlay */
.result-banner {
    display: none;
    background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05));
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    padding: 12px 20px;
    text-align: center;
    box-shadow: 0 0 12px rgba(201,168,76,0.2);
}
.result-banner.visible { display: block; }
.result-banner .result-title {
    font-size: 18px;
    font-weight: bold;
    color: var(--gold-bright);
    letter-spacing: 2px;
}
.result-banner .result-detail {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
}


/* Floating damage */
.floating-dmg {
    position: absolute;
    font-family: var(--font-display);
    font-size: 18px;
    font-weight: bold;
    color: var(--blood-glow);
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
    pointer-events: none;
    z-index: 30;
    animation: float-up 1.2s ease-out forwards;
}
@keyframes float-up {
    0%   { opacity: 1; transform: translateY(0) scale(1.2); }
    100% { opacity: 0; transform: translateY(-40px) scale(0.8); }
}

/* Screen shake */
.screen-shake { animation: screen-shake 0.4s ease-out; }
@keyframes screen-shake {
    0%  { transform: translate(0, 0); }
    10% { transform: translate(-4px, -2px); }
    20% { transform: translate(4px, 2px); }
    30% { transform: translate(-3px, 1px); }
    40% { transform: translate(3px, -1px); }
    50% { transform: translate(-2px, 2px); }
    60% { transform: translate(2px, -1px); }
    70% { transform: translate(-1px, 1px); }
    100%{ transform: translate(0, 0); }
}
.screen-shake-heavy { animation: screen-shake-heavy 0.6s ease-out; }
@keyframes screen-shake-heavy {
    0%  { transform: translate(0, 0); }
    10% { transform: translate(-8px, -4px); }
    20% { transform: translate(8px, 4px); }
    30% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    50% { transform: translate(-4px, 4px); }
    60% { transform: translate(4px, -2px); }
    70% { transform: translate(-2px, 2px); }
    100%{ transform: translate(0, 0); }
}

/* Result overlay */
.result-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 40;
    pointer-events: none;
    align-items: center;
    justify-content: center;
}
.result-overlay.visible { display: flex; animation: result-fade-in 0.8s ease-out; }
@keyframes result-fade-in { from { opacity: 0; } to { opacity: 1; } }
.result-card {
    background: linear-gradient(135deg, rgba(26,31,53,0.95), rgba(42,37,32,0.95));
    border: 2px solid var(--brass);
    border-radius: 8px;
    padding: 32px 48px;
    text-align: center;
    box-shadow: 0 0 60px rgba(201,168,76,0.3);
    animation: result-scale 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes result-scale {
    from { transform: scale(0.7); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
}

/* === Title Banner === */
.title-banner {
    grid-column: 1 / -1;
    text-align: center;
    padding: 16px 20px 12px;
    position: relative;
    overflow: hidden;
}
.title-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(26,31,53,0.8), rgba(42,37,32,0.6));
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: var(--radius-lg);
}
.title-banner > * { position: relative; z-index: 1; }
.title-banner h1 {
    font-family: var(--font-display);
    font-size: 20px;
    letter-spacing: 6px;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(201,168,76,0.3), 0 2px 0 #000;
    margin-bottom: 4px;
}
.title-matchup {
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--text-secondary);
    letter-spacing: 2px;
}
.title-matchup .f1 { color: var(--faction-france); font-weight: bold; }
.title-matchup .f2 { color: var(--faction-russia); font-weight: bold; }
.title-matchup .vs { color: var(--gold); margin: 0 8px; }
.title-meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    font-family: var(--font-mono);
}

/* === Playback Bar === */
.playback-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 50;
    background: linear-gradient(180deg, rgba(10,12,20,0.85), rgba(10,12,20,0.98));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid rgba(201,168,76,0.15);
    padding: 8px 16px 10px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
}
.playback-inner {
    max-width: 1440px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
}
.playback-controls {
    display: flex;
    align-items: center;
    gap: 4px;
}
.progress-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
}
.progress-bar {
    flex: 1;
    height: 6px;
    background: rgba(201,168,76,0.08);
    border-radius: 3px;
    position: relative;
    cursor: pointer;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-bright));
    border-radius: 3px;
    transition: width 0.2s;
}
.progress-fill::after {
    content: '';
    position: absolute;
    right: -3px;
    top: -3px;
    width: 12px;
    height: 12px;
    background: var(--gold);
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(201,168,76,0.5);
}
.progress-turn-markers {
    position: absolute;
    inset: 0;
    pointer-events: none;
}
.progress-turn-marker {
    position: absolute;
    top: 0;
    width: 1px;
    height: 100%;
    background: rgba(201,168,76,0.2);
}
.turn-label {
    font-family: var(--font-display);
    font-size: 12px;
    color: var(--gold);
    min-width: 60px;
    text-align: center;
}
.speed-btn {
    background: rgba(26,31,53,0.8);
    color: var(--text-secondary);
    border: 1px solid rgba(201,168,76,0.12);
    padding: 4px 8px;
    font-family: var(--font-mono);
    font-size: 11px;
    border-radius: var(--radius);
    cursor: pointer;
    min-width: 36px;
    text-align: center;
    transition: all 0.15s;
}
.speed-btn:hover { border-color: var(--gold); color: var(--gold); }

/* === Timeline Sidebar === */
.timeline-sidebar {
    background: linear-gradient(180deg, rgba(15,18,32,0.95), rgba(26,31,53,0.9));
    border: 1px solid rgba(201,168,76,0.12);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: var(--shadow);
}
.timeline-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-bottom: 1px solid rgba(201,168,76,0.1);
    flex-shrink: 0;
}
.timeline-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 6px 8px;
}
.timeline-footer {
    padding: 6px 10px;
    border-top: 1px solid rgba(201,168,76,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
}
.turn-group {
    margin-bottom: 8px;
}
.turn-group-label {
    font-family: var(--font-display);
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 2px;
    padding: 4px 8px;
    border-bottom: 1px solid rgba(201,168,76,0.08);
    margin-bottom: 4px;
    position: sticky;
    top: 0;
    background: rgba(15,18,32,0.95);
    z-index: 2;
}
.event-card {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 8px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 11px;
    transition: background 0.15s;
    border-left: 3px solid transparent;
    margin-bottom: 2px;
}
.event-card:hover { background: rgba(201,168,76,0.06); }
.event-card.current {
    background: rgba(201,168,76,0.1);
    border-left-color: var(--gold);
}
.event-card .ev-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    flex-shrink: 0;
    border: 1px solid;
}
.event-card .ev-icon.deploy   { background: rgba(201,168,76,0.15); border-color: var(--gold); color: var(--gold); }
.event-card .ev-icon.advance  { background: rgba(90,122,154,0.15); border-color: var(--blue-gray); color: var(--blue-gray); }
.event-card .ev-icon.attack   { background: rgba(194,48,48,0.15); border-color: var(--red-bright); color: var(--red-bright); }
.event-card .ev-icon.event    { background: rgba(42,90,58,0.15); border-color: var(--green); color: var(--green-bright); }
.event-card .ev-icon.hq_attack { background: rgba(224,96,48,0.2); border-color: var(--flame); color: var(--flame-glow); }
.event-card .ev-icon.start    { background: rgba(74,74,90,0.15); border-color: var(--smoke); color: var(--smoke-lt); }
.event-card .ev-icon.end      { background: rgba(42,90,58,0.15); border-color: var(--green); color: var(--green-bright); }
.event-card .ev-icon.end_turn { background: rgba(74,74,90,0.1); border-color: var(--smoke); color: var(--smoke); }
.event-card .ev-body { flex: 1; min-width: 0; }
.event-card .ev-desc { color: #c0bdc8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.event-card .ev-faction {
    display: inline-block;
    padding: 0 4px;
    border-radius: 2px;
    font-size: 9px;
    font-weight: bold;
    color: #fff;
    margin-right: 4px;
    vertical-align: middle;
}
.ev-faction.f1 { background: var(--faction-france); }
.ev-faction.f2 { background: var(--faction-russia); }
.event-card .ev-marker { font-size: 12px; flex-shrink: 0; }

/* === Loading & Error === */
.state-message {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 14px;
}
.state-message.error {
    color: var(--red-bright);
}
.state-message code {
    background: var(--bg-raised);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-primary);
}

/* === Accessibility: reduced motion === */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
    .unit-card.is-new { animation: none; }
    .unit-card.is-hp-changed .ucard-hp { animation: none; }
    .arrow-line { filter: none; stroke-dasharray: none; animation: none; }
}
    .unit-card.is-hp-changed .ucard-hp { animation: none; }
    .arrow-line { filter: none; }
}

/* === Responsive === */
@media (max-width: 900px) {
    .info-strips {
        grid-template-columns: 1fr;
    }
/* === Responsive === */
@media (max-width: 1000px) {
    .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
    }
    .timeline-sidebar { display: none; }
}

@media (max-width: 500px) {
    .page { padding: 6px 8px 80px; gap: 6px; }
    .title-banner h1 { font-size: 15px; letter-spacing: 3px; }
    .battle-board { padding: 6px; }
    .bf-line { min-height: 65px; }
    .units-row { gap: 3px; padding: 3px; min-height: 65px; }
    .unit-card { font-size: 9px; }
    .ucard-name { font-size: 9px; }
    .ucard-atk, .ucard-hp { font-size: 10px; }
    .ucard-cost { width: 16px; height: 16px; font-size: 9px; line-height: 12px; top: -4px; left: -4px; }
    .slot-empty { min-height: 55px; }
    .btn { padding: 5px 8px; font-size: 12px; }
    .playback-inner { gap: 8px; flex-wrap: wrap; }
    .playback-controls { gap: 2px; }
    .hq-strip { padding: 6px 10px; gap: 8px; }
    .hq-hp-bar { max-width: 100px; }
    .match-select { max-width: 140px; font-size: 11px; }
    .playback-bar { padding: 6px 10px 8px; }
    .turn-label { font-size: 11px; min-width: 50px; }
    .pb-btn { width: 32px; height: 28px; font-size: 12px; }
}

/* === Focus visible global === */
:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
}

/* === Scrollbar === */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: var(--void); }
::-webkit-scrollbar-thumb { background: var(--slate-lt); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--smoke); }

/* === Unit Tooltip === */
.card-tooltip {
    position: fixed;
    z-index: 30;
    min-width: 220px;
    max-width: 280px;
    padding: 10px 12px;
    background: rgba(20,20,32,0.96);
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    color: var(--text-primary);
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity 120ms, transform 120ms;
}
.card-tooltip.visible {
    opacity: 1;
    transform: translateY(0);
}
.card-tooltip .tt-name {
    color: var(--gold-bright);
    font-weight: bold;
    margin-bottom: 4px;
}
.card-tooltip .tt-row {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.45;
}
</style>
</head>
<body>
<div class="atmosphere" aria-hidden="true"></div>
<div class="page" id="app">
    <div class="state-message" id="loading-state">加载对局数据中...</div>
</div>

<script>
// ======================================================================
// State
// ======================================================================
let MATCH_DATA = null;
let currentStep = 0;
let playInterval = null;
let playSpeed = 1; // 0.5, 1, 2, 4
let prevStepState = null; // for snapshot diff
let rawLogVisible = false;
let activeHistoryFilter = "all";

const ACTION_LABELS = {
    deploy: "部署", advance: "行军", attack: "攻击",
    event: "事件", hq_attack: "直击HQ", start: "开局", end: "终局"
};

const BASE_INTERVAL = 500; // ms at 1x

// ======================================================================
// Data Loading
// ======================================================================
async function loadMatch(filename) {
    filename = filename || "match_data.json";
    const app = document.getElementById("app");
    app.innerHTML = `<div class="state-message">加载 <strong>${escapeHtml(filename)}</strong> 中...</div>`;
    try {
        const res = await fetch(filename);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        MATCH_DATA = await res.json();
        currentStep = 0;
        prevStepState = null;
        buildUI();
    } catch (e) {
        app.innerHTML = `
            <div class="state-message error">
                <p>无法加载 <strong>${escapeHtml(filename)}</strong></p>
                <p style="margin-top:12px;font-size:13px;color:var(--text-secondary)">
                    可能是本地文件访问问题。请尝试启动本地服务器：
                </p>
                <p style="margin-top:8px">
                    <code>cd prototypes/card-battle-sim && python3 -m http.server 8000</code>
                </p>
                <p style="margin-top:8px;font-size:12px;color:var(--text-muted)">
                    然后访问 <code>http://localhost:8000/viewer.html</code>
                </p>
                <p style="margin-top:12px;font-size:12px;color:var(--text-muted)">
                    错误信息：${escapeHtml(e.message)}
                </p>
            </div>`;
    }
}

async function loadDifferent(filename) {
    stopAutoplay();
    await loadMatch(filename);
    const sel = document.getElementById("match-select");
    if (sel) sel.value = filename;
}

// ======================================================================
// UI Construction
// ======================================================================
function buildUI() {
    const meta = MATCH_DATA.meta;
    const app = document.getElementById("app");
    const p2FactionClass = factionClass(meta.p2_faction);

    app.innerHTML = `
        <!-- Title Banner -->
        <div class="title-banner" role="banner">
            <h1>拿 破 仑 战 争</h1>
            <div class="title-matchup">
                <span class="f1">${esc(meta.p1_faction)}</span>
                <span class="vs">⚔</span>
                <span class="f2">${esc(meta.p2_faction)}</span>
            </div>
            <div class="title-meta">
                种子 ${meta.seed} · 回合 ${meta.final_turn} · ${esc(meta.end_reason)} · 胜者 ${esc(meta.winner_name)}
            </div>
        </div>

        <!-- Battle Board -->
        <div class="battle-board" id="battlefield">
            <svg class="arrow-overlay" id="arrow-overlay" aria-hidden="true">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#c23030" />
                    </marker>
                </defs>
            </svg>

            <!-- Enemy HQ -->
            <div class="hq-strip enemy p2-${p2FactionClass}" id="hq-enemy">
                <span class="hq-label">${esc(meta.p2_faction)} 指挥部</span>

    // Bind controls
    document.getElementById("btn-first").onclick = () => goto(0);
    document.getElementById("btn-prev").onclick = () => step(-1);
    document.getElementById("btn-play").onclick = () => togglePlay();
    document.getElementById("btn-next").onclick = () => step(1);
    document.getElementById("btn-last").onclick = () => goto(MATCH_DATA.timeline.length - 1);
    document.getElementById("btn-prev-turn").onclick = () => gotoPrevTurn();
    document.getElementById("btn-next-turn").onclick = () => gotoNextTurn();
    document.getElementById("speed-btn").onclick = () => cycleSpeed();
    document.getElementById("toggle-raw-log").onclick = () => toggleRawLog();

    // Progress bar click
    document.getElementById("progress-bar").onclick = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        goto(Math.floor(pct * (MATCH_DATA.timeline.length - 1)));
    };

    // Build progress markers
    buildProgressMarkers();

    // Filter chips
    document.querySelectorAll(".filter-chip").forEach(btn => {
        btn.onclick = () => {
            activeHistoryFilter = btn.dataset.filter;
            document.querySelectorAll(".filter-chip").forEach(b => b.classList.toggle("active", b === btn));
            buildTimeline();
            highlightTimelineCard();
        };
    });

    // Build timeline
    buildTimeline();

    // Keyboard
    document.addEventListener("keydown", handleKeydown);

    // Initial render
    renderStep(0);
}

// ======================================================================
// Progress Markers
// ======================================================================
function buildProgressMarkers() {
    const container = document.getElementById("progress-markers");
    if (!container) return;
    container.innerHTML = "";
    const timeline = MATCH_DATA.timeline;
    let lastTurn = -1;
    for (let i = 0; i < timeline.length; i++) {
        const t = timeline[i].turn;
        if (t !== lastTurn) {
            const pct = (i / (timeline.length - 1)) * 100;
            const marker = document.createElement("div");
            marker.className = "progress-turn-marker";
            marker.style.left = pct + "%";
            container.appendChild(marker);
            lastTurn = t;
        }
    }
}

// ======================================================================
// Speed Control
// ======================================================================
function cycleSpeed() {
    const speeds = [0.5, 1, 2, 4];
    const idx = speeds.indexOf(playSpeed);
    playSpeed = speeds[(idx + 1) % speeds.length];
    document.getElementById("speed-btn").textContent = playSpeed + "x";
    if (playInterval) { stopAutoplay(); startAutoplay(); }
}

// ======================================================================
// Timeline (replaces history table)
// ======================================================================
function buildTimeline() {
    const container = document.getElementById("timeline-scroll");
    if (!container) return;
    const timeline = MATCH_DATA.timeline;
    let html = "";
    let currentTurn = -1;
    const ACTION_ICONS = { deploy: "▶", advance: "⇒", attack: "⚔", event: "📜", hq_attack: "💥", start: "⚑", end: "⚑", end_turn: "↻" };

    for (let i = 0; i < timeline.length; i++) {
        const node = timeline[i];
        if (activeHistoryFilter !== "all" && node.action !== activeHistoryFilter) continue;
        const turn = node.turn;
        if (turn !== currentTurn) {
            if (currentTurn !== -1) html += "</div>";
            html += `<div class="turn-group"><div class="turn-group-label">回合 ${turn}</div>`;
            currentTurn = turn;
        }
        const action = node.action || "";
        const ap = node.active_player;
        const icon = ACTION_ICONS[action] || "·";
        const desc = deriveTimelineDesc(node, action, ap);
        const marker = deriveTimelineMarker(node, action);
        const fClass = ap === 0 ? "f1" : ap === 1 ? "f2" : "";

        html += `<div class="event-card" data-step="${i}" tabindex="0"
                      role="button" aria-label="步骤 ${i+1}"
                      onclick="goto(${i})" onkeydown="if(event.key==='Enter'){goto(${i})}">
                    <div class="ev-icon ${action}">${icon}</div>
                    <div class="ev-body">
                        <div class="ev-desc">
                            ${fClass ? `<span class="ev-faction ${fClass}">${esc(factionShort(ap === 0 ? MATCH_DATA.meta.p1_faction : MATCH_DATA.meta.p2_faction))}</span>` : ""}
                            ${esc(desc)}
                        </div>
                    </div>
                    <div class="ev-marker">${marker}</div>
                </div>`;

        // v0.5: Show situation change event
        const prevSituation = i > 0 ? (timeline[i-1].state && timeline[i-1].state.battlefield_situation) : null;
        const currSituation = node.state && node.state.battlefield_situation;
        if (currSituation && (!prevSituation || prevSituation.id !== currSituation.id)) {
            html += `<div class="event-card" style="border-left-color:var(--gold);opacity:0.8">
                <div class="ev-icon" style="background:rgba(201,168,76,0.15);border-color:var(--gold);color:var(--gold)">🌍</div>
                <div class="ev-body"><div class="ev-desc" style="color:var(--gold)">态势变化：${esc(currSituation.name)}</div></div>
            </div>`;
        }

        // v0.5: Show commander reaction in timeline
        const reactionText = node.commander_reaction;
        if (reactionText) {
            html += `<div class="event-card" style="border-left-color:var(--brass-glow)">
                <div class="ev-icon" style="background:rgba(201,168,76,0.2);border-color:var(--brass-glow);color:var(--brass-glow)">⚜</div>
                <div class="ev-body"><div class="ev-desc" style="color:var(--brass-glow)">${esc(reactionText)}</div></div>
            </div>`;
        }
    }
    if (currentTurn !== -1) html += "</div>";
    container.innerHTML = html;
}

function deriveTimelineDesc(node, action, ap) {
    if (action === "start") return "对局开始";
    if (action === "end") return "对局结束";
    if (action === "end_turn") return "回合结束";
    if (action === "deploy") {
        const info = parseDeployLog(node);
        return info.unit ? `${info.unit} → ${info.line} 槽位${info.slot}` : "部署单位";
    }
    if (action === "event") {
        const info = parseEventLog(node);
        return info.card || "打出事件卡";
    }
    if (action === "advance") {
        const info = parseAdvanceLog(node);
        return info.unit ? `${info.unit} ${info.from}→${info.to}` : "行军移动";
    }
    if (action === "attack") {
        const ae = node.attack_event;
        if (ae) return `${getAttackerName(ae)} → ${getDefenderName(ae)} · ${ae.dmg_to_defender}伤害`;
        return "攻击";
    }
    if (action === "hq_attack") {
        const ae = node.attack_event;
        if (ae) return `${getAttackerName(ae)} → HQ · ${ae.dmg_to_defender}伤害`;
        return "直击 HQ";
    }
    return ACTION_LABELS[action] || action;
}

function deriveTimelineMarker(node, action) {
    if ((action === "attack" || action === "hq_attack") && node.attack_event) {
        if (node.attack_event.defender_killed) return "💀";
        if (node.attack_event.dmg_to_attacker > 0) return "⚔";
    }
    return "";
}

function highlightTimelineCard() {
    const cards = document.querySelectorAll("#timeline-scroll .event-card");
    cards.forEach(card => {
        const step = parseInt(card.dataset.step, 10);
        card.classList.toggle("current", step === currentStep);
    });
    const current = document.querySelector("#timeline-scroll .event-card.current");
    if (current) current.scrollIntoView({ block: "nearest", behavior: "auto" });
}

function getAttackerName(ae) { return ae.attacker_name || (ae.attacker && ae.attacker.name) || "?"; }
function getDefenderName(ae) { return ae.defender_name || (ae.defender && ae.defender.name) || "?"; }

function deriveHistoryRow(node, idx) {
    const action = node.action || "";
    const ap = node.active_player;
    let factionBadge = '<span class="faction-badge f-neutral">--</span>';
    if (ap === 0) factionBadge = `<span class="faction-badge f1">${esc(factionShort(MATCH_DATA.meta.p1_faction))}</span>`;
    else if (ap === 1) factionBadge = `<span class="faction-badge f2">${esc(factionShort(MATCH_DATA.meta.p2_faction))}</span>`;

    const actionBadge = `<span class="action-label ${esc(action)}">${esc(ACTION_LABELS[action] || action)}</span>`;
    let desc = "";
    let marker = "";

    if (action === "start") {
        desc = "对局开始";
    } else if (action === "deploy") {
        desc = extractDeployDesc(node);
    } else if (action === "event") {
        desc = extractEventDesc(node);
    } else if (action === "advance") {
        desc = extractAdvanceDesc(node);
    } else if (action === "attack") {
        const ae = node.attack_event;
        if (ae) {
            desc = `${esc(getAttackerName(ae))} → ${esc(getDefenderName(ae))} · 造成 ${ae.dmg_to_defender} 伤害`;
            if (ae.defender_killed) { desc += " · 击杀"; marker = "💀"; }
            if (ae.dmg_to_attacker > 0) marker += (marker ? " " : "") + `反击${ae.dmg_to_attacker}`;
        } else {
            desc = "攻击";
        }
    } else if (action === "hq_attack") {
        const ae = node.attack_event;
        if (ae) {
            desc = `${esc(getAttackerName(ae))} 直击 HQ · 造成 ${ae.dmg_to_defender} 伤害`;
        } else {
            desc = "直击 HQ";
        }
    }

    return { factionBadge, actionBadge, desc, marker };
}

function extractDeployDesc(node) {
    for (const line of (node.log || [])) {
        const m = line.match(/▶\s*\S+\s+部署\s+(\S+)\s+到\s+(\S+)\s+槽位(\d+)/);
        if (m) return `${m[1]} → ${m[2]} 槽位${m[3]}`;
    }
    return "部署单位";
}

function extractEventDesc(node) {
    for (const line of (node.log || [])) {
        const m = line.match(/📜\s*\S+\s+打出事件卡【([^】]+)】→\s*(.+)/);
        if (m) return `${m[1]} · ${m[2]}`;
    }
    return "打出事件卡";
}

function extractAdvanceDesc(node) {
    for (const line of (node.log || [])) {
        const m = line.match(/⇒\s*(\S+)\s+(\S+)→(\S+)\s+槽位(\d+)/);
        if (m) return `${m[1]} ${m[2]}→${m[3]} 槽位${m[4]}`;
    }
    return "行军移动";
}

// ======================================================================
// Render Step
// ======================================================================
function renderStep(idx) {
    const timeline = MATCH_DATA.timeline;
    currentStep = Math.max(0, Math.min(idx, timeline.length - 1));
    const node = timeline[currentStep];
    const s = node.state;

    // Snapshot diff
    const diff = computeDiff(prevStepState, s, node);

    // Turn info
    const turnDisplay = document.getElementById("turn-display");
    const activeDisplay = document.getElementById("active-display");
    const stepCounter = document.getElementById("step-counter");
    const turnLabel = document.getElementById("turn-label");
    if (turnDisplay) turnDisplay.textContent = node.turn;
    if (turnLabel) turnLabel.textContent = `回合 ${node.turn}`;

    let activeText = "";
    if (node.active_player === 0) activeText = s.p1.faction;
    else if (node.active_player === 1) activeText = s.p2.faction;
    if (node.action && ACTION_LABELS[node.action]) {
        activeText += activeText ? ` · ${ACTION_LABELS[node.action]}` : ACTION_LABELS[node.action];
    }
    if (activeDisplay) activeDisplay.textContent = activeText ? ` · ${activeText}` : "";
    if (stepCounter) stepCounter.textContent = `${currentStep + 1} / ${timeline.length}`;

    // Progress bar
    const pct = timeline.length > 1 ? (currentStep / (timeline.length - 1)) * 100 : 0;
    const progressFill = document.getElementById("progress-fill");
    if (progressFill) progressFill.style.width = pct + "%";

    // Player strips (removed, info now in HQ strips)
    // updatePlayerStrip("p1", s.p1, node.active_player === 0);
    // updatePlayerStrip("p2", s.p2, node.active_player === 1);

    // HQ
    const hqEnemyHp = document.getElementById("hq-enemy-hp");
    const hqPlayerHp = document.getElementById("hq-player-hp");
    if (hqEnemyHp) {
        hqEnemyHp.textContent = Math.max(0, s.p2.hq_hp);
        hqEnemyHp.classList.toggle("damaged", s.p2.hq_hp < startingHqHp("p2"));
    }
    if (hqPlayerHp) {
        hqPlayerHp.textContent = Math.max(0, s.p1.hq_hp);
        hqPlayerHp.classList.toggle("damaged", s.p1.hq_hp < startingHqHp("p1"));
    }
    // HQ health bars
    updateHqFill("enemy", s.p2.hq_hp, startingHqHp("p2"));
    updateHqFill("player", s.p1.hq_hp, startingHqHp("p1"));

    // HQ threat badges
    renderHqThreat(s);

    // HQ target highlight for HQ attacks
    const hqEnemy = document.getElementById("hq-enemy");
    const hqPlayerEl = document.getElementById("hq-player");
    const hqTarget = getHqTargetElement(node.active_player);
    if (hqEnemy) hqEnemy.classList.toggle("hq-target", node.action === "hq_attack" && hqTarget === hqEnemy);
    if (hqPlayerEl) hqPlayerEl.classList.toggle("hq-target", node.action === "hq_attack" && hqTarget === hqPlayerEl);

    // Battlefield lines
    renderBattlefieldLines(s, diff, node);

    // Action summary
    renderActionSummary(node);

    // Result overlay
    renderResultOverlay();

    // Arrows
    requestAnimationFrame(() => drawAttackArrows(node.attack_event || null, node.active_player));

    // Timeline: highlight current card
    highlightTimelineCard();

    // Raw log
    renderRawLog(node);

    // Button states
    updateButtonStates();

    // Save for next diff
    prevStepState = JSON.parse(JSON.stringify(s));
}

function updatePlayerStrip(prefix, player, isActive) {
    const strip = document.getElementById(`${prefix}-strip`);
    if (strip) strip.classList.toggle("active", isActive);
    setText(`${prefix}-name`, player.name);
    setText(`${prefix}-hq`, Math.max(0, player.hq_hp));
    setText(`${prefix}-orders`, player.orders);
    setText(`${prefix}-hand`, player.hand_size);
    setText(`${prefix}-deck`, player.deck_size);
    setText(`${prefix}-discard`, player.discard_size ?? 0);
}

function renderBattlefieldLines(s, diff, node) {
    // P2 rear
    document.getElementById("row-p2-rear").innerHTML = renderSlots(s.p2.rear, true, "后方线", diff);
    // P2 main
    document.getElementById("row-p2-main").innerHTML = renderSlots(s.p2.main, true, "主力战列线", diff);
    // Skirmish (shared)
    renderSkirmish(s, diff, node);
    // P1 main
    document.getElementById("row-p1-main").innerHTML = renderSlots(s.p1.main, false, "主力战列线", diff);
    // P1 rear
    document.getElementById("row-p1-rear").innerHTML = renderSlots(s.p1.rear, false, "后方线", diff);
    // Bind tooltips for unit cards
    bindUnitTooltips();
}

function renderSkirmish(s, diff, node) {
    const container = document.getElementById("row-skirmish");
    const stateLabel = document.getElementById("skirmish-state");
    const p1Units = s.p1.skirmish || [];
    const p2Units = s.p2.skirmish || [];

    // Skirmish state label
    if (stateLabel) {
        if (p1Units.length === 0 && p2Units.length === 0) {
            stateLabel.textContent = "[ 未接敌 ]";
        } else if (p1Units.length > 0 && p2Units.length === 0) {
            stateLabel.textContent = "[ 我方压制 ]";
        } else if (p1Units.length === 0 && p2Units.length > 0) {
            stateLabel.textContent = "[ 敌方压制 ]";
        } else {
            stateLabel.textContent = "[ 交战 ]";
        }
    }

    // Merge into 4 slots: P2 first, then P1
    const slots = [null, null, null, null];
    p2Units.forEach(u => {
        const slot = (Number.isInteger(u.slot) ? u.slot : 0);
        if (slot >= 0 && slot < 4 && !slots[slot]) {
            slots[slot] = { unit: u, isP2: true };
        }
    });
    p1Units.forEach(u => {
        const slot = (Number.isInteger(u.slot) ? u.slot : 0);
        if (slot >= 0 && slot < 4 && !slots[slot]) {
            slots[slot] = { unit: u, isP2: false };
        }
    });

    container.innerHTML = slots.map(entry => {
        if (!entry) return '<div class="slot-empty"></div>';
        const classes = unitCardClasses(entry.unit, entry.isP2, "散兵线", diff, node);
        const showOwner = true; // always show owner marker in skirmish
        return unitCardHTML(entry.unit, entry.isP2, "散兵线", classes, showOwner);
    }).join("");
}

function renderSlots(units, isP2, lineName, diff) {
    const slots = [null, null, null, null];
    (units || []).forEach((u, i) => {
        const slot = Number.isInteger(u.slot) ? u.slot : i;
        if (slot >= 0 && slot < 4 && !slots[slot]) {
            slots[slot] = u;
        }
    });
    return slots.map(u => {
        if (!u) return '<div class="slot-empty"></div>';
        const classes = unitCardClasses(u, isP2, lineName, diff, null);
        return unitCardHTML(u, isP2, lineName, classes, false);
    }).join("");
}

function unitCardClasses(u, isP2, lineName, diff, node) {
    let cls = "unit-card";
    cls += ` type-${unitTypeKey(u.type)}`;
    cls += ` faction-${unitFactionKey(u)}`;
    if (isP2) cls += " p2-unit";
    if (u.current_hp <= 0) cls += " is-dead";
    if (u.is_shaken) cls += " is-shaken";

    // Diff-based states
    if (diff) {
        const uid = unitKey(u, lineName, isP2);
        if (diff.newUnits.has(uid)) cls += " is-new";
        if (diff.hpChanged.has(uid)) cls += " is-hp-changed";
        if (diff.destroyed.has(uid)) cls += " is-dead";
    }

    // Attack event source/target
    if (node && node.attack_event) {
        if (unitMatchesAttackRef(u, isP2, lineName, node.attack_event.attacker, getAttackerName(node.attack_event))) cls += " is-source";
        if (unitMatchesAttackRef(u, isP2, lineName, node.attack_event.defender, getDefenderName(node.attack_event))) cls += " is-target";
    }

    return cls;
}

function unitCardHTML(u, isP2, lineName, classes, showOwner) {
    const damaged = u.current_hp > 0 && u.current_hp < u.max_hp;
    const hpClass = u.current_hp <= 0 ? "damaged" : damaged ? "damaged" : "full";
    const kw = (u.keywords || []).filter(k => !k.startsWith("光环")).slice(0, 3).join("·");
    const ownerMarker = showOwner
        ? `<span class="owner-marker ${isP2 ? 'p2' : 'p1'}" aria-label="${isP2 ? '敌方' : '我方'}"></span>`
        : "";
    const shakenBadge = u.is_shaken
        ? `<div class="ucard-status-shaken" title="动摇：攻击 -1，不能前压">动摇</div>`
        : "";
    return `<div class="${classes}" data-unit-name="${esc(u.name)}"
                 data-unit-owner="${isP2 ? 'p2' : 'p1'}"
                 data-unit-line="${esc(lineName)}"
                 data-unit-slot="${u.slot}"
                 data-unit-uid="${esc(unitKey(u, lineName, isP2))}"
                 data-keywords="${esc((u.keywords || []).join('|'))}">
        ${ownerMarker}
        ${shakenBadge}
        <div class="ucard-cost">${u.cost}</div>
        <div class="ucard-name" title="${esc(u.name)}">${esc(u.name)}</div>
        <div class="ucard-type">${esc(u.type)}</div>
        <div class="ucard-keywords">${esc(kw)}</div>
        <div class="ucard-stats">
            <span class="ucard-atk" aria-label="攻击力 ${u.attack}">${u.attack}</span>
            <span class="ucard-hp ${hpClass}" aria-label="生命 ${Math.max(0,u.current_hp)}/${u.max_hp}">${Math.max(0,u.current_hp)}/${u.max_hp}</span>
        </div>
    </div>`;
}

// ======================================================================
// Snapshot Diff
// ======================================================================
function computeDiff(prev, curr, node) {
    if (!prev) return null;
    const newUnits = new Set();
    const hpChanged = new Set();
    const destroyed = new Set();

    const prevKeys = collectUnitKeys(prev);
    const currKeys = collectUnitKeys(curr);

    // New units
    for (const k of currKeys.keys()) {
        if (!prevKeys.has(k)) newUnits.add(k);
    }

    // HP changes and destroyed
    for (const [k, currU] of currKeys) {
        const prevU = prevKeys.get(k);
        if (prevU) {
            if (currU.current_hp !== prevU.current_hp) {
                hpChanged.add(k);
            }
            if (currU.current_hp <= 0 && prevU.current_hp > 0) {
                destroyed.add(k);
            }
        }
    }

    return { newUnits, hpChanged, destroyed };
}

function collectUnitKeys(state) {
    const map = new Map();
    const addUnits = (units, lineName, isP2) => {
        for (const u of (units || [])) {
            const key = unitKey(u, lineName, isP2);
            map.set(key, u);
        }
    };
    addUnits(state.p1.rear, "后方线", false);
    addUnits(state.p1.main, "主力战列线", false);
    addUnits(state.p1.skirmish, "散兵线", false);
    addUnits(state.p2.rear, "后方线", true);
    addUnits(state.p2.main, "主力战列线", true);
    addUnits(state.p2.skirmish, "散兵线", true);
    return map;
}

function unitKey(u, lineName, isP2) {
    return u.uid || `${isP2 ? "P2" : "P1"}|${lineName}|${u.slot}|${u.name}`;
}

function unitMatchesAttackRef(u, isP2, lineName, ref, fallbackName) {
    if (!ref || ref.line === "hq") return false;
    const owner = isP2 ? "p2" : "p1";
    const refOwner = ref.owner ? String(ref.owner).toLowerCase() : "";
    if (refOwner && refOwner !== owner) return false;
    if (ref.line && ref.line !== lineName) return false;
    if (Number.isInteger(ref.slot) && ref.slot !== u.slot) return false;
    const refName = ref.name || fallbackName;
    return !refName || refName === u.name;
}

// ======================================================================
// Action Summary
// ======================================================================
function renderActionSummary(node) {
    const el = document.getElementById("action-summary");
    if (!el) return;

    const action = node.action || "";
    const ap = node.active_player;
    const activeName = node.active_name || "";
    const faction = ap === 0 ? MATCH_DATA.meta.p1_faction
                   : ap === 1 ? MATCH_DATA.meta.p2_faction : "";

    let html = `<span class="action-label ${esc(action)}">${esc(ACTION_LABELS[action] || action)}</span>`;

    if (action === "start") {
        html += `对局开始 · ${esc(MATCH_DATA.meta.p1_faction)} vs ${esc(MATCH_DATA.meta.p2_faction)} · 种子 ${MATCH_DATA.meta.seed}`;
    } else if (action === "deploy") {
        const info = parseDeployLog(node);
        html += `<strong>${esc(faction)}</strong>`;
        if (info.unit) html += ` 部署 <strong>${esc(info.unit)}</strong>`;
        if (info.line) html += ` 到 ${esc(info.line)}`;
        if (info.slot >= 0) html += ` 槽位${info.slot}`;
    } else if (action === "event") {
        const info = parseEventLog(node);
        html += `<strong>${esc(faction)}</strong>`;
        if (info.card) html += ` 打出事件 <strong>${esc(info.card)}</strong>`;
        if (info.effect) html += ` · ${esc(info.effect)}`;
    } else if (action === "advance") {
        const info = parseAdvanceLog(node);
        html += `<strong>${esc(faction)}</strong>`;
        if (info.unit) html += ` <strong>${esc(info.unit)}</strong>`;
        if (info.from && info.to) html += ` ${esc(info.from)} → ${esc(info.to)}`;
    } else if (action === "attack") {
        const ae = node.attack_event;
        if (ae) {
            html += `<strong>${esc(faction)}</strong> `;
            html += `<strong>${esc(getAttackerName(ae))}</strong>`;
            html += ` → <strong>${esc(getDefenderName(ae))}</strong>`;
            html += ` · 造成 ${ae.dmg_to_defender} 伤害`;
            if (ae.dmg_to_attacker > 0) html += ` · 受到 ${ae.dmg_to_attacker} 反击`;
            if (ae.defender_killed) html += " · <em>目标击杀</em>";
            if (ae.attacker_killed) html += " · <em>攻击方阵亡</em>";
        } else {
            html += `<strong>${esc(faction)}</strong> 发起攻击`;
        }
    } else if (action === "hq_attack") {
        const ae = node.attack_event;
        if (ae) {
            html += `<strong>${esc(faction)}</strong> `;
            html += `<strong>${esc(getAttackerName(ae))}</strong>`;
            html += ` 直击${esc(getHqTargetLabel(ap))} · 造成 ${ae.dmg_to_defender} 伤害`;
        } else {
            html += `<strong>${esc(faction)}</strong> 直击 HQ`;
        }
    } else {
        if (faction) html += `<strong>${esc(faction)}</strong>`;
    }

    // v0.5: Show battlefield situation if present
    const situation = node.battlefield_situation || (node.state && node.state.battlefield_situation);
    if (situation) {
        html += ` <span style="color:var(--gold);font-size:11px;background:rgba(201,168,76,0.1);padding:1px 5px;border-radius:3px;border:1px solid rgba(201,168,76,0.2)">🌍 ${esc(situation.name)}</span>`;
    }

    // v0.5: Show damage modifiers if present
    const dmgMods = node.damage_modifiers;
    if (dmgMods && dmgMods.length > 0) {
        for (const mod of dmgMods) {
            const sign = mod.delta > 0 ? "+" : "";
            const color = mod.delta > 0 ? "var(--forest-lt)" : "var(--blood-bright)";
            html += ` <span style="color:${color};font-size:10px;opacity:0.8">[${esc(mod.id)} ${sign}${mod.delta}]</span>`;
        }
    }

    el.innerHTML = html;
}

function parseDeployLog(node) {
    for (const line of (node.log || [])) {
        const m = line.match(/▶\s*\S+\s+部署\s+(\S+)\s+到\s+(\S+)\s+槽位(\d+)/);
        if (m) return { unit: m[1], line: m[2], slot: parseInt(m[3]) };
    }
    return { unit: null, line: null, slot: -1 };
}

function parseEventLog(node) {
    for (const line of (node.log || [])) {
        const m = line.match(/📜\s*\S+\s+打出事件卡【([^】]+)】→\s*(.+)/);
        if (m) return { card: m[1], effect: m[2] };
    }
    return { card: null, effect: null };
}

function parseAdvanceLog(node) {
    for (const line of (node.log || [])) {
        const m = line.match(/⇒\s*(\S+)\s+(\S+)→(\S+)\s+槽位(\d+)/);
        if (m) return { unit: m[1], from: m[2], to: m[3], slot: parseInt(m[4]) };
    }
    return { unit: null, from: null, to: null, slot: -1 };
}

// ======================================================================
// Attack Arrows
// ======================================================================
function focusActionElements(elements) {
    document.querySelectorAll(".unit-card.is-focus, .hq-strip.is-focus").forEach(el => el.classList.remove("is-focus"));
    elements.filter(Boolean).forEach(el => el.classList.add("is-focus"));
}

function drawAttackArrows(attackEvent, activePlayer) {
    const svg = document.getElementById("arrow-overlay");
    if (!svg) return;
    // Clear
    svg.querySelectorAll("line, text").forEach(el => el.remove());
    document.querySelectorAll(".attack-badge").forEach(el => el.remove());
    document.querySelectorAll(".unit-card.is-focus, .hq-strip.is-focus").forEach(el => el.classList.remove("is-focus"));
    if (!attackEvent) return;

    const bf = document.getElementById("battlefield");
    if (!bf) return;
    const bfRect = bf.getBoundingClientRect();

    const atkEl = findUnitElementForAttack(attackEvent.attacker, getAttackerName(attackEvent));
    let defEl;
    if (attackEvent.defender && attackEvent.defender.line === "hq") {
        defEl = getHqTargetElement(activePlayer);
    } else {
        defEl = findUnitElementForAttack(attackEvent.defender, getDefenderName(attackEvent));
    }

    if (!atkEl || !defEl) return;

    focusActionElements([atkEl, defEl]);

    const atkRect = atkEl.getBoundingClientRect();
    const defRect = defEl.getBoundingClientRect();

    const x1 = atkRect.left + atkRect.width / 2 - bfRect.left;
    const y1 = atkRect.top + atkRect.height / 2 - bfRect.top;
    const x2 = defRect.left + defRect.width / 2 - bfRect.left;
    const y2 = defRect.top + defRect.height / 2 - bfRect.top;

    // Arrow line
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1);
    line.setAttribute("y1", y1);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.classList.add("arrow-line");
    svg.appendChild(line);

    // Damage label at midpoint
    const midX = (x1 + x2) / 2;
    const midY = (y1 + y2) / 2;
    const dmgText = document.createElementNS("http://www.w3.org/2000/svg", "text");
    dmgText.setAttribute("x", midX);
    dmgText.setAttribute("y", midY - 10);
    dmgText.classList.add("arrow-damage");
    let dmgLabel = `-${attackEvent.dmg_to_defender}`;
    if (attackEvent.defender_killed) dmgLabel += " KILL";
    dmgText.textContent = dmgLabel;
    svg.appendChild(dmgText);

    // Defender HP badge
    if (attackEvent.defender_hp_after !== undefined && attackEvent.defender.line !== "hq") {
        const badge = document.createElement("div");
        badge.className = "attack-badge";
        const hpBefore = attackEvent.defender_hp_after + attackEvent.dmg_to_defender;
        badge.textContent = `HP: ${Math.max(0,attackEvent.defender_hp_after)}/${hpBefore}`;
        badge.style.left = (defRect.left - bfRect.left + defRect.width / 2 - 25) + "px";
        badge.style.top = (defRect.top - bfRect.top + defRect.height + 2) + "px";
        bf.appendChild(badge);
    }

    // Attacker damage badge
    if (attackEvent.dmg_to_attacker > 0 && attackEvent.attacker_hp_after !== undefined) {
        const badge = document.createElement("div");
        badge.className = "attack-badge";
        badge.style.background = "rgba(90,90,90,0.9)";
        const hpBefore = attackEvent.attacker_hp_after + attackEvent.dmg_to_attacker;
        badge.textContent = `HP: ${Math.max(0,attackEvent.attacker_hp_after)}/${hpBefore}`;
        badge.style.left = (atkRect.left - bfRect.left + atkRect.width / 2 - 25) + "px";
        badge.style.top = (atkRect.top - bfRect.top - 18) + "px";
        bf.appendChild(badge);
    }
}

function findUnitElementForAttack(ref, fallbackName) {
    if (!ref && !fallbackName) return null;
    const cards = document.querySelectorAll(".unit-card[data-unit-name]");
    for (const el of cards) {
        const ownerMatches = !ref?.owner || el.dataset.unitOwner === String(ref.owner).toLowerCase();
        const lineMatches = !ref?.line || el.dataset.unitLine === ref.line;
        const slotMatches = ref?.slot === undefined || Number(el.dataset.unitSlot) === ref.slot;
        const nameMatches = !fallbackName || el.dataset.unitName === fallbackName;
        if (ownerMatches && lineMatches && slotMatches && nameMatches) return el;
    }
    return null;
}

function getHqTargetElement(activePlayer) {
    if (activePlayer === 0) return document.getElementById("hq-enemy");
    if (activePlayer === 1) return document.getElementById("hq-player");
    return null;
}

function getHqTargetLabel(activePlayer) {
    if (activePlayer === 0) return "敌方 HQ";
    if (activePlayer === 1) return "我方 HQ";
    return "HQ";
}

function startingHqHp(playerKey) {
    if (MATCH_DATA?.meta?.starting_hq_hp) return MATCH_DATA.meta.starting_hq_hp;
    const firstState = MATCH_DATA?.timeline?.[0]?.state;
    if (playerKey === "p1") return firstState?.p1?.hq_hp ?? 14;
    return firstState?.p2?.hq_hp ?? 14;
}

// ======================================================================
// Navigation
// ======================================================================
function step(delta) {
    renderStep(currentStep + delta);
}

function goto(idx) {
    renderStep(idx);
}

function gotoPrevTurn() {
    const currentTurn = MATCH_DATA.timeline[currentStep].turn;
    for (let i = currentStep - 1; i >= 0; i--) {
        if (MATCH_DATA.timeline[i].turn < currentTurn) {
            // Go to first step of this turn
            const targetTurn = MATCH_DATA.timeline[i].turn;
            for (let j = i; j >= 0; j--) {
                if (MATCH_DATA.timeline[j].turn === targetTurn && (j === 0 || MATCH_DATA.timeline[j-1].turn < targetTurn)) {
                    goto(j);
                    return;
                }
            }
            goto(i);
            return;
        }
    }
    goto(0);
}

function gotoNextTurn() {
    const currentTurn = MATCH_DATA.timeline[currentStep].turn;
    for (let i = currentStep + 1; i < MATCH_DATA.timeline.length; i++) {
        if (MATCH_DATA.timeline[i].turn > currentTurn) {
            goto(i);
            return;
        }
    }
    goto(MATCH_DATA.timeline.length - 1);
}

function updateButtonStates() {
    const len = MATCH_DATA.timeline.length;
    setDisabled("btn-first", currentStep === 0);
    setDisabled("btn-prev", currentStep === 0);
    setDisabled("btn-next", currentStep >= len - 1);
    setDisabled("btn-last", currentStep >= len - 1);
    setDisabled("btn-prev-turn", currentStep === 0 || MATCH_DATA.timeline[currentStep].turn <= 0);
    setDisabled("btn-next-turn", currentStep >= len - 1);
}

// ======================================================================
// Autoplay
// ======================================================================
function togglePlay() {
    if (playInterval) {
        stopAutoplay();
    } else {
        if (currentStep >= MATCH_DATA.timeline.length - 1) goto(0);
        startAutoplay();
    }
}

function startAutoplay() {
    const btn = document.getElementById("btn-play");
    if (btn) { btn.textContent = "⏸"; btn.setAttribute("aria-label", "暂停"); }
    const interval = BASE_INTERVAL / playSpeed;
    playInterval = setInterval(() => {
        if (currentStep >= MATCH_DATA.timeline.length - 1) {
            stopAutoplay();
            return;
        }
        step(1);
    }, interval);
}

function stopAutoplay() {
    if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
    }
    const btn = document.getElementById("btn-play");
    if (btn) { btn.textContent = "▶"; btn.setAttribute("aria-label", "播放"); }
}

// ======================================================================
// Keyboard
// ======================================================================
function handleKeydown(e) {
    // Ignore if focus is in a select or input
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;

    switch (e.key) {
        case "ArrowLeft":
            e.preventDefault();
            step(-1);
            break;
        case "ArrowRight":
            e.preventDefault();
            step(1);
            break;
        case " ":
            e.preventDefault();
            togglePlay();
            break;
        case "Home":
            e.preventDefault();
            goto(0);
            break;
        case "End":
            e.preventDefault();
            goto(MATCH_DATA.timeline.length - 1);
            break;
    }
}

// ======================================================================
// HQ Threat
// ======================================================================
function renderHqThreat(s) {
    const p1Threat = estimateHqThreat(s.p1, s.p2);
    const p2Threat = estimateHqThreat(s.p2, s.p1);
    setHqThreat("hq-player", p2Threat);
    setHqThreat("hq-enemy", p1Threat);
}

function estimateHqThreat(attacker, defender) {
    const blockers = (defender.skirmish || []).length + (defender.main || []).length;
    if (blockers > 0) return 0;
    return [...(attacker.skirmish || []), ...(attacker.rear || [])]
        .filter(u => (u.keywords || []).includes("远程") || attacker.skirmish?.includes(u))
        .reduce((sum, u) => sum + Math.max(0, u.attack || 0), 0);
}

function setHqThreat(hqId, threat) {
    const hq = document.getElementById(hqId);
    if (!hq) return;
    let badge = hq.querySelector(".hq-threat");
    if (!badge) {
        badge = document.createElement("span");
        badge.className = "hq-threat";
        hq.appendChild(badge);
    }
    badge.textContent = threat > 0 ? `威胁 ${threat}` : "安全";
    badge.classList.toggle("danger", threat > 0);
}

// Helpers
// ======================================================================
function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
}

function setDisabled(id, disabled) {
    const el = document.getElementById(id);
    if (el) el.disabled = disabled;
}

function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function escapeHtml(s) { return esc(s); }

function factionClass(faction) {
    if (faction === "法兰西") return "france";
    if (faction === "普鲁士") return "prussia";
    if (faction === "俄罗斯") return "russia";
    return "france";
}

function factionShort(faction) {
    if (faction === "法兰西") return "法兰西";
    if (faction === "普鲁士") return "普鲁士";
    if (faction === "俄罗斯") return "俄罗斯";
    return faction || "";
}

function unitTypeKey(type) {
    if (type === "线列步兵") return "infantry";
    if (type === "散兵") return "skirmisher";
    if (type === "骑兵") return "cavalry";
    if (type === "炮兵") return "artillery";
    if (type === "近卫") return "guard";
    return "infantry";
}

function unitFactionKey(u) {
    const n = u.name || "";
    if (n.includes('俄') || n.includes('哥萨克') || n.includes('库图') || n.includes('巴格') ||
        n.includes('普拉') || n.includes('独角') || n.includes('莫斯科') || n.includes('帝国大军') ||
        n.includes('东正') || n.includes('西伯') || n.includes('猎兵团') || n.includes('俄国')) {
        return "russia";
    }
    if (n.includes('普鲁') || n.includes('耶格') || n.includes('黑色') || n.includes('死骑') ||
        n.includes('布吕') || n.includes('西里')) {
        return "prussia";
    }
    return "france";
}

// ======================================================================
// Unit Tooltip
// ======================================================================
const KEYWORD_HELP = {
    "冲锋": "部署当回合可行动。",
    "侧翼迂回": "骑兵在散兵线可绕过常规阻挡攻击后方目标。",
    "结阵": "降低受到骑兵冲击的伤害。",
    "齐射": "本回合首次攻击造成额外伤害。",
    "远程": "炮兵可从后方攻击，满足条件时可直击 HQ。",
    "守卫": "敌方必须优先攻击守卫单位。",
    "突破": "击杀目标后可对 HQ 造成溢出压力。"
};

function bindUnitTooltips() {
    const tooltip = document.getElementById("card-tooltip");
    if (!tooltip) return;
    document.querySelectorAll(".unit-card").forEach(card => {
        card.onmouseenter = () => showUnitTooltip(card, tooltip);
        card.onmousemove = (e) => positionTooltip(e, tooltip);
        card.onmouseleave = () => tooltip.classList.remove("visible");
    });
}

function showUnitTooltip(card, tooltip) {
    const keywords = (card.dataset.keywords || "").split("|").filter(Boolean);
    tooltip.innerHTML = `
        <div class="tt-name">${esc(card.dataset.unitName || "")}</div>
        <div class="tt-row">位置：${esc(card.dataset.unitLine || "")} · 槽位 ${Number(card.dataset.unitSlot) + 1}</div>
        <div class="tt-row">关键词：${keywords.length ? keywords.map(k => `${esc(k)}：${esc(KEYWORD_HELP[k] || "规则文本待补充")}`).join("<br>") : "无"}</div>
    `;
    tooltip.classList.add("visible");
}

function positionTooltip(e, tooltip) {
    const x = Math.min(window.innerWidth - 300, e.clientX + 14);
    const y = Math.min(window.innerHeight - 160, e.clientY + 14);
    tooltip.style.left = `${Math.max(8, x)}px`;
    tooltip.style.top = `${Math.max(8, y)}px`;
}

// ======================================================================
// Screen reader only utility
// ======================================================================
// Add .sr-only class via JS injection
(function() {
    const style = document.createElement("style");
    style.textContent = ".sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}";
    document.head.appendChild(style);
})();

// ======================================================================
// Init
// ======================================================================
loadMatch();
</script>
