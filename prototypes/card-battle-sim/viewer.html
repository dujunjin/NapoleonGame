<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拿破仑战争 - 对局回放</title>
<style>
/* === CSS Variables === */
:root {
    --bg-deep: #1a1a2e;
    --bg-surface: #22223a;
    --bg-raised: #2a2a48;
    --border-main: #4a4a6a;
    --border-dim: #3a3a58;
    --text-primary: #e0dde8;
    --text-secondary: #9a98a8;
    --text-muted: #6a687a;
    --gold: #c9a84c;
    --gold-bright: #e0c060;
    --red: #c2552c;
    --red-bright: #e06040;
    --green: #4a8a5a;
    --green-bright: #5aaa6a;
    --blue-gray: #5a7a9a;
    --faction-france: #4a6fa5;
    --faction-prussia: #5a5a5a;
    --faction-russia: #3a6a4a;
    --card-paper: #f0e8d0;
    --card-paper-dark: #d8c8a0;
    --type-infantry: #8fb0c5;
    --type-skirmisher: #7daf64;
    --type-cavalry: #c06a5b;
    --type-artillery: #b79a4a;
    --type-guard: #9f75bd;
    --font-main: "Hiragino Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "SF Mono", "Menlo", "Consolas", monospace;
    --radius: 4px;
    --radius-lg: 6px;
    --shadow: 0 2px 8px rgba(0,0,0,0.4);
    --shadow-inset: inset 0 0 20px rgba(0,0,0,0.3);
}

/* === Reset & Base === */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: var(--font-main);
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    background-image:
        radial-gradient(ellipse at top, rgba(40,40,80,0.3) 0%, transparent 60%),
        repeating-linear-gradient(45deg, transparent 0, transparent 10px, rgba(255,255,255,0.01) 10px, rgba(255,255,255,0.01) 20px);
}

/* === Page Layout === */
.page {
    max-width: 1400px;
    margin: 0 auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* === Replay Header === */
.replay-header {
    text-align: center;
    padding: 12px 16px;
    background: var(--bg-surface);
    border: 1px solid var(--border-main);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
}
.replay-header h1 {
    font-size: 22px;
    letter-spacing: 4px;
    color: var(--gold);
    text-shadow: 1px 1px 0 #000;
}
.replay-header .matchup {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 4px;
}
.replay-header .matchup .faction-p1 { color: var(--faction-france); font-weight: bold; }
.replay-header .matchup .faction-p2 { color: var(--faction-russia); font-weight: bold; }
.replay-header .meta-line {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
}

/* === Controls Bar === */
.controls-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    background: var(--bg-surface);
    border: 1px solid var(--border-main);
    border-radius: var(--radius);
    padding: 8px 12px;
    box-shadow: var(--shadow);
}
.controls-left {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}
.controls-center {
    display: flex;
    align-items: center;
    gap: 4px;
}
.controls-right {
    display: flex;
    align-items: center;
    gap: 8px;
}

.turn-info {
    font-size: 13px;
    color: var(--text-secondary);
}
.turn-info .turn-num {
    color: var(--gold-bright);
    font-size: 18px;
    font-weight: bold;
}
.turn-info .active-player {
    color: var(--gold);
    font-weight: bold;
}
.step-counter {
    font-size: 12px;
    color: var(--text-muted);
    font-family: var(--font-mono);
}

/* Buttons */
.btn {
    background: var(--bg-raised);
    color: var(--text-primary);
    border: 1px solid var(--border-main);
    padding: 6px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    border-radius: var(--radius);
    transition: background 0.15s, border-color 0.15s;
    white-space: nowrap;
}
.btn:hover { background: var(--border-main); border-color: var(--text-muted); }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
}
.btn.primary {
    background: var(--red);
    border-color: var(--red-bright);
    color: #fff;
}
.btn.primary:hover { background: var(--red-bright); }
.btn.icon-btn {
    padding: 6px 8px;
    min-width: 32px;
    text-align: center;
}

.speed-select {
    background: var(--bg-raised);
    color: var(--text-primary);
    border: 1px solid var(--border-main);
    padding: 4px 6px;
    font-family: inherit;
    font-size: 12px;
    border-radius: var(--radius);
    cursor: pointer;
}
.speed-select:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
}

#step-slider {
    width: min(220px, 40vw);
    accent-color: var(--gold);
}
.filter-group {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
}
.filter-chip {
    background: var(--bg-raised);
    color: var(--text-secondary);
    border: 1px solid var(--border-dim);
    border-radius: var(--radius);
    padding: 4px 7px;
    font-size: 11px;
    cursor: pointer;
}
.filter-chip.active {
    color: #1a1a1a;
    background: var(--gold);
    border-color: var(--gold-bright);
}

.match-select {
    background: var(--bg-raised);
    color: var(--text-primary);
    border: 1px solid var(--border-main);
    padding: 6px 8px;
    font-family: inherit;
    font-size: 13px;
    border-radius: var(--radius);
    cursor: pointer;
    max-width: 200px;
}
.match-select:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
}

/* === Player Info Strips === */
.info-strips {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
}
.player-strip {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-surface);
    border: 1px solid var(--border-dim);
    border-radius: var(--radius);
    padding: 6px 12px;
    font-size: 12px;
    flex-wrap: wrap;
}
.player-strip.active {
    border-color: var(--gold);
    box-shadow: 0 0 6px rgba(201,168,76,0.3);
}
.player-strip .strip-name {
    font-weight: bold;
    font-size: 13px;
    min-width: 80px;
}
.player-strip .strip-name.p1 { color: var(--faction-france); }
.player-strip .strip-name.p2 { color: var(--faction-russia); }
.player-strip .strip-stat {
    display: flex;
    align-items: baseline;
    gap: 3px;
}
.player-strip .strip-stat .label {
    color: var(--text-muted);
    font-size: 11px;
}
.player-strip .strip-stat .value {
    color: var(--text-primary);
    font-weight: bold;
}
.player-strip .strip-stat .value.hq-hp {
    color: var(--red-bright);
    font-size: 15px;
}
.player-strip .strip-stat .value.orders {
    color: var(--gold);
}

/* === Battle Board === */
.battle-board {
    background: var(--bg-surface);
    border: 2px solid var(--border-main);
    border-radius: var(--radius-lg);
    padding: 12px;
    box-shadow: var(--shadow), var(--shadow-inset);
    position: relative;
    overflow: hidden;
}

/* HQ strips */
.hq-strip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: rgba(0,0,0,0.25);
    border-radius: var(--radius);
    margin-bottom: 6px;
}
.hq-strip.enemy {
    border-left: 4px solid var(--faction-russia);
}
.hq-strip.player {
    border-left: 4px solid var(--faction-france);
}
.hq-strip.enemy.p2-prussia { border-left-color: var(--faction-prussia); }
.hq-strip.enemy.p2-russia { border-left-color: var(--faction-russia); }
.hq-strip.enemy.p2-france { border-left-color: var(--faction-france); }
.hq-strip .hq-label {
    font-size: 14px;
    font-weight: bold;
    color: var(--text-secondary);
}
.hq-strip .hq-hp {
    font-size: 22px;
    font-weight: bold;
    color: var(--red-bright);
}
.hq-strip .hq-hp.damaged { color: var(--red); }
.hq-strip.hq-target {
    box-shadow: 0 0 12px rgba(194,85,44,0.6);
    border-color: var(--red-bright);
}

/* Battlefield lines */
.bf-lines {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.bf-line {
    display: flex;
    align-items: stretch;
    gap: 0;
    background: rgba(0,0,0,0.15);
    border: 1px solid var(--border-dim);
    border-radius: var(--radius);
    min-height: 90px;
    overflow: hidden;
}
.bf-line.skirmish-line {
    background: linear-gradient(to bottom, rgba(201,168,76,0.08), rgba(201,168,76,0.04));
    border: 1px dashed var(--border-main);
}
.bf-line-divider {
    text-align: center;
    color: var(--text-muted);
    font-size: 10px;
    letter-spacing: 4px;
    padding: 2px 0;
    user-select: none;
}

.line-label-col {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    width: 28px;
    min-width: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 11px;
    letter-spacing: 2px;
    border-right: 1px solid var(--border-dim);
    background: rgba(0,0,0,0.1);
    flex-shrink: 0;
}
.line-label-col .skirmish-state {
    font-size: 9px;
    color: var(--gold);
    display: block;
    margin-top: 4px;
    writing-mode: horizontal-tb;
}

.units-row {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 6px;
    align-items: center;
    min-height: 90px;
}
.slot-empty {
    border: 1px dashed rgba(74,74,106,0.4);
    border-radius: var(--radius);
    background: rgba(0,0,0,0.08);
    min-height: 78px;
    min-width: 0;
}

/* SVG arrow overlay */
.arrow-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
}
.arrow-line {
    stroke: var(--red);
    stroke-width: 3;
    marker-end: url(#arrowhead);
    filter: drop-shadow(0 0 4px rgba(194,85,44,0.6));
}
.arrow-damage {
    font-size: 13px;
    font-weight: bold;
    fill: var(--red-bright);
    text-anchor: middle;
    dominant-baseline: middle;
    filter: drop-shadow(0 0 3px rgba(0,0,0,0.8));
}
.attack-badge {
    position: absolute;
    background: rgba(194,85,44,0.9);
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    padding: 2px 5px;
    border-radius: 3px;
    pointer-events: none;
    z-index: 11;
    white-space: nowrap;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
}

/* === Unit Cards === */
.unit-card {
    background: linear-gradient(135deg, var(--card-paper) 0%, var(--card-paper-dark) 100%);
    border: 2px solid var(--border-dim);
    border-radius: var(--radius);
    color: #2a2a2a;
    padding: 4px;
    display: flex;
    flex-direction: column;
    box-shadow: 1px 1px 3px rgba(0,0,0,0.4);
    font-size: 10px;
    position: relative;
    min-width: 0;
    transition: box-shadow 0.2s, opacity 0.3s;
}
.unit-card.p2-unit {
    transform: scaleY(-1);
}
.unit-card.p2-unit > * { transform: scaleY(-1); }

/* Faction borders */
.unit-card.faction-france { border-color: var(--faction-france); }
.unit-card.faction-prussia { border-color: var(--faction-prussia); }
.unit-card.faction-russia { border-color: var(--faction-russia); }

/* Type backgrounds */
.unit-card.type-infantry { background: linear-gradient(135deg, #d8e7f2 0%, #a0c0d4 100%); }
.unit-card.type-skirmisher { background: linear-gradient(135deg, #dff0cf 0%, #a0c878 100%); }
.unit-card.type-cavalry { background: linear-gradient(135deg, #f2d5d1 0%, #d08070 100%); }
.unit-card.type-artillery { background: linear-gradient(135deg, #ece1be 0%, #c8aa58 100%); }
.unit-card.type-guard { background: linear-gradient(135deg, #eadcf4 0%, #b088cc 100%); }

/* Unit cost badge */
.ucard-cost {
    position: absolute;
    top: -5px;
    left: -5px;
    width: 20px;
    height: 20px;
    background: var(--red);
    color: #fff;
    border: 2px solid #2a2a2a;
    border-radius: 50%;
    text-align: center;
    line-height: 16px;
    font-weight: bold;
    font-size: 11px;
    z-index: 1;
}
.ucard-name {
    font-weight: bold;
    font-size: 10px;
    text-align: center;
    margin-top: 4px;
    line-height: 1.2;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    border-bottom: 1px solid rgba(0,0,0,0.15);
    padding-bottom: 2px;
}
.ucard-type {
    font-size: 9px;
    color: #5a5a5a;
    text-align: center;
    margin: 1px 0;
}
.ucard-keywords {
    font-size: 8px;
    color: #2a4a8b;
    text-align: center;
    flex: 1;
    line-height: 1.3;
    overflow: hidden;
}
.ucard-stats {
    display: flex;
    justify-content: space-between;
    border-top: 1px solid rgba(0,0,0,0.15);
    padding-top: 2px;
    font-weight: bold;
}
.ucard-atk { color: var(--red); font-size: 12px; }
.ucard-hp { font-size: 12px; }
.ucard-hp.damaged { color: var(--red); }
.ucard-hp.full { color: var(--green); }

/* Unit states */
.unit-card.is-source {
    box-shadow: 0 0 8px rgba(201,168,76,0.7), 0 0 2px var(--gold);
    border-color: var(--gold);
}
.unit-card.is-target {
    box-shadow: 0 0 8px rgba(194,85,44,0.7), 0 0 2px var(--red-bright);
    border-color: var(--red-bright);
}
.unit-card.is-dead {
    opacity: 0.35;
    filter: grayscale(0.8);
    border-style: dashed;
}
.unit-card.is-new {
    animation: deploy-pulse 0.8s ease-out;
}
.unit-card.is-hp-changed .ucard-hp {
    animation: hp-flash 0.6s ease-out;
}

@keyframes deploy-pulse {
    0% { box-shadow: 0 0 16px rgba(74,138,90,0.8); transform: scale(1.05); }
    100% { box-shadow: none; transform: scale(1); }
}
@keyframes hp-flash {
    0% { background: rgba(194,85,44,0.3); }
    100% { background: transparent; }
}

/* Owner marker for skirmish */
.owner-marker {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    z-index: 1;
}
.owner-marker.p1 { background: var(--faction-france); }
.owner-marker.p2 { background: var(--faction-russia); }

/* === Current Action Panel === */
.action-panel {
    background: var(--bg-surface);
    border: 1px solid var(--border-main);
    border-radius: var(--radius);
    padding: 10px 16px;
    box-shadow: var(--shadow);
}
.action-panel .action-summary {
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-primary);
}
.action-panel .action-summary .action-label {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: bold;
    margin-right: 6px;
    vertical-align: middle;
}
.action-label.deploy { background: var(--gold); color: #1a1a1a; }
.action-label.advance { background: var(--blue-gray); color: #fff; }
.action-label.attack { background: var(--red); color: #fff; }
.action-label.event { background: var(--green); color: #fff; }
.action-label.hq_attack { background: #8b2a1f; color: #fff; }
.action-label.start { background: var(--text-muted); color: #fff; }
.action-label.end { background: var(--green); color: #fff; }

/* === Battle History === */
.history-panel {
    background: var(--bg-surface);
    border: 1px solid var(--border-main);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
}
.history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border-dim);
}
.history-header .panel-title {
    font-size: 13px;
    font-weight: bold;
    color: var(--gold);
    letter-spacing: 1px;
}
.history-toggle-btn {
    background: none;
    border: 1px solid var(--border-dim);
    color: var(--text-secondary);
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    border-radius: var(--radius);
    font-family: inherit;
}
.history-toggle-btn:hover { border-color: var(--text-muted); }
.history-toggle-btn:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
}

.history-table-wrap {
    max-height: 280px;
    overflow-y: auto;
    overflow-x: auto;
}
.history-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}
.history-table thead th {
    position: sticky;
    top: 0;
    background: var(--bg-raised);
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: bold;
    text-align: left;
    padding: 5px 8px;
    border-bottom: 1px solid var(--border-dim);
    white-space: nowrap;
}
.history-table tbody tr {
    cursor: pointer;
    transition: background 0.1s;
}
.history-table tbody tr:hover {
    background: rgba(201,168,76,0.08);
}
.history-table tbody tr.current-row {
    background: rgba(201,168,76,0.15);
    border-left: 3px solid var(--gold);
}
.history-table tbody tr:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: -2px;
}
.history-table td {
    padding: 4px 8px;
    border-bottom: 1px solid rgba(74,74,106,0.2);
    vertical-align: middle;
    white-space: nowrap;
}
.history-table td.desc-cell {
    white-space: normal;
    max-width: 400px;
    overflow: hidden;
    text-overflow: ellipsis;
}
.history-table .faction-badge {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: bold;
    color: #fff;
}
.faction-badge.f1 { background: var(--faction-france); }
.faction-badge.f2 { background: var(--faction-russia); }
.faction-badge.f-neutral { background: var(--text-muted); }
.history-table .action-badge {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 10px;
    font-weight: bold;
}
.history-table .marker {
    font-size: 10px;
}

/* Raw log area */
.raw-log-area {
    border-top: 1px solid var(--border-dim);
    display: none;
}
.raw-log-area.visible { display: block; }
.raw-log-content {
    max-height: 180px;
    overflow-y: auto;
    padding: 8px 12px;
    font-family: var(--font-mono);
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-secondary);
}
.raw-log-content .log-line { margin: 1px 0; }
.raw-log-content .log-line.log-deploy { color: var(--gold); }
.raw-log-content .log-line.log-attack { color: var(--red-bright); }
.raw-log-content .log-line.log-special { color: var(--green-bright); }

/* === Final Result Banner === */
.result-banner {
    display: none;
    background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05));
    border: 1px solid var(--gold);
    border-radius: var(--radius);
    padding: 12px 20px;
    text-align: center;
    box-shadow: 0 0 12px rgba(201,168,76,0.2);
}
.result-banner.visible { display: block; }
.result-banner .result-title {
    font-size: 18px;
    font-weight: bold;
    color: var(--gold-bright);
    letter-spacing: 2px;
}
.result-banner .result-detail {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
}

/* === Loading & Error === */
.state-message {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 14px;
}
.state-message.error {
    color: var(--red-bright);
}
.state-message code {
    background: var(--bg-raised);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-primary);
}

/* === Accessibility: reduced motion === */
@media (prefers-reduced-motion: reduce) {
    .unit-card.is-new { animation: none; }
    .unit-card.is-hp-changed .ucard-hp { animation: none; }
    .arrow-line { filter: none; }
}

/* === Responsive === */
@media (max-width: 900px) {
    .info-strips {
        grid-template-columns: 1fr;
    }
    .controls-bar {
        flex-direction: column;
        align-items: stretch;
    }
    .controls-left, .controls-center, .controls-right {
        justify-content: center;
    }
    .history-table td.desc-cell {
        max-width: 180px;
    }
}

@media (max-width: 500px) {
    .page { padding: 6px 8px; gap: 8px; }

<body>
<div class="page" id="app">
    <div class="state-message" id="loading-state">加载对局数据中...</div>

<script>
// ======================================================================
// State
// ======================================================================
let MATCH_DATA = null;
let currentStep = 0;
let playInterval = null;
let playSpeed = 1; // 0.5, 1, 2, 4
let prevStepState = null; // for snapshot diff
let rawLogVisible = false;
let activeHistoryFilter = "all";

const ACTION_LABELS = {
    deploy: "部署", advance: "行军", attack: "攻击",
    event: "事件", hq_attack: "直击HQ", start: "开局", end: "终局"
};

const BASE_INTERVAL = 500; // ms at 1x

// ======================================================================
// Data Loading
// ======================================================================
async function loadMatch(filename) {
    filename = filename || "match_data.json";
    const app = document.getElementById("app");
    app.innerHTML = `<div class="state-message">加载 <strong>${escapeHtml(filename)}</strong> 中...</div>`;
    try {
        const res = await fetch(filename);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        MATCH_DATA = await res.json();
        currentStep = 0;
        prevStepState = null;
        buildUI();
    } catch (e) {
        app.innerHTML = `
            <div class="state-message error">
                <p>无法加载 <strong>${escapeHtml(filename)}</strong></p>
                <p style="margin-top:12px;font-size:13px;color:var(--text-secondary)">
                    可能是本地文件访问问题。请尝试启动本地服务器：
                </p>
                <p style="margin-top:8px">
                    <code>cd prototypes/card-battle-sim && python3 -m http.server 8000</code>
                </p>
                <p style="margin-top:8px;font-size:12px;color:var(--text-muted)">
                    然后访问 <code>http://localhost:8000/viewer.html</code>
                </p>
                <p style="margin-top:12px;font-size:12px;color:var(--text-muted)">
                    错误信息：${escapeHtml(e.message)}
                </p>
            </div>`;
    }
}

async function loadDifferent(filename) {
    stopAutoplay();

            activeHistoryFilter = btn.dataset.filter;
            document.querySelectorAll(".filter-chip").forEach(b => b.classList.toggle("active", b === btn));
            buildHistoryTable();

// ======================================================================
// History Table
// ======================================================================
function buildHistoryTable() {
    const tbody = document.getElementById("history-body");
    const timeline = MATCH_DATA.timeline;
    let html = "";
    for (let i = 0; i < timeline.length; i++) {
        const node = timeline[i];
        if (activeHistoryFilter !== "all" && node.action !== activeHistoryFilter) continue;
        const stepData = deriveHistoryRow(node, i);
        html += `<tr data-step="${i}" tabindex="0"
                     role="button" aria-label="跳转到步骤 ${i+1}"
                     onclick="goto(${i})" onkeydown="if(event.key==='Enter'){goto(${i})}">
                    <td>${i + 1}</td>
                    <td>${node.turn}</td>
                    <td>${stepData.factionBadge}</td>
                    <td>${stepData.actionBadge}</td>
                    <td class="desc-cell" title="${esc(stepData.desc)}">${esc(stepData.desc)}</td>
                    <td class="marker">${stepData.marker}</td>
                 </tr>`;
    }
    tbody.innerHTML = html;
}

function getAttackerName(ae) { return ae.attacker_name || (ae.attacker && ae.attacker.name) || "?"; }
function getDefenderName(ae) { return ae.defender_name || (ae.defender && ae.defender.name) || "?"; }

function deriveHistoryRow(node, idx) {
    const action = node.action || "";
    const ap = node.active_player;
    let factionBadge = '<span class="faction-badge f-neutral">--</span>';
    if (ap === 0) factionBadge = `<span class="faction-badge f1">${esc(factionShort(MATCH_DATA.meta.p1_faction))}</span>`;
    else if (ap === 1) factionBadge = `<span class="faction-badge f2">${esc(factionShort(MATCH_DATA.meta.p2_faction))}</span>`;

    const actionBadge = `<span class="action-label ${esc(action)}">${esc(ACTION_LABELS[action] || action)}</span>`;
    let desc = "";
    let marker = "";

    if (action === "start") {
        desc = "对局开始";
    } else if (action === "deploy") {
        desc = extractDeployDesc(node);
    } else if (action === "event") {
        desc = extractEventDesc(node);
    } else if (action === "advance") {
        desc = extractAdvanceDesc(node);
    } else if (action === "attack") {
        const ae = node.attack_event;
        if (ae) {
            desc = `${esc(getAttackerName(ae))} → ${esc(getDefenderName(ae))} · 造成 ${ae.dmg_to_defender} 伤害`;
            if (ae.defender_killed) { desc += " · 击杀"; marker = "💀"; }
            if (ae.dmg_to_attacker > 0) marker += (marker ? " " : "") + `反击${ae.dmg_to_attacker}`;
        } else {
            desc = "攻击";
        }
    } else if (action === "hq_attack") {
        const ae = node.attack_event;
        if (ae) {
            desc = `${esc(getAttackerName(ae))} 直击 HQ · 造成 ${ae.dmg_to_defender} 伤害`;
        } else {
            desc = "直击 HQ";
        }
    }

    return { factionBadge, actionBadge, desc, marker };
}

function extractDeployDesc(node) {
    for (const line of (node.log || [])) {
        const m = line.match(/▶\s*\S+\s+部署\s+(\S+)\s+到\s+(\S+)\s+槽位(\d+)/);
        if (m) return `${m[1]} → ${m[2]} 槽位${m[3]}`;
    }
    return "部署单位";
}

function extractEventDesc(node) {
    for (const line of (node.log || [])) {
        const m = line.match(/📜\s*\S+\s+打出事件卡【([^】]+)】→\s*(.+)/);
        if (m) return `${m[1]} · ${m[2]}`;
    }
    return "打出事件卡";
}

function extractAdvanceDesc(node) {
    for (const line of (node.log || [])) {
        const m = line.match(/⇒\s*(\S+)\s+(\S+)→(\S+)\s+槽位(\d+)/);
        if (m) return `${m[1]} ${m[2]}→${m[3]} 槽位${m[4]}`;
    }
    return "行军移动";
}

// ======================================================================
// Render Step
// ======================================================================
function renderStep(idx) {
    const timeline = MATCH_DATA.timeline;
    currentStep = Math.max(0, Math.min(idx, timeline.length - 1));
    const node = timeline[currentStep];
    const s = node.state;

    // Snapshot diff
    const diff = computeDiff(prevStepState, s, node);

    // Turn info
    const turnDisplay = document.getElementById("turn-display");
    const activeDisplay = document.getElementById("active-display");
    const stepCounter = document.getElementById("step-counter");
    if (turnDisplay) turnDisplay.textContent = node.turn;

    let activeText = "";
    if (node.active_player === 0) activeText = s.p1.faction;
    else if (node.active_player === 1) activeText = s.p2.faction;
    if (node.action && ACTION_LABELS[node.action]) {
        activeText += activeText ? ` · ${ACTION_LABELS[node.action]}` : ACTION_LABELS[node.action];
    }
    if (activeDisplay) activeDisplay.textContent = activeText ? ` · ${activeText}` : "";
    if (stepCounter) stepCounter.textContent = `[${currentStep + 1} / ${timeline.length}]`;

    // Player strips
    updatePlayerStrip("p1", s.p1, node.active_player === 0);
    updatePlayerStrip("p2", s.p2, node.active_player === 1);

    // HQ
    const hqEnemyHp = document.getElementById("hq-enemy-hp");
    const hqPlayerHp = document.getElementById("hq-player-hp");
    if (hqEnemyHp) {
        hqEnemyHp.textContent = Math.max(0, s.p2.hq_hp);
        hqEnemyHp.classList.toggle("damaged", s.p2.hq_hp < startingHqHp("p2"));
    }
    if (hqPlayerHp) {
        hqPlayerHp.textContent = Math.max(0, s.p1.hq_hp);
        hqPlayerHp.classList.toggle("damaged", s.p1.hq_hp < startingHqHp("p1"));
    }

    // HQ target highlight for HQ attacks
    const hqEnemy = document.getElementById("hq-enemy");
    const hqPlayerEl = document.getElementById("hq-player");
    const hqTarget = getHqTargetElement(node.active_player);
    if (hqEnemy) hqEnemy.classList.toggle("hq-target", node.action === "hq_attack" && hqTarget === hqEnemy);
    if (hqPlayerEl) hqPlayerEl.classList.toggle("hq-target", node.action === "hq_attack" && hqTarget === hqPlayerEl);

    // Battlefield lines
    renderBattlefieldLines(s, diff, node);

    // Action summary
    renderActionSummary(node);

    // Result banner
    renderResultBanner();

    // Arrows
    requestAnimationFrame(() => drawAttackArrows(node.attack_event || null, node.active_player));

    // Sync timeline scrubber
    const slider = document.getElementById("step-slider");
    if (slider) slider.value = currentStep;

    // History: highlight current row
    highlightHistoryRow();

    // Raw log
    renderRawLog(node);

    // Button states
    updateButtonStates();

    // Save for next diff
    prevStepState = JSON.parse(JSON.stringify(s));
}

function updatePlayerStrip(prefix, player, isActive) {
    const strip = document.getElementById(`${prefix}-strip`);
    if (strip) strip.classList.toggle("active", isActive);
    setText(`${prefix}-name`, player.name);
    setText(`${prefix}-hq`, Math.max(0, player.hq_hp));
    setText(`${prefix}-orders`, player.orders);
    setText(`${prefix}-hand`, player.hand_size);
    setText(`${prefix}-deck`, player.deck_size);
    setText(`${prefix}-discard`, player.discard_size ?? 0);
}

function renderBattlefieldLines(s, diff, node) {
    // P2 rear
    document.getElementById("row-p2-rear").innerHTML = renderSlots(s.p2.rear, true, "后方线", diff);
    // P2 main
    document.getElementById("row-p2-main").innerHTML = renderSlots(s.p2.main, true, "主力战列线", diff);
    // Skirmish (shared)
    renderSkirmish(s, diff, node);
    // P1 main
    document.getElementById("row-p1-main").innerHTML = renderSlots(s.p1.main, false, "主力战列线", diff);
    // P1 rear
    document.getElementById("row-p1-rear").innerHTML = renderSlots(s.p1.rear, false, "后方线", diff);
}

function renderSkirmish(s, diff, node) {
    const container = document.getElementById("row-skirmish");
    const stateLabel = document.getElementById("skirmish-state");
    const p1Units = s.p1.skirmish || [];
    const p2Units = s.p2.skirmish || [];

    // Skirmish state label
    if (stateLabel) {
        if (p1Units.length === 0 && p2Units.length === 0) {
            stateLabel.textContent = "[ 未接敌 ]";
        } else if (p1Units.length > 0 && p2Units.length === 0) {
            stateLabel.textContent = "[ 我方压制 ]";
        } else if (p1Units.length === 0 && p2Units.length > 0) {
            stateLabel.textContent = "[ 敌方压制 ]";
        } else {
            stateLabel.textContent = "[ 交战 ]";
        }
    }

    // Merge into 4 slots: P2 first, then P1
    const slots = [null, null, null, null];
    p2Units.forEach(u => {
        const slot = (Number.isInteger(u.slot) ? u.slot : 0);
        if (slot >= 0 && slot < 4 && !slots[slot]) {
            slots[slot] = { unit: u, isP2: true };
        }
    });
    p1Units.forEach(u => {
        const slot = (Number.isInteger(u.slot) ? u.slot : 0);
        if (slot >= 0 && slot < 4 && !slots[slot]) {
            slots[slot] = { unit: u, isP2: false };
        }
    });

    container.innerHTML = slots.map(entry => {
        if (!entry) return '<div class="slot-empty"></div>';
        const classes = unitCardClasses(entry.unit, entry.isP2, "散兵线", diff, node);
        const showOwner = true; // always show owner marker in skirmish
        return unitCardHTML(entry.unit, entry.isP2, "散兵线", classes, showOwner);
    }).join("");
}

function renderSlots(units, isP2, lineName, diff) {
    const slots = [null, null, null, null];
    (units || []).forEach((u, i) => {
        const slot = Number.isInteger(u.slot) ? u.slot : i;
        if (slot >= 0 && slot < 4 && !slots[slot]) {
            slots[slot] = u;
        }
    });
    return slots.map(u => {
        if (!u) return '<div class="slot-empty"></div>';
        const classes = unitCardClasses(u, isP2, lineName, diff, null);
        return unitCardHTML(u, isP2, lineName, classes, false);
    }).join("");
}

function unitCardClasses(u, isP2, lineName, diff, node) {
    let cls = "unit-card";
    cls += ` type-${unitTypeKey(u.type)}`;
    cls += ` faction-${unitFactionKey(u)}`;
    if (isP2) cls += " p2-unit";
    if (u.current_hp <= 0) cls += " is-dead";

    // Diff-based states
    if (diff) {
        const uid = unitKey(u, lineName, isP2);
        if (diff.newUnits.has(uid)) cls += " is-new";
        if (diff.hpChanged.has(uid)) cls += " is-hp-changed";
        if (diff.destroyed.has(uid)) cls += " is-dead";
    }

    // Attack event source/target
    if (node && node.attack_event) {
        if (unitMatchesAttackRef(u, isP2, lineName, node.attack_event.attacker, getAttackerName(node.attack_event))) cls += " is-source";
        if (unitMatchesAttackRef(u, isP2, lineName, node.attack_event.defender, getDefenderName(node.attack_event))) cls += " is-target";
    }

    return cls;
}

function unitCardHTML(u, isP2, lineName, classes, showOwner) {
    const damaged = u.current_hp > 0 && u.current_hp < u.max_hp;
    const hpClass = u.current_hp <= 0 ? "damaged" : damaged ? "damaged" : "full";
    const kw = (u.keywords || []).filter(k => !k.startsWith("光环")).slice(0, 3).join("·");
    const ownerMarker = showOwner
        ? `<span class="owner-marker ${isP2 ? 'p2' : 'p1'}" aria-label="${isP2 ? '敌方' : '我方'}"></span>`
        : "";
    return `<div class="${classes}" data-unit-name="${esc(u.name)}"
                 data-unit-owner="${isP2 ? 'p2' : 'p1'}"
                 data-unit-line="${esc(lineName)}"
                 data-unit-slot="${u.slot}"
                 data-unit-uid="${esc(unitKey(u, lineName, isP2))}">
        ${ownerMarker}
        <div class="ucard-cost">${u.cost}</div>
        <div class="ucard-name" title="${esc(u.name)}">${esc(u.name)}</div>
        <div class="ucard-type">${esc(u.type)}</div>
        <div class="ucard-keywords">${esc(kw)}</div>
        <div class="ucard-stats">
            <span class="ucard-atk" aria-label="攻击力 ${u.attack}">${u.attack}</span>
            <span class="ucard-hp ${hpClass}" aria-label="生命 ${Math.max(0,u.current_hp)}/${u.max_hp}">${Math.max(0,u.current_hp)}/${u.max_hp}</span>
        </div>
    </div>`;
}

// ======================================================================
// Snapshot Diff
// ======================================================================
function computeDiff(prev, curr, node) {
    if (!prev) return null;
    const newUnits = new Set();
    const hpChanged = new Set();
    const destroyed = new Set();

    const prevKeys = collectUnitKeys(prev);
    const currKeys = collectUnitKeys(curr);

    // New units
    for (const k of currKeys.keys()) {
        if (!prevKeys.has(k)) newUnits.add(k);
    }

    // HP changes and destroyed
    for (const [k, currU] of currKeys) {
        const prevU = prevKeys.get(k);
        if (prevU) {
            if (currU.current_hp !== prevU.current_hp) {
                hpChanged.add(k);
            }
            if (currU.current_hp <= 0 && prevU.current_hp > 0) {
                destroyed.add(k);
            }
        }
    }

    return { newUnits, hpChanged, destroyed };
}

function collectUnitKeys(state) {
    const map = new Map();
    const addUnits = (units, lineName, isP2) => {
        for (const u of (units || [])) {
            const key = unitKey(u, lineName, isP2);
            map.set(key, u);
        }
    };
    addUnits(state.p1.rear, "后方线", false);
    addUnits(state.p1.main, "主力战列线", false);
    addUnits(state.p1.skirmish, "散兵线", false);
    addUnits(state.p2.rear, "后方线", true);
    addUnits(state.p2.main, "主力战列线", true);
    addUnits(state.p2.skirmish, "散兵线", true);
    return map;
}

function unitKey(u, lineName, isP2) {
    return u.uid || `${isP2 ? "P2" : "P1"}|${lineName}|${u.slot}|${u.name}`;
}

function unitMatchesAttackRef(u, isP2, lineName, ref, fallbackName) {
    if (!ref || ref.line === "hq") return false;
    const owner = isP2 ? "p2" : "p1";
    const refOwner = ref.owner ? String(ref.owner).toLowerCase() : "";
    if (refOwner && refOwner !== owner) return false;
    if (ref.line && ref.line !== lineName) return false;
    if (Number.isInteger(ref.slot) && ref.slot !== u.slot) return false;
    const refName = ref.name || fallbackName;
    return !refName || refName === u.name;
}

// ======================================================================
// Action Summary
// ======================================================================
function renderActionSummary(node) {
    const el = document.getElementById("action-summary");
    if (!el) return;

    const action = node.action || "";
    const ap = node.active_player;
    const activeName = node.active_name || "";
    const faction = ap === 0 ? MATCH_DATA.meta.p1_faction
                   : ap === 1 ? MATCH_DATA.meta.p2_faction : "";

    let html = `<span class="action-label ${esc(action)}">${esc(ACTION_LABELS[action] || action)}</span>`;

    if (action === "start") {
        html += `对局开始 · ${esc(MATCH_DATA.meta.p1_faction)} vs ${esc(MATCH_DATA.meta.p2_faction)} · 种子 ${MATCH_DATA.meta.seed}`;
    } else if (action === "deploy") {
        const info = parseDeployLog(node);
        html += `<strong>${esc(faction)}</strong>`;
        if (info.unit) html += ` 部署 <strong>${esc(info.unit)}</strong>`;
        if (info.line) html += ` 到 ${esc(info.line)}`;
        if (info.slot >= 0) html += ` 槽位${info.slot}`;
    } else if (action === "event") {
        const info = parseEventLog(node);
        html += `<strong>${esc(faction)}</strong>`;
        if (info.card) html += ` 打出事件 <strong>${esc(info.card)}</strong>`;
        if (info.effect) html += ` · ${esc(info.effect)}`;
    } else if (action === "advance") {
        const info = parseAdvanceLog(node);
        html += `<strong>${esc(faction)}</strong>`;
        if (info.unit) html += ` <strong>${esc(info.unit)}</strong>`;
        if (info.from && info.to) html += ` ${esc(info.from)} → ${esc(info.to)}`;
    } else if (action === "attack") {
        const ae = node.attack_event;
        if (ae) {
            html += `<strong>${esc(faction)}</strong> `;
            html += `<strong>${esc(getAttackerName(ae))}</strong>`;
            html += ` → <strong>${esc(getDefenderName(ae))}</strong>`;
            html += ` · 造成 ${ae.dmg_to_defender} 伤害`;
            if (ae.dmg_to_attacker > 0) html += ` · 受到 ${ae.dmg_to_attacker} 反击`;
            if (ae.defender_killed) html += " · <em>目标击杀</em>";
            if (ae.attacker_killed) html += " · <em>攻击方阵亡</em>";
        } else {
            html += `<strong>${esc(faction)}</strong> 发起攻击`;
        }
    } else if (action === "hq_attack") {
        const ae = node.attack_event;
        if (ae) {
            html += `<strong>${esc(faction)}</strong> `;
            html += `<strong>${esc(getAttackerName(ae))}</strong>`;
            html += ` 直击${esc(getHqTargetLabel(ap))} · 造成 ${ae.dmg_to_defender} 伤害`;
        } else {
            html += `<strong>${esc(faction)}</strong> 直击 HQ`;
        }
    } else {
        if (faction) html += `<strong>${esc(faction)}</strong>`;
    }

    el.innerHTML = html;
}

function parseDeployLog(node) {
    for (const line of (node.log || [])) {
        const m = line.match(/▶\s*\S+\s+部署\s+(\S+)\s+到\s+(\S+)\s+槽位(\d+)/);
        if (m) return { unit: m[1], line: m[2], slot: parseInt(m[3]) };
    }
    return { unit: null, line: null, slot: -1 };
}

function parseEventLog(node) {
    for (const line of (node.log || [])) {
        const m = line.match(/📜\s*\S+\s+打出事件卡【([^】]+)】→\s*(.+)/);
        if (m) return { card: m[1], effect: m[2] };
    }
    return { card: null, effect: null };
}

function parseAdvanceLog(node) {
    for (const line of (node.log || [])) {
        const m = line.match(/⇒\s*(\S+)\s+(\S+)→(\S+)\s+槽位(\d+)/);
        if (m) return { unit: m[1], from: m[2], to: m[3], slot: parseInt(m[4]) };
    }
    return { unit: null, from: null, to: null, slot: -1 };
}

// ======================================================================
// Attack Arrows
// ======================================================================
function drawAttackArrows(attackEvent, activePlayer) {
    const svg = document.getElementById("arrow-overlay");
    if (!svg) return;
    // Clear
    svg.querySelectorAll("line, text").forEach(el => el.remove());
    document.querySelectorAll(".attack-badge").forEach(el => el.remove());
    if (!attackEvent) return;

    const bf = document.getElementById("battlefield");
    if (!bf) return;
    const bfRect = bf.getBoundingClientRect();

    const atkEl = findUnitElementForAttack(attackEvent.attacker, getAttackerName(attackEvent));
    let defEl;
    if (attackEvent.defender && attackEvent.defender.line === "hq") {
        defEl = getHqTargetElement(activePlayer);
    } else {
        defEl = findUnitElementForAttack(attackEvent.defender, getDefenderName(attackEvent));
    }

    if (!atkEl || !defEl) return;

    const atkRect = atkEl.getBoundingClientRect();
    const defRect = defEl.getBoundingClientRect();

    const x1 = atkRect.left + atkRect.width / 2 - bfRect.left;
    const y1 = atkRect.top + atkRect.height / 2 - bfRect.top;
    const x2 = defRect.left + defRect.width / 2 - bfRect.left;
    const y2 = defRect.top + defRect.height / 2 - bfRect.top;

    // Arrow line
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1);
    line.setAttribute("y1", y1);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.classList.add("arrow-line");
    svg.appendChild(line);

    // Damage label at midpoint
    const midX = (x1 + x2) / 2;
    const midY = (y1 + y2) / 2;
    const dmgText = document.createElementNS("http://www.w3.org/2000/svg", "text");
    dmgText.setAttribute("x", midX);
    dmgText.setAttribute("y", midY - 10);
    dmgText.classList.add("arrow-damage");
    let dmgLabel = `-${attackEvent.dmg_to_defender}`;
    if (attackEvent.defender_killed) dmgLabel += " KILL";
    dmgText.textContent = dmgLabel;
    svg.appendChild(dmgText);

    // Defender HP badge
    if (attackEvent.defender_hp_after !== undefined && attackEvent.defender.line !== "hq") {
        const badge = document.createElement("div");
        badge.className = "attack-badge";
        const hpBefore = attackEvent.defender_hp_after + attackEvent.dmg_to_defender;
        badge.textContent = `HP: ${Math.max(0,attackEvent.defender_hp_after)}/${hpBefore}`;
        badge.style.left = (defRect.left - bfRect.left + defRect.width / 2 - 25) + "px";
        badge.style.top = (defRect.top - bfRect.top + defRect.height + 2) + "px";
        bf.appendChild(badge);
    }

    // Attacker damage badge
    if (attackEvent.dmg_to_attacker > 0 && attackEvent.attacker_hp_after !== undefined) {
        const badge = document.createElement("div");
        badge.className = "attack-badge";
        badge.style.background = "rgba(90,90,90,0.9)";
        const hpBefore = attackEvent.attacker_hp_after + attackEvent.dmg_to_attacker;
        badge.textContent = `HP: ${Math.max(0,attackEvent.attacker_hp_after)}/${hpBefore}`;
        badge.style.left = (atkRect.left - bfRect.left + atkRect.width / 2 - 25) + "px";
        badge.style.top = (atkRect.top - bfRect.top - 18) + "px";
        bf.appendChild(badge);
    }
}

function findUnitElementForAttack(ref, fallbackName) {
    if (!ref && !fallbackName) return null;
    const cards = document.querySelectorAll(".unit-card[data-unit-name]");
    for (const el of cards) {
        const ownerMatches = !ref?.owner || el.dataset.unitOwner === String(ref.owner).toLowerCase();
        const lineMatches = !ref?.line || el.dataset.unitLine === ref.line;
        const slotMatches = ref?.slot === undefined || Number(el.dataset.unitSlot) === ref.slot;
        const nameMatches = !fallbackName || el.dataset.unitName === fallbackName;
        if (ownerMatches && lineMatches && slotMatches && nameMatches) return el;
    }
    return null;
}

function getHqTargetElement(activePlayer) {
    if (activePlayer === 0) return document.getElementById("hq-enemy");
    if (activePlayer === 1) return document.getElementById("hq-player");
    return null;
}

function getHqTargetLabel(activePlayer) {
    if (activePlayer === 0) return "敌方 HQ";
    if (activePlayer === 1) return "我方 HQ";
    return "HQ";
}

function startingHqHp(playerKey) {
    if (MATCH_DATA?.meta?.starting_hq_hp) return MATCH_DATA.meta.starting_hq_hp;
    const firstState = MATCH_DATA?.timeline?.[0]?.state;
    if (playerKey === "p1") return firstState?.p1?.hq_hp ?? 14;
    return firstState?.p2?.hq_hp ?? 14;
}

// ======================================================================
// Result Banner
// ======================================================================
function renderResultBanner() {
    const banner = document.getElementById("result-banner");
    if (!banner) return;
    const isFinal = currentStep === MATCH_DATA.timeline.length - 1;
    banner.classList.toggle("visible", isFinal);
    if (isFinal) {
        const m = MATCH_DATA.meta;
        document.getElementById("result-title").textContent =
            `胜者：${m.winner_name}`;
        document.getElementById("result-detail").textContent =
            `${m.p1_faction} vs ${m.p2_faction} · 回合 ${m.final_turn} · ${m.end_reason} · 种子 ${m.seed}`;
    }
}

// ======================================================================
// Raw Log
// ======================================================================
function renderRawLog(node) {
    const content = document.getElementById("raw-log-content");
    if (!content) return;
    let html = `<div class="log-line">对局开始 · 种子 ${MATCH_DATA.meta.seed}</div>`;
    for (const line of (node.log || [])) {
        let cls = "log-line";
        if (line.includes("▶") || line.includes("部署")) cls += " log-deploy";
        else if (line.includes("⚔") || line.includes("💥")) cls += " log-attack";
        else if (line.includes("⚠") || line.includes("✨") || line.includes("⇒")) cls += " log-special";
        html += `<div class="${cls}">${esc(line)}</div>`;
    }
    content.innerHTML = html;
    content.scrollTop = content.scrollHeight;
}

function toggleRawLog() {
    rawLogVisible = !rawLogVisible;
    const area = document.getElementById("raw-log-area");
    const btn = document.getElementById("toggle-raw-log");
    if (area) area.classList.toggle("visible", rawLogVisible);
    if (btn) {
        btn.textContent = rawLogVisible ? "隐藏原始日志" : "显示原始日志";
        btn.setAttribute("aria-expanded", rawLogVisible);
    }
}

// ======================================================================
// History Highlight
// ======================================================================
function highlightHistoryRow() {
    const rows = document.querySelectorAll("#history-body tr");
    rows.forEach(row => {
        const stepIdx = parseInt(row.dataset.step, 10);
        row.classList.toggle("current-row", stepIdx === currentStep);
    });
    // Scroll current row into view
    const currentRow = document.querySelector("#history-body tr.current-row");
    if (currentRow) {
        currentRow.scrollIntoView({ block: "nearest", behavior: "auto" });
    }
}

// ======================================================================
// Navigation
// ======================================================================
function step(delta) {
    renderStep(currentStep + delta);
}

function goto(idx) {
    renderStep(idx);
}

function gotoPrevTurn() {
    const currentTurn = MATCH_DATA.timeline[currentStep].turn;
    for (let i = currentStep - 1; i >= 0; i--) {
        if (MATCH_DATA.timeline[i].turn < currentTurn) {
            // Go to first step of this turn
            const targetTurn = MATCH_DATA.timeline[i].turn;
            for (let j = i; j >= 0; j--) {
                if (MATCH_DATA.timeline[j].turn === targetTurn && (j === 0 || MATCH_DATA.timeline[j-1].turn < targetTurn)) {
                    goto(j);
                    return;
                }
            }
            goto(i);
            return;
        }
    }
    goto(0);
}

function gotoNextTurn() {
    const currentTurn = MATCH_DATA.timeline[currentStep].turn;
    for (let i = currentStep + 1; i < MATCH_DATA.timeline.length; i++) {
        if (MATCH_DATA.timeline[i].turn > currentTurn) {
            goto(i);
            return;
        }
    }
    goto(MATCH_DATA.timeline.length - 1);
}

function updateButtonStates() {
    const len = MATCH_DATA.timeline.length;
    setDisabled("btn-first", currentStep === 0);
    setDisabled("btn-prev", currentStep === 0);
    setDisabled("btn-next", currentStep >= len - 1);
    setDisabled("btn-last", currentStep >= len - 1);
    setDisabled("btn-prev-turn", currentStep === 0 || MATCH_DATA.timeline[currentStep].turn <= 0);
    setDisabled("btn-next-turn", currentStep >= len - 1);
}

// ======================================================================
// Autoplay
// ======================================================================
function togglePlay() {
    if (playInterval) {
        stopAutoplay();
    } else {
        if (currentStep >= MATCH_DATA.timeline.length - 1) goto(0);
        startAutoplay();
    }
}

function startAutoplay() {
    const btn = document.getElementById("btn-play");
    if (btn) { btn.textContent = "⏸"; btn.setAttribute("aria-label", "暂停"); }
    const interval = BASE_INTERVAL / playSpeed;
    playInterval = setInterval(() => {
        if (currentStep >= MATCH_DATA.timeline.length - 1) {
            stopAutoplay();
            return;
        }
        step(1);
    }, interval);
}

function stopAutoplay() {
    if (playInterval) {
        clearInterval(playInterval);
        playInterval = null;
    }
    const btn = document.getElementById("btn-play");
    if (btn) { btn.textContent = "▶"; btn.setAttribute("aria-label", "播放"); }
}

// ======================================================================
// Keyboard
// ======================================================================
function handleKeydown(e) {
    // Ignore if focus is in a select or input
    if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;

    switch (e.key) {
        case "ArrowLeft":
            e.preventDefault();
            step(-1);
            break;
        case "ArrowRight":
            e.preventDefault();
            step(1);
            break;
        case " ":
            e.preventDefault();
            togglePlay();
            break;
        case "Home":
            e.preventDefault();
            goto(0);
            break;
        case "End":
            e.preventDefault();
            goto(MATCH_DATA.timeline.length - 1);
            break;
    }
}

// ======================================================================
// Helpers
// ======================================================================
function setText(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
}

function setDisabled(id, disabled) {
    const el = document.getElementById(id);
    if (el) el.disabled = disabled;
}

function esc(s) {
    if (s == null) return "";
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function escapeHtml(s) { return esc(s); }

function factionClass(faction) {
    if (faction === "法兰西") return "france";
    if (faction === "普鲁士") return "prussia";
    if (faction === "俄罗斯") return "russia";
    return "france";
}

function factionShort(faction) {
    if (faction === "法兰西") return "法兰西";
    if (faction === "普鲁士") return "普鲁士";
    if (faction === "俄罗斯") return "俄罗斯";
    return faction || "";
}

function unitTypeKey(type) {
    if (type === "线列步兵") return "infantry";
    if (type === "散兵") return "skirmisher";
    if (type === "骑兵") return "cavalry";
    if (type === "炮兵") return "artillery";
    if (type === "近卫") return "guard";
    return "infantry";
}

function unitFactionKey(u) {
    const n = u.name || "";
    if (n.includes('俄') || n.includes('哥萨克') || n.includes('库图') || n.includes('巴格') ||
        n.includes('普拉') || n.includes('独角') || n.includes('莫斯科') || n.includes('帝国大军') ||
        n.includes('东正') || n.includes('西伯') || n.includes('猎兵团') || n.includes('俄国')) {
        return "russia";
    }
    if (n.includes('普鲁') || n.includes('耶格') || n.includes('黑色') || n.includes('死骑') ||
        n.includes('布吕') || n.includes('西里')) {
        return "prussia";
    }
    return "france";
}
