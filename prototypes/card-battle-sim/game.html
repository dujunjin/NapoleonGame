<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拿破仑战争 — 可玩 Demo</title>
<style>
:root{--void:#0a0c14;--abyss:#0f1220;--slate:#1a1f35;--brass:#c9a84c;--brass-glow:#e0c060;--blood:#8b1a1a;--blood-bright:#c23030;--smoke:#4a4a5a;--smoke-lt:#6a6a7a;--frost:#5a7a9a;--forest:#2a5a3a;--flame:#e06030;--f-france:#4a6fa5;--f-prussia:#6a6a6a;--f-russia:#3a6a4a;--paper:#f0e8d0;--paper-d:#d8c8a0;--r:4px;--rl:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Hiragino Sans","PingFang SC",sans-serif;background:var(--void);color:#e0dde8;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(201,168,76,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(201,168,76,.03) 1px,transparent 1px);background-size:60px 60px}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 20% 10%,rgba(201,168,76,.06) 0%,transparent 50%),radial-gradient(ellipse at 50% 50%,transparent 30%,rgba(0,0,0,.4) 100%)}

/* Faction Select */
#sel{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:30px}
#sel h1{font-family:"Georgia","Noto Serif SC",serif;font-size:28px;letter-spacing:8px;color:var(--brass);text-shadow:0 0 20px rgba(201,168,76,.3)}
#sel .sub{color:var(--smoke-lt);font-size:14px;letter-spacing:2px}
.fc{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.fcard{width:200px;padding:24px;background:rgba(26,31,53,.8);border:1px solid rgba(201,168,76,.15);border-radius:var(--rl);cursor:pointer;text-align:center;transition:all .2s}
.fcard:hover{border-color:var(--brass);transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.fcard .ic{font-size:40px;margin-bottom:12px}
.fcard .nm{font-family:"Georgia",serif;font-size:18px;color:var(--brass);letter-spacing:2px;margin-bottom:8px}
.fcard .ds{font-size:12px;color:var(--smoke-lt);line-height:1.5}

/* Game Screen */
#gs{display:none;position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:8px 12px 200px}
.gt{text-align:center;padding:10px;margin-bottom:8px;font-family:"Georgia",serif;font-size:16px;letter-spacing:4px;color:var(--brass);border-bottom:1px solid rgba(201,168,76,.1)}
.ib{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;margin-bottom:8px;background:rgba(26,31,53,.8);border:1px solid rgba(201,168,76,.1);border-radius:var(--r);font-size:12px}
.ib .ph{color:var(--brass);font-weight:bold}.ib .st{color:var(--smoke-lt)}.ib .st b{color:var(--brass)}

/* HQ */
.hq{display:flex;align-items:center;gap:12px;padding:8px 14px;background:rgba(0,0,0,.3);border-radius:var(--r);border:1px solid rgba(201,168,76,.1);margin-bottom:6px}
.hq-l{font-family:"Georgia",serif;font-size:13px;color:var(--smoke-lt);min-width:70px}
.hq-bar{flex:1;max-width:180px;height:14px;background:rgba(0,0,0,.4);border-radius:7px;overflow:hidden;border:1px solid rgba(201,168,76,.1)}
.hq-fill{height:100%;background:linear-gradient(90deg,var(--blood),var(--blood-bright));border-radius:7px;transition:width .5s}
.hq-fill.crit{animation:hpulse 1s ease-in-out infinite}
@keyframes hpulse{0%,100%{opacity:1}50%{opacity:.5}}
.hq-txt{font-family:monospace;font-size:14px;font-weight:bold;color:var(--blood-bright)}
.hq.hit{animation:hqhit .5s ease-out}
@keyframes hqhit{0%{transform:translateX(0)}10%{transform:translateX(-4px)}20%{transform:translateX(4px)}30%{transform:translateX(-3px)}100%{transform:translateX(0)}}

/* Battlefield */
.bfl{display:flex;flex-direction:column;gap:3px}
.bl{display:flex;align-items:stretch;background:rgba(0,0,0,.2);border:1px solid rgba(201,168,76,.08);border-radius:var(--r);min-height:72px;overflow:hidden}
.bl.sk{background:linear-gradient(to bottom,rgba(201,168,76,.06),rgba(201,168,76,.02));border:1px solid rgba(201,168,76,.2)}
.bd{text-align:center;color:var(--brass);font-size:9px;letter-spacing:4px;padding:1px 0;font-family:"Georgia",serif;opacity:.5}
.ll{writing-mode:vertical-rl;width:22px;min-width:22px;display:flex;align-items:center;justify-content:center;color:var(--smoke);font-size:10px;letter-spacing:2px;border-right:1px solid rgba(201,168,76,.08);background:rgba(0,0,0,.1);flex-shrink:0;font-family:"Georgia",serif}
.ur{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;align-items:center}
.sl{border:1px dashed rgba(201,168,76,.08);border-radius:var(--r);background:rgba(0,0,0,.06);min-height:62px;cursor:default;transition:all .2s;position:relative}
.sl.clk{cursor:pointer;border-color:var(--brass)}.sl.clk:hover{background:rgba(201,168,76,.1)}
.sl.tgt{border-color:var(--blood-bright);background:rgba(194,48,48,.1);cursor:crosshair;animation:tp .8s ease-in-out infinite}
@keyframes tp{0%,100%{box-shadow:none}50%{box-shadow:0 0 8px rgba(194,48,48,.4)}}

/* Unit Card */
.uc{background:linear-gradient(135deg,var(--paper),var(--paper-d));border:2px solid rgba(42,42,42,.5);border-radius:var(--r);color:#2a2a2a;padding:3px;font-size:10px;position:relative;transition:all .2s}
.uc.fr{border-color:var(--f-france)}.uc.pr{border-color:var(--f-prussia)}.uc.ru{border-color:var(--f-russia)}
.uc.t-骑兵{background:linear-gradient(135deg,#f2d5d1,#d08070)}.uc.t-炮兵{background:linear-gradient(135deg,#ece1be,#c8aa58)}.uc.t-散兵{background:linear-gradient(135deg,#dff0cf,#a0c878)}.uc.t-近卫{background:linear-gradient(135deg,#eadcf4,#b088cc)}
.uc.act{box-shadow:0 0 6px rgba(201,168,76,.4);cursor:pointer}.uc.act:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.uc.sel{box-shadow:0 0 12px rgba(201,168,76,.7);border-color:var(--brass)!important}
.uc.dead{opacity:.3;filter:grayscale(.8);border-style:dashed}
.uc.shk{box-shadow:0 0 6px rgba(201,168,76,.5)}
.uc.adv{box-shadow:0 0 8px rgba(90,122,154,.5);cursor:pointer;border-color:var(--frost)!important}
.uc.adv:hover{transform:translateY(-2px)}
.uct{position:absolute;top:-4px;left:-4px;width:18px;height:18px;background:var(--blood);color:#fff;border:2px solid #2a2a2a;border-radius:50%;text-align:center;line-height:14px;font-weight:bold;font-size:10px;z-index:1}
.ucn{font-weight:bold;font-size:9px;text-align:center;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px solid rgba(0,0,0,.1);padding-bottom:1px}
.ucty{font-size:8px;color:#5a5a5a;text-align:center}
.ucs{display:flex;justify-content:space-between;border-top:1px solid rgba(0,0,0,.1);padding-top:1px;font-weight:bold}
.uca{color:var(--blood);font-size:11px}
.uchp{font-size:11px}.uchp.d{color:var(--blood)}.uchp.ok{color:var(--forest)}
.uc-sh{position:absolute;top:16px;right:1px;font-size:7px;font-weight:bold;background:rgba(74,58,31,.88);color:var(--brass-glow);border:1px solid var(--brass);border-radius:2px;padding:0 2px}
.uc-ev{position:absolute;bottom:1px;right:1px;font-size:7px;color:var(--smoke)}

/* Floating damage */
.fdmg{position:absolute;font-family:"Georgia",serif;font-size:16px;font-weight:bold;color:#e04040;text-shadow:0 0 6px rgba(0,0,0,.8);pointer-events:none;z-index:30;animation:fup 1s ease-out forwards}
@keyframes fup{0%{opacity:1;transform:translateY(0) scale(1.3)}100%{opacity:0;transform:translateY(-30px) scale(.8)}}

/* Hand */
.ha{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px 12px;z-index:40;background:linear-gradient(180deg,rgba(10,12,20,.9),rgba(10,12,20,.98));border:1px solid rgba(201,168,76,.15);border-radius:var(--rl);backdrop-filter:blur(8px);max-width:90vw;overflow-x:auto}
.hc{min-width:100px;max-width:120px;padding:6px;cursor:pointer;background:linear-gradient(135deg,var(--paper),var(--paper-d));border:2px solid rgba(42,42,42,.5);border-radius:var(--r);color:#2a2a2a;font-size:10px;transition:all .2s;flex-shrink:0;position:relative}
.hc:hover{transform:translateY(-8px);box-shadow:0 8px 20px rgba(0,0,0,.5);border-color:var(--brass)}.hc.sel{border-color:var(--brass);box-shadow:0 0 12px rgba(201,168,76,.6);transform:translateY(-12px)}.hc.no{opacity:.4;cursor:not-allowed}
.hc.ev{background:linear-gradient(135deg,#d0e8d0,#a0c8a0)}
.hcn{font-weight:bold;font-size:10px;text-align:center;border-bottom:1px solid rgba(0,0,0,.1);padding-bottom:2px;margin-bottom:2px}
.hci{font-size:9px;color:#5a5a5a;text-align:center}
.hcs{display:flex;justify-content:space-between;font-weight:bold;margin-top:2px;border-top:1px solid rgba(0,0,0,.1);padding-top:2px}
.hcc{position:absolute;top:-4px;left:-4px;width:16px;height:16px;background:var(--blood);color:#fff;border:2px solid #2a2a2a;border-radius:50%;text-align:center;line-height:12px;font-size:9px}

/* Action Bar */
.abar{position:fixed;bottom:0;left:0;right:0;z-index:50;background:linear-gradient(180deg,rgba(10,12,20,.85),rgba(10,12,20,.98));border-top:1px solid rgba(201,168,76,.15);padding:8px 16px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(8px)}
.abar .mw{max-width:1000px;margin:0 auto;width:100%;display:flex;align-items:center;gap:12px}
.btn{background:rgba(26,31,53,.8);color:#c0bdc8;border:1px solid rgba(201,168,76,.12);padding:6px 14px;cursor:pointer;font-family:inherit;font-size:12px;border-radius:var(--r);transition:all .15s;white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(201,168,76,.12);border-color:var(--brass);color:var(--brass)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn.pr{background:linear-gradient(135deg,var(--blood),#6b1515);border-color:var(--blood-bright);color:#fff}
.btn.pr:hover:not(:disabled){background:linear-gradient(135deg,var(--blood-bright),var(--blood))}
.phi{font-family:"Georgia",serif;font-size:13px;color:var(--brass);letter-spacing:1px;min-width:80px}
.ahi{font-size:11px;color:var(--smoke-lt);flex:1}

/* Log */
.lp{position:fixed;top:8px;right:8px;width:280px;max-height:300px;overflow-y:auto;padding:8px;z-index:30;background:rgba(15,18,32,.9);border:1px solid rgba(201,168,76,.1);border-radius:var(--r);font-size:10px;font-family:monospace;color:var(--smoke-lt);line-height:1.5}
.lp .ll{margin:1px 0}.lp .la{color:var(--blood-bright)}.lp .ld{color:var(--brass)}.lp .lh{color:var(--forest-lt)}

/* Result */
.ro{display:none;position:fixed;inset:0;z-index:60;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
.ro.vis{display:flex}
.rc{background:linear-gradient(135deg,rgba(26,31,53,.95),rgba(42,37,32,.95));border:2px solid var(--brass);border-radius:var(--rl);padding:40px 60px;text-align:center;box-shadow:0 0 60px rgba(201,168,76,.3)}
.rc .ri{font-size:48px;margin-bottom:12px}.rc .rt{font-family:"Georgia",serif;font-size:24px;color:var(--brass-glow);letter-spacing:4px}.rc .rd{font-size:13px;color:var(--smoke-lt);margin-top:8px}.rc .rb{margin-top:20px}

.sk-shake{animation:sk .4s ease-out}
@keyframes sk{0%{transform:translate(0,0)}10%{transform:translate(-4px,-2px)}20%{transform:translate(4px,2px)}30%{transform:translate(-3px,1px)}40%{transform:translate(3px,-1px)}50%{transform:translate(-2px,2px)}60%{transform:translate(2px,-1px)}100%{transform:translate(0,0)}}

@media(max-width:700px){.ha{gap:4px;padding:6px 8px}.hc{min-width:80px;max-width:95px;font-size:9px}.lp{display:none}.ib{font-size:10px;flex-wrap:wrap;gap:4px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--void)}::-webkit-scrollbar-thumb{background:var(--slate-lt);border-radius:2px}
</style>
</head>
<body>
<div id="sel">
<h1>拿 破 仑 战 争</h1>
<div class="sub">选择你的阵营</div>
<div class="fc">
<div class="fcard" style="border-color:var(--f-france)" onclick="startGame('法兰西')"><div class="ic">⚜</div><div class="nm">法兰西</div><div class="ds">高攻击力 · 纵队冲锋 · 近卫精锐 · 军团联动</div></div>
<div class="fcard" style="border-color:var(--f-prussia)" onclick="startGame('普鲁士')"><div class="ic">🦅</div><div class="nm">普鲁士</div><div class="ds">死神威慑 · 国防动员 · 改良线列 · 纪律阵型</div></div>
<div class="fcard" style="border-color:var(--f-russia)" onclick="startGame('俄罗斯')"><div class="ic">☦</div><div class="nm">俄罗斯</div><div class="ds">低费铺场 · 自残换光环 · 肉盾耐打 · 消耗战</div></div>
</div>
</div>

<div id="gs">
<div class="gt">拿 破 仑 战 争</div>
<div class="ib"><span class="ph" id="ph">准备中</span><span class="st">回合 <b id="tn">1</b></span><span class="st">军令 <b id="od">0/0</b></span><span class="st">手牌 <b id="hcnt">0</b></span><span class="st">牌库 <b id="dcnt">0</b></span></div>
<div class="hq" id="hq-e" style="border-left:3px solid var(--f-russia)"><span class="hq-l" id="el">敌方指挥部</span><div class="hq-bar"><div class="hq-fill" id="ef" style="width:100%"></div></div><span class="hq-txt" id="et">14/14</span></div>
<div class="bfl" id="bfl" style="position:relative">
<div class="bl" id="l-er"><div class="ll">敌后方</div><div class="ur" id="r-er"></div></div>
<div class="bd">— 敌 主 力 —</div>
<div class="bl" id="l-em"><div class="ll">敌主力</div><div class="ur" id="r-em"></div></div>

<div class="bl sk" id="l-sk"><div class="ll">散兵线</div><div class="ur" id="r-sk"></div></div>
<div class="bd">— 我 主 力 —</div>
<div class="bl" id="l-pm"><div class="ll">我主力</div><div class="ur" id="r-pm"></div></div>
<div class="bl" id="l-pr"><div class="ll">我后方</div><div class="ur" id="r-pr"></div></div>
</div>
<div class="hq" id="hq-p" style="border-left:3px solid var(--f-france)"><span class="hq-l" id="pl">我方指挥部</span><div class="hq-bar"><div class="hq-fill" id="pf" style="width:100%"></div></div><span class="hq-txt" id="pt">14/14</span></div>
</div>

<div class="ha" id="ha" style="display:none"></div>
<div class="abar" id="abar" style="display:none"><div class="mw"><span class="phi" id="phi">—</span><span class="ahi" id="ahi"></span><button class="btn" id="ba" style="display:none"></button><button class="btn pr" id="be" onclick="endTurn()">结束回合</button></div></div>
<div class="lp" id="lp"></div>
<div class="ro" id="ro"><div class="rc"><div class="ri" id="ri">⚜</div><div class="rt" id="rt">胜利</div><div class="rd" id="rd"></div><div class="rb"><button class="btn pr" onclick="location.reload()">再来一局</button></div></div></div>

const DECKS={"法兰西":deckFrance,"普鲁士":deckPrussia,"俄罗斯":deckRussia};
const HQ_HP=14,MAX_ORD=16,MAX_HAND=7;

// ========== STATE ==========
let G=null,selHand=null,selAtk=null,advMode=false;

function mkUnit(card,line,slot){return{card,hp:card.health,line,slot,acted:false,deployed:true,evaded:false,shaken:false,id:Math.random().toString(36).slice(2,8)}}
function mkPlayer(name,faction){const d=DECKS[faction]();shuffle(d);return{name,faction,deck:d,hand:[],discard:[],hqHp:HQ_HP,maxOrd:0,curOrd:0}}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}

function init(pf){
    const ef=pf==="法兰西"?"俄罗斯":pf==="普鲁士"?"法兰西":"普鲁士";
    const p=mkPlayer("玩家",pf),e=mkPlayer("AI",ef);
    for(let i=0;i<4;i++)if(p.deck.length)p.hand.push(p.deck.shift());
    for(let i=0;i<5;i++)if(e.deck.length)e.hand.push(e.deck.shift());
    return{p,e,bf:{pR:[],pM:[],pS:[],eS:[],eM:[],eR:[]},turn:1,phase:"draw",log:[],over:false}
}

// ========== HELPERS ==========
function isP(u){return G.bf.pR.includes(u)||G.bf.pM.includes(u)||G.bf.pS.includes(u)}
function allU(isP){const b=G.bf;return isP?[...b.pR,...b.pM,...b.pS]:[...b.eR,...b.eM,...b.eS]}
function getL(line,isP){const b=G.bf;if(isP)return line==="rear"?b.pR:line==="main"?b.pM:b.pS;return line==="rear"?b.eR:line==="main"?b.eM:b.eS}
function fkey(f){return f==="法兰西"?"fr":f==="普鲁士"?"pr":"ru"}
function esc(s){return s==null?"":String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function dead(u){return u.hp<=0}

// ========== COMBAT ==========
function effAtk(u,bf,isPl){
    let a=u.card.attack;
    const own=isPl?bf.pM.concat(bf.pR):bf.eM.concat(bf.eR);
    if(u.card.unitType===UT.CAV){for(const f of own){if(f.slot===u.slot&&f.card.unitType===UT.ART&&f.card.keywords.includes("军团联动")){a+=1;break}}}
    const en=isPl?[...bf.eR,...bf.eM,...bf.eS]:[...bf.pR,...bf.pM,...bf.pS];
    for(const e of en){if(e.slot===u.slot&&e.card.keywords.includes("死神威慑"))a=Math.max(0,a-1)}
    if(u.shaken)a=Math.max(0,a-1);
    return a
}

function calcDmg(atk,def){
    const ac=atk.card,dc=def.card;
    if(dc.keywords.includes("闪避")&&!def.evaded&&ac.unitType!==UT.ART){def.evaded=true;return{d:0,c:0,ev:true}}
    let d=effAtk(atk,G.bf,isP(atk));
    const dAtk=effAtk(def,G.bf,isP(def));
    if(ac.unitType===UT.CAV&&(dc.unitType===UT.INF||dc.unitType===UT.GRD)){
        if(dc.keywords.includes("结阵")&&!ac.keywords.includes("突破"))d=Math.max(1,Math.floor(d/2));
        else if(!dc.keywords.includes("结阵"))d=d*2;
    }
    if(ac.unitType===UT.ART&&(dc.unitType===UT.INF||dc.unitType===UT.GRD))d=dc.keywords.includes("结阵")?d+2:d+1;
    if(ac.keywords.includes("齐射")&&!atk.acted)d+=1;
    if(dc.unitType===UT.ART)c=Math.floor(dAtk/2);else if(ac.unitType===UT.ART&&ac.keywords.includes("远程"))c=0;else c=dAtk;
    return{d:Math.max(0,d),c:Math.max(0,c),ev:false}
}

function findTgt(atk){
    const isPl=isP(atk);
    const oR=isPl?G.bf.eR:G.bf.pR,oM=isPl?G.bf.eM:G.bf.pM,oS=isPl?G.bf.eS:G.bf.pS;
    const guards=oM.filter(u=>!dead(u)&&u.card.keywords.includes("守卫"));
    if(guards.length)return guards;
    if(atk.line==="rear"&&atk.card.keywords.includes("远程")&&atk.card.unitType===UT.ART)return[...oS,...oM].filter(u=>!dead(u));
    if(atk.card.keywords.includes("侧翼迂回")&&atk.card.unitType===UT.CAV&&atk.line!=="rear")return[...oS,...oM,...oR].filter(u=>!dead(u));
    if(atk.line==="rear")return[];
    return[...oS,...oM].filter(u=>!dead(u))
}

function canHQ(atk){
    const isPl=isP(atk);
    const oM=isPl?G.bf.eM:G.bf.pM,oS=isPl?G.bf.eS:G.bf.pS;
    if(oM.some(u=>!dead(u))||oS.some(u=>!dead(u)))return false;
    if(atk.line==="rear"&&atk.card.keywords.includes("远程"))return true;
    if(atk.line==="skirmish")return true;
    return false
}

// ========== SHAKEN ==========
function maybeShake(u,dmg){if(dead(u)||u.shaken||dmg<2)return;if(u.hp*2>u.card.health)return;u.shaken=true;log("  ⚑ "+u.card.name+" 动摇")}

function cleanDead(){const b=G.bf;b.pR=b.pR.filter(u=>!dead(u));b.pM=b.pM.filter(u=>!dead(u));b.pS=b.pS.filter(u=>!dead(u));b.eR=b.eR.filter(u=>!dead(u));b.eM=b.eM.filter(u=>!dead(u));b.eS=b.eS.filter(u=>!dead(u))}

// ========== LOG ==========
function log(msg,type){
    G.log.push(msg);
    const p=document.getElementById("lp");
    const cls=type==="atk"?"la":type==="dep"?"ld":type==="heal"?"lh":"";
    p.innerHTML+=`<div class="ll ${cls}">${esc(msg)}</div>`;
    p.scrollTop=p.scrollHeight
}

// ========== TURN FLOW ==========
function startPTurn(){
    G.phase="deploy";const p=G.p;
    p.maxOrd=Math.min(p.maxOrd+1,MAX_ORD);p.curOrd=p.maxOrd;
    for(const u of allU(true)){u.acted=false;u.deployed=false}
    for(let i=0;i<2;i++)if(p.deck.length&&p.hand.length<MAX_HAND)p.hand.push(p.deck.shift());
    for(const u of allU(true))if(u.shaken)u.shaken=false;
    selHand=null;selAtk=null;advMode=false;
    log("\n=== 回合 "+G.turn+"：玩家行动 ===");
    log("军令: "+p.curOrd+"/"+p.maxOrd+"  手牌: "+p.hand.length);
    render()
}

function endTurn(){
    if(G.over)return;selHand=null;selAtk=null;advMode=false;
    G.phase="enemy";render();
    setTimeout(doEnemy,400)
}

function checkWin(){
    if(G.p.hqHp<=0&&G.e.hqHp<=0){showResult("draw");return true}
    if(G.e.hqHp<=0){showResult("win");return true}
    if(G.p.hqHp<=0){showResult("lose");return true}
    return false
}
function showResult(t){
    G.over=true;
    document.getElementById("ri").textContent=t==="win"?"⚜":t==="lose"?"💀":"⚔";
    document.getElementById("rt").textContent=t==="win"?"胜利！":t==="lose"?"战败...":"平局";
    document.getElementById("rd").textContent="回合 "+G.turn+" · 玩家HQ "+Math.max(0,G.p.hqHp)+" · AIHQ "+Math.max(0,G.e.hqHp);
    document.getElementById("ro").classList.add("vis")
}

// ========== PLAYER ACTIONS ==========
function selHC(i){
    if(G.phase!=="deploy"||G.over)return;
    const c=G.p.hand[i];if(!c)return;
    selHand=selHand===i?null:i;selAtk=null;render()
}

function clickSl(line,slot){
    if(G.over)return;
    if(G.phase==="deploy"&&selHand!==null)doDeploy(line,slot);
    else if(G.phase==="attack"&&selAtk!==null)doAttack(line,slot)
}

function doDeploy(line,slot){
    const c=G.p.hand[selHand];if(!c)return;
    if(c.cardType!=="unit")return;
    if(line!=="rear")return;
    if(G.p.curOrd<c.cost)return;
    if(G.bf.pR.some(u=>u.slot===slot))return;
    const u=mkUnit(c,"rear",slot);G.bf.pR.push(u);
    G.p.curOrd-=c.cost;G.p.hand.splice(selHand,1);
    for(const kw of c.keywords){const m=kw.match(/^自残(\d+)$/);if(m){G.p.hqHp-=+m[1];log("  💥 "+c.name+" 自损HQ"+m[1])}}
    if(c.keywords.includes("光环+1攻")){for(const x of allU(true))if(x!==u)x.card={...x.card,attack:x.card.attack+1};log("  ✨ "+c.name+"：全场友军+1攻")}
    if(c.keywords.includes("光环+1血")){for(const x of allU(true))if(x!==u){x.card={...x.card,health:x.card.health+1};x.hp++}log("  ✨ "+c.name+"：全场友军+1血")}
    log("  ▶ 部署 "+c.name+" 到后方 槽位"+(slot+1)+"（-"+c.cost+"军令）","dep");
    selHand=null;if(checkWin())return;render()
}

function clickAdv(u){
    if(G.phase!=="advance"||G.over)return;
    if(!isP(u)||dead(u)||u.shaken||u.deployed)return;
    if(G.p.curOrd<1)return;
    if(u.line==="rear"){
        const used=new Set(G.bf.pM.map(x=>x.slot));let s=-1;
        for(let i=0;i<4;i++)if(!used.has(i)){s=i;break}
        if(s<0)return;
        G.bf.pR.splice(G.bf.pR.indexOf(u),1);u.line="main";u.slot=s;u.acted=true;G.bf.pM.push(u);G.p.curOrd--;
        log("  ⇒ "+u.card.name+" 后方→主力 槽位"+(s+1)+"（-1军令）")
    }else if(u.line==="main"){
        const used=new Set(G.bf.eS.map(x=>x.slot).concat(G.bf.pS.map(x=>x.slot)));let s=-1;
        for(let i=0;i<4;i++)if(!used.has(i)){s=i;break}
        if(s<0)return;
        G.bf.pM.splice(G.bf.pM.indexOf(u),1);u.line="skirmish";u.slot=s;u.acted=true;G.bf.pS.push(u);G.p.curOrd--;
        log("  ⇒ "+u.card.name+" 主力→散兵 槽位"+(s+1)+"（-1军令）")
    }
    render()
}

function selAtkU(u){
    if(G.phase!=="attack"||G.over)return;
    if(!isP(u)||u.acted||dead(u)||u.shaken)return;
    if(u.deployed&&!u.card.keywords.includes("冲锋"))return;
    if(u.line==="rear"&&!u.card.keywords.includes("远程"))return;
    selAtk=selAtk===u?null:u;render()
}

function doAttack(line,slot){
    if(!selAtk)return;
    const isPl=isP(selAtk);
    // HQ attack
    if(line==="hq-e"&&isPl&&canHQ(selAtk)){atkHQ(selAtk,false);return}
    if(line==="hq-p"&&!isPl&&canHQ(selAtk)){atkHQ(selAtk,true);return}
    // Unit attack
    const lineArr=getL(line.replace("e-","").replace("p-",""),!isPl);
    const def=lineArr.find(u=>u.slot===slot&&!dead(u));
    if(!def)return;
    const tgts=findTgt(selAtk);
    if(!tgts.includes(def))return;
    execAtk(selAtk,def)
}

function atkHQ(atk,vsPlayer){
    const d=effAtk(atk,G.bf,isP(atk));
    if(vsPlayer)G.p.hqHp-=d;else G.e.hqHp-=d;
    atk.acted=true;selAtk=null;
    log("  💥 "+atk.card.name+" 直击"+(vsPlayer?"玩家":"AI")+"HQ · "+d+"伤害","atk");
    shake();if(checkWin())return;render()
}

function execAtk(atk,def){
    const r=calcDmg(atk,def);
    if(r.ev){log("  ⚡ "+def.card.name+" 闪避了 "+atk.card.name+" 的攻击");atk.acted=true;selAtk=null;render();return}
    def.hp-=r.d;atk.hp-=r.c;atk.acted=true;
    maybeShake(def,r.d);maybeShake(atk,r.c);
    let smash=0;
    if(atk.card.keywords.includes("突破")&&def.hp<=0){smash=Math.abs(def.hp);if(smash>0){if(isP(atk))G.e.hqHp-=smash;else G.p.hqHp-=smash}}
    cleanDead();
    let msg="  ⚔ "+atk.card.name+" → "+def.card.name+" · "+r.d+"伤害";
    if(r.c>0)msg+=" · 反击"+r.c;if(dead(def))msg+=" · 💀击杀";if(smash>0)msg+=" · 突破"+smash+"打HQ";
    log(msg,"atk");selAtk=null;shake();if(checkWin())return;render()
}

function shake(){const b=document.getElementById("bfl");b.classList.remove("sk-shake");void b.offsetWidth;b.classList.add("sk-shake")}

// ========== AI ==========
function doEnemy(){
    const e=G.e;e.maxOrd=Math.min(e.maxOrd+1,MAX_ORD);e.curOrd=e.maxOrd;
    for(const u of allU(false)){u.acted=false;u.deployed=false}
    for(let i=0;i<2;i++)if(e.deck.length&&e.hand.length<MAX_HAND)e.hand.push(e.deck.shift());
    for(const u of allU(false))if(u.shaken)u.shaken=false;
    log("\n=== 回合 "+G.turn+"：AI行动 ===");
    render();
    aiDeploy(()=>aiAdvance(()=>aiAttack(()=>{
        if(checkWin())return;G.turn++;startPTurn()
    })))
}

function aiDeploy(cb){
    const e=G.e;const hand=[...e.hand].sort((a,b)=>a.cost-b.cost);
    for(const c of hand){
        if(c.cardType!=="unit"||c.cost>e.curOrd)continue;
        const used=new Set(G.bf.eR.map(u=>u.slot));let s=-1;
        for(let i=0;i<4;i++)if(!used.has(i)){s=i;break}
        if(s<0)continue;
        const u=mkUnit(c,"rear",s);G.bf.eR.push(u);e.curOrd-=c.cost;e.hand.splice(e.hand.indexOf(c),1);
        for(const kw of c.keywords){const m=kw.match(/^自残(\d+)$/);if(m)e.hqHp-=+m[1]}
        if(c.keywords.includes("光环+1攻")){for(const x of allU(false))if(x!==u)x.card={...x.card,attack:x.card.attack+1}}
        if(c.keywords.includes("光环+1血")){for(const x of allU(false))if(x!==u){x.card={...x.card,health:x.card.health+1};x.hp++}}
        log("  ▶ AI部署 "+c.name+" 到后方 槽位"+(s+1),"dep")
    }
    setTimeout(()=>{render();cb()},200)
}

function aiAdvance(cb){
    for(const u of[...G.bf.eR]){
        if(u.shaken||G.e.curOrd<1)continue;
        const used=new Set(G.bf.eM.map(x=>x.slot));let s=-1;
        for(let i=0;i<4;i++)if(!used.has(i)){s=i;break}
        if(s<0)continue;
        G.bf.eR.splice(G.bf.eR.indexOf(u),1);u.line="main";u.slot=s;u.acted=true;G.bf.eM.push(u);G.e.curOrd--;
        log("  ⇒ AI "+u.card.name+" 后方→主力 槽位"+(s+1),"dep")
    }
    for(const u of[...G.bf.eM]){
        if(u.shaken||u.deployed||G.e.curOrd<1)continue;
        const used=new Set(G.bf.eS.map(x=>x.slot).concat(G.bf.pS.map(x=>x.slot)));let s=-1;
        for(let i=0;i<4;i++)if(!used.has(i)){s=i;break}
        if(s<0)continue;
        G.bf.eM.splice(G.bf.eM.indexOf(u),1);u.line="skirmish";u.slot=s;u.acted=true;G.bf.eS.push(u);G.e.curOrd--;
        log("  ⇒ AI "+u.card.name+" 主力→散兵 槽位"+(s+1),"dep")
    }
    setTimeout(()=>{render();cb()},300)
}

function aiAttack(cb){
    const atks=allU(false).filter(u=>{
        if(u.acted||dead(u)||u.shaken)return false;
        if(u.deployed&&!u.card.keywords.includes("冲锋"))return false;
        if(u.line==="rear"&&!u.card.keywords.includes("远程"))return false;
        return true
    });
    let i=0;
    function next(){
        if(i>=atks.length||G.over){render();cb();return}
        const atk=atks[i++];
        if(atk.acted){next();return}
        if(canHQ(atk)){const d=effAtk(atk,G.bf,false);G.p.hqHp-=d;atk.acted=true;log("  💥 AI "+atk.card.name+" 直击玩家HQ · "+d+"伤害","atk");shake();if(checkWin())return;setTimeout(next,400);return}
        const tgts=findTgt(atk);if(!tgts.length){next();return}
        tgts.sort((a,b)=>{const ak=calcDmg(atk,a).d>=a.hp?-100:0,bk=calcDmg(atk,b).d>=b.hp?-100:0;return(ak+a.hp)-(bk+b.hp)});
        const def=tgts[0];const r=calcDmg(atk,def);
        if(r.ev){log("  ⚡ "+def.card.name+" 闪避了AI "+atk.card.name+" 的攻击");atk.acted=true;setTimeout(next,300);return}
        def.hp-=r.d;atk.hp-=r.c;atk.acted=true;maybeShake(def,r.d);maybeShake(atk,r.c);
        let smash=0;if(atk.card.keywords.includes("突破")&&def.hp<=0){smash=Math.abs(def.hp);if(smash>0)G.p.hqHp-=smash}
        cleanDead();
        let msg="  ⚔ AI "+atk.card.name+" → "+def.card.name+" · "+r.d+"伤害";
        if(r.c>0)msg+=" · 反击"+r.c;if(dead(def))msg+=" · 💀击杀";if(smash>0)msg+=" · 突破"+smash+"打HQ";
        log(msg,"atk");shake();if(checkWin())return;setTimeout(next,400)
    }
    setTimeout(next,200)
}

// ========== RENDER ==========
function render(){
    renderIB();renderHQ();renderBF();renderHand();renderAB()
}

function renderIB(){
    const p=G.p;
    document.getElementById("ph").textContent=G.phase==="deploy"?"部署阶段":G.phase==="advance"?"推进阶段":G.phase==="attack"?"攻击阶段":G.phase==="enemy"?"AI 回合":"—";
    document.getElementById("tn").textContent=G.turn;
    document.getElementById("od").textContent=p.curOrd+"/"+p.maxOrd;
    document.getElementById("hcnt").textContent=p.hand.length;
    document.getElementById("dcnt").textContent=p.deck.length
}

function renderHQ(){
    const pH=Math.max(0,G.p.hqHp),eH=Math.max(0,G.e.hqHp);
    document.getElementById("pt").textContent=pH+"/"+HQ_HP;
    document.getElementById("et").textContent=eH+"/"+HQ_HP;
    document.getElementById("pf").style.width=(pH/HQ_HP*100)+"%";
    document.getElementById("ef").style.width=(eH/HQ_HP*100)+"%";
    document.getElementById("pf").classList.toggle("crit",pH<=5);
    document.getElementById("ef").classList.toggle("crit",eH<=5);
    document.getElementById("pl").textContent=G.p.faction+" 指挥部";
    document.getElementById("el").textContent=G.e.faction+" 指挥部";
    const fc=f=>f==="法兰西"?"var(--f-france)":f==="普鲁士"?"var(--f-prussia)":"var(--f-russia)";
    document.getElementById("hq-p").style.borderLeftColor=fc(G.p.faction);
    document.getElementById("hq-e").style.borderLeftColor=fc(G.e.faction)
}

function renderBF(){
    const lines=[
        {id:"r-er",units:G.bf.eR,isPl:false,line:"rear",side:"e"},
        {id:"r-em",units:G.bf.eM,isPl:false,line:"main",side:"e"},
        {id:"r-sk",units:[...G.bf.eS,...G.bf.pS],isPl:null,line:"skirmish",side:"s"},
        {id:"r-pm",units:G.bf.pM,isPl:true,line:"main",side:"p"},
        {id:"r-pr",units:G.bf.pR,isPl:true,line:"rear",side:"p"}
    ];
    const tgts=selAtk?findTgt(selAtk):[];
    for(const l of lines){
        const row=document.getElementById(l.id);let h="";
        for(let s=0;s<4;s++){
            const u=l.units.find(x=>x.slot===s);
            const lk=l.line;
            if(u){
                const pl=isP(u);
                // Determine if this unit can advance (advance phase, player's unit, eligible)
                const canAdv=G.phase==="advance"&&pl&&!dead(u)&&!u.shaken&&!u.deployed&&G.p.curOrd>0&&(u.line==="rear"||u.line==="main"&&!u.deployed);
                const canAct=G.phase==="attack"&&pl&&!u.acted&&!dead(u)&&!u.shaken&&(!u.deployed||u.card.keywords.includes("冲锋"))&&(u.line!=="rear"||u.card.keywords.includes("远程"));
                const isTgt=tgts.includes(u);
                const isSel=selAtk===u;
                let cls="uc t-"+u.card.unitType+" "+fkey(u.card.faction);
                if(dead(u))cls+=" dead";if(u.shaken)cls+=" shk";
                if(canAdv)cls+=" adv";
                else if(canAct)cls+=" act";
                if(isSel)cls+=" sel";
                const dm=u.hp>0&&u.hp<u.card.health;
                const hpCls=dead(u)?"d":dm?"d":"ok";
                // Build slot class
                let slCls="sl";
                if(G.phase==="deploy"&&l.id==="r-pr"&&!u)slCls+=" clk";
                else if(isTgt)slCls+=" tgt";
                else if(G.phase==="attack"&&tgts.length)slCls+=" tgt"; // show all slots as targets when in attack mode
                // Determine click handler for slot
                const lineParam=lk;
                // For unit clicks
                let ucClick="";
                if(canAdv)ucClick=`onclick="event.stopPropagation();clickAdv(G.bf.${pl?(u.line==='rear'?'pR':'pM'):(u.line==='rear'?'eR':'eM')}.find(x=>x.id==='${u.id}'))"`;
                else if(canAct)ucClick=`onclick="event.stopPropagation();selAtkU(G.bf.${pl?(u.line==='rear'?'pR':u.line==='main'?'pM':'pS'):(u.line==='rear'?'eR':u.line==='main'?'eM':'eS')}.find(x=>x.id==='${u.id}'))"`;

                h+=`<div class="${slCls}" onclick="clickSl('${lineParam}',${s})"><div class="${cls}" ${ucClick}><div class="uct">${u.card.cost}</div><div class="ucn">${esc(u.card.name)}</div><div class="ucty">${u.card.unitType}</div><div class="ucs"><span class="uca">${effAtk(u,G.bf,pl)}</span><span class="uchp ${hpCls}">${Math.max(0,u.hp)}/${u.card.health}</span></div>${u.shaken?'<div class="uc-sh">动摇</div>':''}${u.evaded?'<div class="uc-ev">闪避✓</div>':''}</div></div>`
            }else{
                let slCls="sl";
                const canDrop=G.phase==="deploy"&&l.id==="r-pr";
                const canTgt=G.phase==="attack"&&tgts.length>0;
                if(canDrop||canTgt)slCls+=" clk";
                h+=`<div class="${slCls}" onclick="clickSl('${lk}',${s})"></div>`
            }
        }
        row.innerHTML=h
    }
    // Update attack slots highlight
    if(G.phase==="attack"&&selAtk){
        const canHQAttack=canHQ(selAtk);
        if(canHQAttack){
            const hqEl=document.getElementById("hq-e");
            if(hqEl){hqEl.style.cursor="pointer";hqEl.style.borderColor="var(--blood-bright)";
                hqEl.onclick=()=>atkHQ(selAtk,false)}
        }
    }
}

function renderHand(){
    const area=document.getElementById("ha");
    if(G.phase!=="deploy"){area.style.display="none";return}
    area.style.display="flex";let h="";
    for(let i=0;i<G.p.hand.length;i++){
        const c=G.p.hand[i];
        const no=c.cardType==="unit"&&c.cost>G.p.curOrd;
        const sel=selHand===i;
        let cls="hc"+(sel?" sel":"")+(no?" no":"");
        h+=`<div class="${cls}" onclick="selHC(${i})"><div class="hcc">${c.cost}</div><div class="hcn">${esc(c.name)}</div><div class="hci">${c.unitType}</div>`;
        if(c.cardType==="unit")h+=`<div class="hcs"><span style="color:var(--blood)">${c.attack}</span><span>${c.health}</span></div>`;
        h+=`</div>`
    }
    area.innerHTML=h
}

function renderAB(){
    const bar=document.getElementById("abar");
    if(!G||G.over){bar.style.display="none";return}
    bar.style.display="flex";
    const ph=document.getElementById("phi");
    const hint=document.getElementById("ahi");
    const ba=document.getElementById("ba");
    const be=document.getElementById("be");
    if(G.phase==="deploy"){
        ph.textContent="部署";hint.textContent="选择手牌 → 点击后方空槽位部署";
        ba.style.display="inline-block";ba.textContent="进入推进";ba.disabled=false;
        ba.onclick=()=>{G.phase="advance";selHand=null;selAtk=null;advMode=true;render()};
        be.style.display="inline-block"
    }else if(G.phase==="advance"){
        ph.textContent="推进";hint.textContent="点击带蓝色光效的单位推进（后方→主力→散兵）";
        ba.style.display="inline-block";ba.textContent="进入攻击";ba.disabled=false;
        ba.onclick=()=>{G.phase="attack";selHand=null;selAtk=null;render()};
        be.style.display="inline-block"
    }else if(G.phase==="attack"){
        ph.textContent="攻击";hint.textContent="点击可行动单位 → 点击目标攻击";
        ba.style.display="none";be.style.display="inline-block"
    }else if(G.phase==="enemy"){
        ph.textContent="AI";hint.textContent="AI 正在行动...";
        ba.style.display="none";be.style.display="none"
    }
}

// ========== INIT ==========
function startGame(f){
    document.getElementById("sel").style.display="none";
    document.getElementById("gs").style.display="block";
    document.getElementById("abar").style.display="flex";
    G=init(f);
    log("对局开始 · 玩家 "+f+" vs AI "+G.e.faction);
    startPTurn()
}
</script>
</body>
